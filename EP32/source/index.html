<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx, mark } = NSP;
const T = window.TL, D = k => T[k][1];
const HK = T.hook[0], ST = T.story[0], KN = T.know[0], EX = T.expl[0], QS = T.quiz[0], CD = T.cd[0], AN = T.ans[0], PR = T.promo[0];
const add = (parent, html) => { const e = h(html); parent.appendChild(e); return e; };
const hideEl = el => tf(el, { o: 0 });
const L = (u, a, b = 1e9, o = {}) => life(u, a, b, { from: .5, dy: 40, ...o });
const BR = '../../shared/brand/';

// ---------- shared drawing helpers ----------
const THEME = { gold: ['#FFD23F', '#F2C766', '#142B53'], pink: ['#EE7FAA', '#F7A8C8', '#fff'], blue: ['#2F6BFF', '#6F9FF0', '#fff'], navy: ['#142B53', '#2A4A80', '#fff'], cyan: ['#22D3EE', '#7FE6F5', '#142B53'], gray: ['#8A97AD', '#B7C2D3', '#fff'] };
// legal document card: abstract (non-legible) body lines only — no real statutory text
function docHTML(title, theme, w = 230, { sub = '', fs, lines = 4, cls = '' } = {}) {
  const [c1, c2, tc] = THEME[theme], hh = Math.round(w * 1.25);
  const bars = [...Array(lines)].map((_, i) => `<div class="ln${i}" style="position:relative;height:${Math.round(w * .055)}px;width:${[92, 80, 88, 64, 84, 70][i]}%;border-radius:8px;background:#DCE6F4;margin-bottom:${Math.round(w * .06)}px;overflow:hidden"><div class="lh" style="position:absolute;inset:0;background:#EF4444;opacity:0;border-radius:8px"></div></div>`).join('');
  return `<div class="${title ? 'ess ' : ''}${cls}" style="position:relative;width:${w}px;height:${hh}px;border-radius:${Math.round(w * .09)}px;background:linear-gradient(180deg,#fff,#F4F8FF);box-shadow:0 16px 30px rgba(20,43,83,.25),0 0 0 5px #fff;overflow:hidden">
    <div style="height:${Math.round(w * .44)}px;background:linear-gradient(135deg,${c1},${c2});display:flex;flex-direction:column;align-items:center;justify-content:center;color:${tc};font-weight:800;font-size:${fs || Math.round(w * .16)}px;line-height:1.25;text-align:center;padding:0 8px">${title}${sub ? `<div style="font-size:${Math.round(w * .095)}px;font-weight:700;opacity:.92">${sub}</div>` : ''}</div>
    <div style="padding:${Math.round(w * .1)}px ${Math.round(w * .11)}px 0">${bars}</div></div>`;
}
function docEl(parent, title, theme, w, o) { const e = add(parent, `<div class="lc c">${docHTML(title, theme, w, o)}</div>`); e.w = w; e.hh = Math.round(w * 1.25); return e; }
// place an element by its centre
function at(el, cx, cy, l = {}, w = el.w || el.offsetWidth, hh = el.hh || el.offsetHeight) { tf(el, { ...l, x: cx - w / 2, y: cy - hh / 2 + (l.y || 0) }); }
// balancing scale whose pans carry cards; tilt deg (+ = right side lower)
function scaleRig(parent, size) {
  const wrap = add(parent, `<div class="lc c" style="width:${size}px;height:${size * 1.05}px"></div>`);
  const sc = LEGAL.scales(size); wrap.appendChild(sc);
  return {
    wrap, sc, size,
    pans(x0, y0, deg) {
      const k = size / 400, a = deg * Math.PI / 180, dx = (140 - 140 * Math.cos(a)) * k, dy = 140 * Math.sin(a) * k;
      sc.tilt(deg);
      return [[x0 + 60 * k + dx, y0 + 240 * k - dy], [x0 + 340 * k - dx, y0 + 240 * k + dy]];
    },
  };
}
function sitOn(el, p, l = {}) { tf(el, { ...l, x: p[0] - el.w / 2, y: p[1] - el.hh - 4 + (l.y || 0) }); }
// small card used on scales / trays
function lawCard(parent, ab, full, theme = 'blue', w = 190) {
  const [c1, c2, tc] = THEME[theme];
  const e = add(parent, `<div class="lc c ess" style="width:${w}px;height:${Math.round(w * .74)}px;border-radius:24px;background:#fff;box-shadow:0 12px 24px rgba(20,43,83,.25),0 0 0 4px #fff;overflow:hidden;display:flex;flex-direction:column">
    <div style="height:56%;display:grid;place-items:center;background:linear-gradient(135deg,${c1},${c2});color:${tc};font-weight:800;font-size:${Math.round(w * .23)}px;line-height:1.2">${ab}</div>
    <div style="flex:1;display:grid;place-items:center;font-weight:700;font-size:${Math.round(w * .13)}px;color:#31445D;line-height:1.3">${full}</div></div>`);
  e.w = w; e.hh = Math.round(w * .74); return e;
}
function mascot(parent, src, hgt, x, y) { return add(parent, `<div class="mas" style="left:${x}px;top:${y}px"><img src="${BR}${src}" style="height:${hgt}px"></div>`); }
function masDraw(el, u, a, b = 1e9, { amp = 6, ph = 0 } = {}) {
  const l = life(u, a, b, { from: .3, dy: 160, d: .8, el: true, out: .3 });
  tf(el, { ...l, y: l.y + bob(u, ph, amp), r: Math.sin(u * 1.7 + ph) * 2.5, sx: l.s * (1 + .02 * Math.sin(u * 3.4 + ph)), sy: l.s * (1 - .02 * Math.sin(u * 3.4 + ph)) });
}
const IC = {
  qm: (s, c = '#FFD23F') => `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${c};display:grid;place-items:center;font-weight:800;font-size:${s * .7}px;color:#142B53;box-shadow:0 0 0 ${s * .06}px #fff,0 10px 20px rgba(0,0,0,.25);line-height:1">?</div>`,
  stop: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="#EF4444" stroke="#fff" stroke-width="1.6"/><path d="M7 12h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,
  clock: (s, c = '#EE7FAA') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8.5" fill="#fff" stroke="${c}" stroke-width="2.4"/><path d="M12 8.5V13l3 2" stroke="${c}" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M5 4l-2.5 2.5M19 4l2.5 2.5" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  hall: (s, c = '#2F6BFF') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.5 21 7H3z" fill="${c}"/><rect x="3" y="7.5" width="18" height="2" rx=".6" fill="${c}"/><path d="M5.5 10.5v7M9.5 10.5v7M14.5 10.5v7M18.5 10.5v7" stroke="${c}" stroke-width="2" stroke-linecap="round"/><rect x="2" y="18.5" width="20" height="2.6" rx=".8" fill="${c}"/></svg>`,
  local: (s, c = '#22D3EE') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="12" rx="1.5" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M2.5 9.5 12 3l9.5 6.5" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/><rect x="10" y="14.5" width="4" height="6.5" rx="1" fill="${c}"/><rect x="6.5" y="12" width="2.6" height="2.6" rx=".5" fill="${c}"/><rect x="14.9" y="12" width="2.6" height="2.6" rx=".5" fill="${c}"/><path d="M12 3V1" stroke="${c}" stroke-width="1.6"/></svg>`,
  arrowD: (s, c = '#2F6BFF') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 3v15M6 12l6 7 6-7" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  arrowR: (s, c = '#2F6BFF') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M3 12h15M12 6l7 6-7 6" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  neq: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M16 4 8 20" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>`,
  bulb: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4.9 1 .9 1.6V16h5.2v-.5c0-.6.3-1.2.9-1.6A6 6 0 0 0 12 3z" fill="#FFD23F" stroke="#C99A3E" stroke-width="1"/></svg>`,
  thumb: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M7 10v11H3V10zM9 21h8.5a2 2 0 0 0 2-1.6l1.3-6.6A2 2 0 0 0 18.8 10H14l.8-4.2A1.8 1.8 0 0 0 13 3.6L9 10z" fill="${c}"/></svg>`,
  share: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="${c}"/><circle cx="6" cy="12" r="3" fill="${c}"/><circle cx="18" cy="19" r="3" fill="${c}"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4" stroke="${c}" stroke-width="2.2"/></svg>`,
  bell: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z" fill="${c}"/><path d="M10 21a2 2 0 0 0 4 0" stroke="${c}" stroke-width="2" fill="none"/></svg>`,
  chat: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="${c}"/><path d="M7 9h10M7 13h7" stroke="#EE7FAA" stroke-width="2" stroke-linecap="round"/></svg>`,
};

// ======================================================================
// SCENE 1 — HOOK (01_hook.mp3)
// phrases: 0.06 เตรียมสอบนายสิบ! | 1.38 วิชากฎหมาย ข้อนี้หลายคนจำลำดับผิด | 5.10 ระหว่าง พ.ร.บ.(5.55) | 6.54 กับ พ.ร.ก.(6.73)
//          7.83 ไหนมีศักดิ์สูงกว่ากัน? | 10.94 · 13.43 แล้วรัฐธรรมนูญ(13.72) | 14.76 พ.ร.ฎ.(14.77) กฎกระทรวง(16.21) อยู่ตรงไหน
//          19.58 วันนี้เราจะมาเรียงลำดับศักดิ์ของกฎหมาย… | 24.70 · 26.83
// ======================================================================
const HR = $('h-root');
const hDocs = [0, 1, 2, 3].map(i => { const e = docEl(HR, ['', '', '', ''][i], ['gold', 'pink', 'blue', 'navy'][i], 250, { lines: 5 }); return e; });
const hTitle = add(HR, `<div class="abs c ess" style="left:250px;width:580px;top:500px;white-space:nowrap;text-align:center;font-weight:800;font-size:116px;line-height:1.18;color:#fff;text-shadow:0 6px 0 #C99A3E,0 0 40px rgba(255,210,63,.45)">เตรียมสอบ<br><span style="color:#FFD23F;text-shadow:0 6px 0 #8A6414,0 0 40px rgba(255,210,63,.5)">นายสิบ</span></div>`);
const hSubj = add(HR, `<div class="row c" style="top:830px"><div class="pillx hpill pink ess" style="font-size:46px">${ICON.book(48, '#fff')}วิชากฎหมาย</div></div>`);
const hTrap = add(HR, `<div class="row c" style="top:950px"><div class="pillx ess" style="font-size:40px;padding:12px 30px;color:#fff;background:linear-gradient(90deg,#EF4444,#F87171);box-shadow:0 10px 24px rgba(239,68,68,.45)">ข้อนี้หลายคนจำลำดับผิด!</div></div>`);
const hSc = scaleRig(HR, 520);
const hPB = lawCard(HR, 'พ.ร.บ.', 'พระราชบัญญัติ', 'blue', 200), hPK = lawCard(HR, 'พ.ร.ก.', 'พระราชกำหนด', 'blue', 200);
const hQ = add(HR, `<div class="lc c">${IC.qm(120)}</div>`);
const hAsk = add(HR, `<div class="row c" style="top:1290px"><div class="pillx hpill gold ess" style="font-size:42px">ฉบับไหนมีศักดิ์สูงกว่า?</div></div>`);
const hPyr = HIER.build(HR, { top: 470, scale: .92 });
const hFly = [['รัฐธรรมนูญ', 'gold', 370, 600, -1], ['พ.ร.ฎ.', 'navy', 710, 980, 1], ['กฎกระทรวง', 'navy', 370, 1150, -1]].map(([t, th, x, y, sd]) => { const e = docEl(HR, t, th, 170, { lines: 3, fs: t.length > 8 ? 25 : 30 }); e.p = { x, y, sd }; return e; });
const hWhere = add(HR, `<div class="row c" style="top:1310px"><div class="pillx hpill gold ess" style="font-size:42px">อยู่ตรงไหนของลำดับ?</div></div>`);
const hBanner = add(HR, `<div class="row c" style="top:1300px"><div class="pillx ess" style="font-size:44px;padding:12px 30px;color:#142B53;background:linear-gradient(90deg,#FFD23F,#FFE58A);box-shadow:0 0 0 6px #fff,0 16px 34px rgba(0,0,0,.35)">ลำดับศักดิ์ของกฎหมายไทย</div></div>`);
const hEp = add(HR, `<div class="row c" style="top:376px"><div class="pillx" style="font-size:32px;padding:8px 26px;color:#142B53;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.25)">EP.32 · วิชากฎหมาย</div></div>`);
const hMas = mascot(HR, 'mascot_pose.png', 380, 820, 1440);
const hc = { sub: 1.38, trap: 2.5, out: 4.75, pb: 5.10, pk: 6.54, q: 7.83, py: 13.2, c1: 13.6, c2: 14.77, c3: 16.21, where: 17.3, build: 19.58, ban: 21.6, mas: 24.7 };
sfx('sparkle', .15, .6); sfx('pop', hc.sub, .8); sfx('stamp', hc.trap, .7); sfx('whoosh', hc.out, .5);
sfx('drop', hc.pb + .35, .8); sfx('drop', hc.pk + .35, .8); sfx('pop', hc.q, .9);
sfx('whoosh', hc.py, .6); [hc.c1, hc.c2, hc.c3].forEach(a => { sfx('whoosh', a, .5); sfx('page', a + .2, .6); }); sfx('pop', hc.where, .7);
[0, 1, 2, 3].forEach(i => sfx('drop', hc.build + .25 + i * .38, .9)); sfx('riser', hc.build, .5); sfx('sparkle', hc.build + 1.9, .8); sfx('ding', hc.ban, .7); sfx('pop', hc.mas, .7);
function drawHook(t) {
  const u = t - HK;
  tf($('h-beams'), { r: u * 6, o: .9 });
  // opening: title fully visible at frame 0 (no entrance), documents stacked vertically behind
  const out = E.inOut(P(u, hc.out, .7));
  hDocs.forEach((d, i) => { const y = 380 + i * 250; at(d, i % 2 ? 860 : 220, y + bob(u, i, 8), { r: (i % 2 ? 8 : -8) + Math.sin(u + i) * 2, o: (.85 - .1 * i) * (1 - out) * (1 - P(u, hc.out, .5)), s: 1 + .02 * Math.sin(u * 2 + i) }); });
  tf(hTitle, { s: (1 + .03 * Math.sin(u * 3) * (1 - out)) * lerp(1, .42, out), y: lerp(0, -222, out), o: 1 - P(u, hc.py - .4, .4) });
  const sl = L(u, hc.sub, hc.out, { from: .4, el: true }); tf(hSubj, sl);
  const tr = L(u, hc.trap, hc.out, { from: 1.6, dy: 0 }); tf(hTrap, { ...tr, r: -3 + Math.sin(u * 8) * 1.5 * clamp(u - hc.trap) });
  // the big question: two equal cards on a scale, undecided wobble, no answer shown
  const scl = life(u, hc.out + .2, hc.py, { from: .5, dy: 120, d: .7 });
  const sx0 = 540 - 260, sy0 = 640;
  tf(hSc.wrap, { ...scl, x: sx0, y: sy0 + scl.y });
  const wob = Math.sin(u * 2.2) * 9 * clamp((u - hc.pk) * 2);

// ---------- safe-zone QC hook: boxes of visible essential text ----------
window.QC_BOXES = function () {
  const out = [];
  document.querySelectorAll('.ess').forEach(el => {
    let o = 1, n = el;
    while (n && n !== document.body) { const cs = getComputedStyle(n); if (cs.display === 'none' || cs.visibility === 'hidden') { o = 0; break; } o *= +cs.opacity; n = n.parentElement; }
    if (o < .5) return;
    const r = el.getBoundingClientRect(); if (r.width < 2) return;
    out.push({ text: el.textContent.trim().replace(/\s+/g, ' ').slice(0, 40), x0: Math.round(r.left), y0: Math.round(r.top), x1: Math.round(r.right), y1: Math.round(r.bottom), o: +o.toFixed(2) });
  });
  return out;
};
