<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const FR = x => Math.round(x * T.fps) / T.fps - 1e-6;      // snap a cue onto its exact frame
const ZX = 190, ZW = 680, ZC = 530;                          // Central Safe Zone V2: x 190–870, y 300–1430
const UP = '#1FA463', DN = '#E8445A', B1 = '#3E7BD6', B2 = '#7A5CE0', GOLD = '#F2B544', NAVY = '#1F2D50';

// ---------------- the maths: one source of truth for every number shown ----------------
const P0 = 100, RATE = 20;
const INC = P0 * RATE / 100;      // 20% of 100 = 20
const P1 = P0 + INC;              // 120
const DEC = P1 * RATE / 100;      // 20% of 120 = 24 (the base has changed)
const P2 = P1 - DEC;              // 96
const OPTS = [['ก', 94], ['ข', 96], ['ค', 100], ['ง', 104]];
const CORRECT = OPTS.findIndex(o => o[1] === P2);
if (INC !== 20 || P1 !== 120 || DEC !== 24 || P2 !== 96 || CORRECT !== 1 || OPTS.filter(o => o[1] === P2).length !== 1) throw new Error('EP13 maths check failed');
const PROMO_CUES = [0.06, 5.27, 7.64, 8.88, 10.15, 12.12, 13.46, 14.72];   // measured phrase starts in 07_promotion

const add = (root, html) => { const el = h(html); root.appendChild(el); return el; };
const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; };
const chip = (root, top, cls, html, size = 38) => add(root, `<div class="Z zc c" style="top:${top}px"><span class="chip2 ${cls}" style="font-size:${size}px">${html}</span></div>`);
const mascot = (root, file, x, y, hgt) => add(root, `<div class="mas" style="left:${x}px;top:${y}px"><img src="../../shared/brand/${file}" style="height:${hgt}px"></div>`);
const pct = (cls, s = RATE) => `<span class="pc ${cls}">${s}%</span>`;
// zone-safe entrance/exit for elements near the top edge: rise in from below, sink out downward
function lifeT(u, a, b = 1e9, o = {}) { const l = life(u, a, b, { ...o, dy: Math.abs(o.dy ?? 20) }); l.y += 50 * E.out(P(u, b, o.out ?? .3)); return l; }
function masDraw(el, u, a, b = 1e9, { amp = 5, ph = 0, jump = 0 } = {}) {
  const l = life(u, a, b, { from: .3, dy: 0, d: .7, el: true, out: .3 });
  tf(el, { ...l, y: l.y + bob(u, ph, amp) - (jump ? Math.abs(Math.sin(u * 6)) * jump : 0), r: Math.sin(u * 1.7 + ph) * 2, sx: l.s * (1 + .02 * Math.sin(u * 3.4)), sy: l.s * (1 - .02 * Math.sin(u * 3.4)) });
}
function camTrack(u, keys) {   // [t, cx, cy, z, easeDur]
  let i = 0; while (i < keys.length - 1 && keys[i + 1][0] <= u) i++;
  const k = keys[i], pv = keys[Math.max(0, i - 1)], e = k[4] > 0 ? E.inOut(P(u, k[0], k[4])) : 1, from = k[4] > 0 && i > 0 ? pv : k;
  return [lerp(from[1], k[1], e), lerp(from[2], k[2], e), lerp(from[3], k[3], e) * (1 + .006 * Math.min(5, u - k[0]))];
}
// odometer value over keyed rolls [[t0, dur, from, to], ...] (later keys win); returns [value, |dv/dt|]
function roll(u, keys, v0 = 0) {
  let v = v0, vel = 0;
  for (const [a, d, f, to] of keys) if (u >= a) { const e = E.inOut(clamp((u - a) / d)), e2 = E.inOut(clamp((u - a - 1 / 30) / d)); v = lerp(f, to, e); vel = Math.abs(lerp(f, to, e) - lerp(f, to, e2)) * 30; }
  return [v, vel];
}
const pulse = (u, at, w = .3, a = .1) => 1 + a * Math.max(0, 1 - Math.abs(u - at) / w);
const ICO = {
  warn: (s, c = '#FFE08A') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.8 L22.4 20.6 H1.6 Z" fill="${c}" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v5.4" stroke="#B5233B" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.5" fill="#B5233B"/></svg>`,
  hand: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10V4a1.5 1.5 0 0 1 3 0v6V5a1.5 1.5 0 0 1 3 0v6.5V8a1.5 1.5 0 0 1 3 0v7c0 4-3 7-7 7h-.6c-2.2 0-4-1-5.2-2.8L3.6 14.5a1.6 1.6 0 0 1 2.6-1.9L7 13.6" fill="${c}" stroke="#B5233B" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  mag: (s, c = '#3E7BD6') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.2" fill="rgba(255,255,255,.35)" stroke="${c}" stroke-width="2.6"/><path d="M14.6 14.6 L21 21" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/><path d="M7 8.2a3.4 3.4 0 0 1 3-2.4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`,
  calc: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="3" fill="none" stroke="${c}" stroke-width="2.2"/><rect x="7.5" y="5.5" width="9" height="4" rx="1" fill="${c}"/><g fill="${c}"><circle cx="8.6" cy="13" r="1.2"/><circle cx="12" cy="13" r="1.2"/><circle cx="15.4" cy="13" r="1.2"/><circle cx="8.6" cy="17" r="1.2"/><circle cx="12" cy="17" r="1.2"/><circle cx="15.4" cy="17" r="1.2"/></g></svg>`,
  target: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="2.2"/><circle cx="12" cy="12" r="5" fill="none" stroke="${c}" stroke-width="2.2"/><circle cx="12" cy="12" r="1.8" fill="${c}"/></svg>`,
  bolt: (s, c = '#F2B544') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M13.5 2 L5 13.5 H11 L10 22 L19 10 H13 Z" fill="${c}" stroke="${c}" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
  clock: (s, c = '#3E7BD6') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M12 7v5.2l3.4 2" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  cal: (s, c = '#E8445A') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M3 10h18M8 3v4M16 3v4" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/><path d="M8.5 15h7" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  store: (s, c = '#3E7BD6') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M3 9.5 L4.6 4 H19.4 L21 9.5 Q21 12 18.5 12 Q16 12 16 9.5 Q16 12 13.5 12 Q12 12 12 9.5 Q12 12 9.5 12 Q8 12 8 9.5 Q8 12 5.5 12 Q3 12 3 9.5Z" fill="#F5A9C7" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 12.5V20h14v-7.5" fill="none" stroke="${c}" stroke-width="2"/><rect x="10" y="15" width="4" height="5" fill="${c}"/></svg>`,
  coins: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><ellipse cx="12" cy="17" rx="7" ry="2.6" fill="#D9A53A"/><rect x="5" y="11" width="14" height="6" fill="#E7B84A"/><ellipse cx="12" cy="11" rx="7" ry="2.6" fill="#F6D77E"/><path d="M12 2.5v6M9.5 5 12 2.5 14.5 5" stroke="#17834F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  eye: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M2 12 Q12 3 22 12 Q12 21 2 12Z" fill="none" stroke="${c}" stroke-width="2.2"/><circle cx="12" cy="12" r="3.6" fill="${c}"/></svg>`,
  dice: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="#fff" stroke="#7A8BA3" stroke-width="2"/><g fill="#7A8BA3"><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/></g><path d="M3 21 L21 3" stroke="#E8445A" stroke-width="2.8" stroke-linecap="round"/></svg>`,
  key: (s, c = '#4A3000') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4.4" fill="none" stroke="${c}" stroke-width="2.4"/><path d="M12.4 12 H21 M18 12v3.4 M21 12v2.6" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
};
const NEQ = (s, c = DN) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M16 4L8 20" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const ARR = (w, c) => `<svg width="${w}" height="40" viewBox="0 0 ${w} 40" style="display:block"><path d="M4 20 H${w - 16}" stroke="${c}" stroke-width="7" stroke-linecap="round"/><path d="M${w - 26} 8 L${w - 6} 20 L${w - 26} 32" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ======================================================================
// THE BOUTIQUE (background for everything except the promo)
// ======================================================================
const shop = SHOP.shop($('world'));
const actor = (kind, x, y, s) => { const c = STORY.character(kind); const w = add(shop.actors, '<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>'); w.appendChild(c); w.style.transform = `translate(${x}px,${y}px) scale(${s})`; c.X = x; c.Y = y; c.SC = s; return c; };
const keeper = actor('Shop', 1720, 1440, .8);            // behind the cashier counter (the counter front covers the legs)
const cusA = actor('A', 690, 1548, .82), cusF = actor('F', 860, 1530, .8);
const wprod = shop.wprod;                                  // the hero product on the plinth (same object in every shot)
const PROD = { x: 1200, top: 1047, mid: 1112, base: 1185, lidX: 1226, lidY: 1073 };
let CAM = [1200, 1100, 1];
const w2s = (x, y) => [540 + (x - CAM[0]) * CAM[2], 960 + (y - CAM[1]) * CAM[2]];
function world(cam, t, { blur = 0, veil = 0, dof = .25, sat = 1 } = {}) {
  CAM = cam; shop.camera(cam[0], cam[1], cam[2], t, dof);
  $('world').style.display = 'block';
  const f = (blur > .05 ? `blur(${blur}px) ` : '') + (sat < .999 ? `saturate(${sat})` : '');
  $('world').style.filter = f.trim();
  $('veil').style.opacity = veil;
  wprod.spin(t * .09);
}
// soft light motes drifting in the spotlight (hook + story)
const dust = [...Array(16)].map((_, i) => { const s = 10 + (i * 37) % 22; return { el: add($('dust'), `<div style="position:absolute;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,250,235,0) 70%)"></div>`), x: (i * 211) % 1080, y: (i * 389) % 1920, sp: 14 + (i * 7) % 20, ph: i * 1.3 }; });
function drawDust(t, o) {
  $('dust').style.opacity = o; if (o < .01) return;
  dust.forEach(d => { let y = (d.y - t * d.sp) % 1980; if (y < -60) y += 1980; tf(d.el, { x: d.x + Math.sin(t * .5 + d.ph) * 40, y, o: .35 + .35 * Math.sin(t * 1.1 + d.ph) }); });
}
const bok = [...Array(11)].map((_, i) => { const s = 120 + (i * 53) % 160, c = ['255,255,255', '255,214,236', '196,224,255', '255,236,190'][i % 4]; return { el: add($('bokeh'), `<div style="position:absolute;width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle,rgba(${c},.75),rgba(${c},0) 68%)"></div>`), x: (i * 293) % 1080 - 60, y: (i * 421) % 1920, sp: 8 + (i * 5) % 14, ph: i * 1.7 }; });
function drawBokeh(t, o) {
  $('bokeh').style.opacity = o; if (o < .01) return;
  bok.forEach(b => { let y = (b.y - t * b.sp) % 2100; if (y < -200) y += 2100; tf(b.el, { x: b.x + Math.sin(t * .3 + b.ph) * 60, y, o: .5 + .3 * Math.sin(t * .7 + b.ph) }); });
}
// card entrance with a 3D tilt (handcrafted, not a preset pop)
function lifeX(u, a, b = 1e9, { from = .88, dy = 50, d = .7, out = .3 } = {}) {   // no overshoot: wide cards never grow past their resting size
  const pi = P(u, a, d), po = P(u, b, out);
  return { s: lerp(from, 1, E.out(pi)) * (1 - .12 * E.out(po)), o: clamp(pi * 2.5) * (1 - po), y: (1 - E.out(pi)) * dy - 30 * E.out(po), rx: (1 - E.out(P(u, a, .8))) * 38 };
}
function idle(c, u, o = {}) { c.pose({ t: u, expr: 'smile', blink: STORY.blinkAt(u, c.X * .001), armL: [8, -4], armR: [8, -4], ...o }); }
// price tag hung from the product with a string (screen space, follows the camera)
function makeTag(root, w, size) {
  const str = add(root, `<svg class="abs" style="left:0;top:0;width:1080px;height:1920px;overflow:visible;pointer-events:none"><path d="" stroke="#8A97AD" stroke-width="3" fill="none"/></svg>`);
  const tg = SHOP.tag({ w, size }); root.appendChild(tg);
  return { tg, str, path: str.querySelector('path') };
}
function hangTag(T0, x, y, o, sw, s = 1) {      // tag top-left (screen), opacity, swing deg
  T0.tg.style.transform = `translate(${x}px,${y}px) perspective(900px) rotateY(${sw * .6}deg) rotate(${sw}deg) scale(${s})`;
  T0.tg.style.opacity = o; T0.tg.style.visibility = o < .01 ? 'hidden' : 'visible';
