<body>
<div id="stage">
  <div class="scene" id="sW" style="background:#05080F">

    <div id="fxEv" class="abs" style="inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(127,224,240,.07) 0 2px,transparent 2px 60px),repeating-linear-gradient(90deg,rgba(127,224,240,.07) 0 2px,transparent 2px 60px);opacity:0"></div>

      <div class="abs" style="left:430px;top:820px;width:220px;height:140px;display:grid;place-items:center"><svg width="200" height="120" viewBox="0 0 200 120"><path d="M96 10 L20 60 L96 110Z M186 10 L110 60 L186 110Z" fill="rgba(235,245,255,.92)"/></svg></div></div>

<script>
const { $, clamp, lerp, E, P, tf, life, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const FR = x => Math.round(x * T.fps) / T.fps - 1e-6;
const ZX = 190, ZW = 680, ZC = 530, GY = CRIME.WORLD.ground;
const UI = $('ui');
const mk = (html, parent = UI) => { const el = h(html); parent.appendChild(el); return el; };
const ease = { lin: x => x, in: E.in || (x => x * x), out: E.out, io: E.inOut };

// ============================ choreography (story time τ, seconds) ============================
// numeric track: keys [τ, value, easeName]
function trk(keys) { return t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const a = keys[i - 1], b = keys[i], k = (t - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], (ease[b[2] || 'io'])(k)); } return keys[keys.length - 1][1]; }; }
// state track (pose / expression): keys [τ, name, blendSeconds]; blends from the previous key's value
function strk(keys, mix) { return t => { let i = 0; while (i < keys.length - 1 && keys[i + 1][0] <= t) i++; const k = keys[i]; if (i === 0) return mix(k[1], k[1], 1); const prev = strk(keys.slice(0, i), mix)(k[0]); return mix(prev, k[1], E.inOut(clamp((t - k[0]) / (k[2] || .3)))); }; }
const memo = f => { const c = new Map(); return t => { const key = Math.round(t * 1000); if (!c.has(key)) { if (c.size > 4000) c.clear(); c.set(key, f(t)); } return c.get(key); }; };
const poseT = keys => memo(strk(keys, CRIME.mixPose)), exprT = keys => memo(strk(keys, CRIME.mixExpr));
const STRIDE = { walk: 300, jog: 440, run: 560 };
// gait keys [τ, gait|null, blend]; the cycle phase follows distance travelled, so feet don't slide
function gaitAt(keys, t) { let i = -1; for (let k = 0; k < keys.length; k++) if (keys[k][0] <= t) i = k; if (i < 0) return { g: null, a: 0 }; const cur = keys[i], prev = i > 0 ? keys[i - 1] : [0, null]; const k = clamp((t - cur[0]) / (cur[2] || .3)); if (cur[1] && (!prev[1] || k >= 1)) return { g: cur[1], a: prev[1] ? 1 : k }; if (cur[1] && prev[1]) return { g: k < .5 ? prev[1] : cur[1], a: 1 }; return { g: prev[1], a: 1 - k }; }

// ---- NONT (faces right; starts right of the store door)
const NX = trk([[0, 1000], [12.55, 1000], [13.0, 930, 'out'], [14.05, 930], [14.3, 960, 'out'], [38.2, 960], [38.9, 1080, 'in'], [44.95, 3420, 'lin'], [45.2, 3450, 'out'], [46.4, 3490, 'out']]);
const NG = [[38.2, 'run', .5], [44.75, null, .2]];
const NP = poseT([[0, 'relaxed'], [6.9, 'stand', .8], [8.5, { ...CRIME.POSES.palms, armN: [24, 100], armF: [16, 104] }, .5], [9.9, 'stand', .5], [10.7, { ...CRIME.POSES.palms, armN: [24, 100], armF: [16, 104] }, .5], [12.55, 'recoilHead', .1], [13.15, 'guard', .45], [14.05, 'push', .18], [14.6, 'guard', .4], [16.4, 'handsDown', .7], [18.6, 'faceTouch', .7],
  [22.6, 'handsDown', 1.0], [25.4, 'stand', .8], [29.3, 'faceTouch', .7], [31.6, 'fists', .9], [35.6, { ...CRIME.POSES.fists, lean: 9, drop: 10 }, .8], [38.2, 'stand', .4], [44.85, { ...CRIME.POSES.punch, armN: [120, 0], armF: [10, 110], lean: 10 }, .14], [45.6, 'pant', .6], [48.5, 'stand', 1.6]]);
const NE = exprT([[0, 'relaxed'], [6.8, 'curious', .6], [8.5, 'surprised', .4], [10.0, 'hurt', .6], [12.55, 'pain', .08], [13.15, 'surprised', .3], [13.75, 'focused', .3], [16.6, 'relieved', .8], [19.2, 'hurt', .8], [22.6, 'relieved', 1],
  [25.4, 'hurt', .8], [31.0, 'angry', 1.4], [34.0, 'angry', .5], [36.4, 'impulsive', 1.2], [45.6, 'impulsive', .5], [47.6, 'stunned', 1.4]]);
const NLX = trk([[0, 0], [1.4, -.8], [2.6, -.8], [3.4, .6], [4.6, .6], [5.4, .2], [6.6, 1], [12.4, 1], [12.6, -.3], [13.1, .8], [17.0, 1], [18.8, .9], [25.4, 1], [29, .6], [31.6, 1]]);
// ---- TAE (enters from the right facing left; flees right after the push)
const TX = trk([[0, 2150], [4.6, 2150], [8.2, 1290, 'lin'], [10.6, 1275], [12.15, 1262], [12.5, 1238, 'out'], [12.95, 1250], [13.75, 1238], [14.3, 1238], [15.0, 1440, 'out'], [15.6, 1450, 'out'], [16.6, 1465], [17.5, 1495],
  [18.1, 1560, 'in'], [21.0, 2600, 'lin'], [23.5, 3000, 'out'], [27.5, 3350, 'out'], [40.5, 3350], [45.05, 3700, 'lin'], [45.2, 3712], [45.75, 3800, 'out'], [46.3, 3830, 'out']]);
const TDIR = t => t < 17.47 ? -1 : t < 17.63 ? lerp(-1, 1, (t - 17.47) / .16) : t < 44.5 ? 1 : t < 44.66 ? lerp(1, -1, (t - 44.5) / .16) : -1;   // quick 2D turns
const TG = [[4.6, 'walk', .4], [8.2, null, .35], [17.7, 'run', .3], [21.0, 'jog', .5], [23.4, 'walk', .6], [27.4, null, .6], [40.5, 'walk', .6], [45.05, null, .15]];
const TP = poseT([[0, 'stand'], [8.2, 'chest', .45], [9.2, 'point', .3], [10.4, 'chest', .4], [11.3, 'point', .3], [12.18, 'windup', .22], [12.42, 'punch', .1], [12.85, 'guard', .3], [14.3, 'pushed', .08], [15.0, 'stumble', .3], [15.6, 'stand', .45],
  [16.1, 'handsDown', .45], [17.15, { ...CRIME.POSES.handsDown, lean: -8, neck: -8 }, .3], [17.55, 'stand', .2], [27.4, 'pant', .7], [40.4, 'stand', .8], [44.5, { ...CRIME.POSES.handsDown, lean: -10, neck: -6, armN: [24, 40], armF: [14, 40] }, .2], [45.2, 'recoilHead', .07], [45.75, 'stumble', .3], [46.3, 'kneel', .8]]);
const TE = exprT([[0, 'irritated'], [8.2, 'confront', .5], [11.3, 'aggressive', .4], [12.85, 'aggressive', .3], [14.3, 'surprised', .1], [15.0, 'startled', .3], [16.1, 'fearful', .5], [23.4, 'stunned', 1], [27.4, 'relieved', 1], [40.4, 'neutral', 1], [44.4, 'startled', .2], [45.2, 'pain', .06]]);
const TLX = trk([[0, 0], [8, 0], [16.1, 0], [17.15, -.4], [17.55, 0], [25.0, 0], [25.3, -1], [26.0, -1], [26.4, 0], [43.9, 0], [44.2, -1], [44.5, 0]]);
const T_NECK = trk([[0, 0], [25.0, 0], [25.3, -14], [26.0, -14], [26.4, 0]]);

function actorState(t) {
  const n = { x: NX(t), dir: 1 }, ta = { x: TX(t), dir: TDIR(t) };
  const comp = (pose, gk, xFn, dir, tt) => {
    const g = gaitAt(gk, tt); if (!g.g || g.a <= 0) return pose;
    const ph = xFn(tt) * dir / STRIDE[g.g] * Math.PI * 2;
    return CRIME.cycle(g.g, ph, pose, g.a);
  };
  n.pose = comp(NP(t), NG, NX, 1, t); n.expr = NE(t); n.lookX = NLX(t);
  ta.pose = comp(TP(t), TG, TX, ta.dir, t); ta.expr = TE(t); ta.lookX = TLX(t);
  ta.pose = { ...ta.pose, neck: ta.pose.neck + T_NECK(t) };
  // breathing: heavier after exertion / anger
  const br = (t > 30 && t < 38.2) || t > 45.5 ? 1 : .35;
  n.pose = { ...n.pose, lean: n.pose.lean + Math.sin(t * (br > .5 ? 5.5 : 2.4)) * br };
  return { n, ta };
}
const IMPACT1 = 12.55, PUSH = 14.3, TURN = 17.55, IMPACT2 = 45.2;   // the decisive moments (story time)

// ============================ worlds ============================
function makeWorld(root) {
  const W = CRIME.street(root), n = CRIME.actor('Nont'), ta = CRIME.actor('Tae');
  W.actors.appendChild(n); W.actors.appendChild(ta);
  W.cam = { cx: 1100, cy: 1150, z: 1, roll: 0 };
  W.draw = (tau, cam, tt) => {
    const s = actorState(tau);
    n.pose({ ...s.n.pose, x: s.n.x, y: GY, dir: 1, expr: s.n.expr, lookX: s.n.lookX, blink: blinkAt(tau, 0) });
    ta.pose({ ...s.ta.pose, x: s.ta.x, y: GY + 4, dir: s.ta.dir, expr: s.ta.expr, lookX: s.ta.lookX, blink: blinkAt(tau, 1.3) });
    // rim light follows the location: warm store light near the store, amber lamps elsewhere, teal from the street
    const nearStore = x => clamp(1 - Math.abs(x - 850) / 900);
    n.light([255, lerp(190, 215, nearStore(s.n.x)), lerp(110, 170, nearStore(s.n.x)), .62], [90, 200, 255, .38], lerp(.9, 1, nearStore(s.n.x)));
    ta.light([255, lerp(190, 215, nearStore(s.ta.x)), lerp(110, 170, nearStore(s.ta.x)), .62], [90, 200, 255, .38], lerp(.9, 1, nearStore(s.ta.x)));
    W.cam = cam; W.camera(cam.cx, cam.cy, cam.z, tt, cam);
    W.state = s;
  };
  W.n = n; W.ta = ta;
  return W;
}
function blinkAt(t, seed) { const u = (t + seed) % 3.4; return u < .13 ? Math.sin(u / .13 * Math.PI) : 0; }
const W1 = makeWorld($('w1')), W2 = makeWorld($('w2'));
const scr = (W, x, y) => ({ x: (x - W.cam.cx) * W.cam.z + 540, y: (y - W.cam.cy) * W.cam.z + 960 });
// actor reference points (world)
const headOf = (W, who) => { const a = who === 'n' ? W.n : W.ta, s = who === 'n' ? W.state.n : W.state.ta, p = a.pts(); return { x: s.x + p.head.x, y: GY + p.head.y }; };
const fistOf = (W, who) => { const a = who === 'n' ? W.n : W.ta, s = who === 'n' ? W.state.n : W.state.ta, p = a.pts(); return { x: s.x + p.fistN.x, y: GY + p.fistN.y }; };

// ============================ camera direction ============================
// shot list: [startVideoTime, fn(t) → {cx,cy,z,roll,dof}] (hard cuts between shots, motivated moves inside)
function shotAt(list, u, tAbs) { let s = list[0]; for (const x of list) if (x[0] <= u) s = x; return s[1](u - s[0], tAbs); }
const C = (cx, cy, z, o = {}) => ({ cx, cy, z, roll: 0, dof: 0, ...o });
const follow = (who, dx, cy, z, o) => (u, t) => { const s = actorState(TAUof(t)); return C((who === 'n' ? s.n.x : s.ta.x) + dx, cy, z, o); };

// ============================ video time → story time ============================
const H0 = S('hook'), ST0 = S('story'), CF0 = S('conflict'), CL0 = S('clue'), QZ0 = S('quiz'), CDT = FR(S('cd')), ANS = FR(S('ans')), PR0 = S('promo');
const TAU_OFF = ST0 + 1.7;                                    // story & conflict play 1:1 after the rewind
const hookTau = trk([[0, 42.4], [1.36, 43.0, 'lin'], [3.12, 44.05, 'lin'], [3.83, 44.62, 'lin'], [4.61, 45.1, 'out'], [20.85, 45.12, 'lin'], [22.91, 31, 'in']]);
const conflictTau = trk([[0, 25.39], [19.3, 44.69, 'lin'], [20.7, 45.33, 'lin'], [21.3, 45.6, 'lin'], [26.06, 50.36, 'lin'], [27.0, 45.15, 'io'], [29.4, 45.15]]);
function TAUof(t) {
  if (t < ST0) return hookTau(t - H0);
  if (t < ST0 + 1.7) return lerp(31, 0, E.inOut(clamp((t - ST0) / 1.7)));
  if (t < CF0) return t - TAU_OFF;
  if (t < CL0) return conflictTau(t - CF0);
  return clueTau(t);
}
// evidence / quiz / answer: story time is chosen per beat (freeze frames and replays of the same choreography)
const cl = { tint: 0, A: 2.96, B: 10.33, line: 15.95, cmp: 21.22, out: 27.4 };
function clueTau(t) {
  if (t < QZ0) { const u = t - CL0; if (u < cl.A) return 45.15; if (u < cl.A + .7) return lerp(45.15, PUSH, E.inOut((u - cl.A) / .7)); if (u < cl.B) return PUSH; if (u < cl.B + .7) return lerp(PUSH, 45.15, E.inOut((u - cl.B) / .7)); if (u < cl.line) return 45.15; if (u < cl.line + .6) return lerp(45.15, 17.3, E.inOut((u - cl.line) / .6)); if (u < cl.cmp) return 17.3 + Math.min(1.5, (u - cl.line - .6) * .35); return PUSH; }
  if (t < ANS) return 45.15;
  return ansTau(t - ANS);
}
const an = { A: 9.32, el: [11.26, 13.98, 16.03, 19.88], may: 22.58, B: 24.73, over: 27.32, chase: 29.32, hit: 32.01, guilt: 34.68, facts: 37.41, cmp: 40.37, key: 44.71, key2: 47.75, out: 56.8 };
function ansTau(u) {
  if (u < an.A) return 45.15;
  if (u < an.A + 1.0) return 11.6;
  if (u < an.el[0]) return 11.6 + (u - an.A - 1.0) * .55;                // replay: first punch in half speed
  if (u < an.el[0] + 4.6) return Math.min(PUSH, 11.6 + (an.el[0] - an.A - 1.0) * .55 + (u - an.el[0]) * .6);   // → defensive push, then hold
  if (u < an.B) return PUSH;
  if (u < an.over) return 16.0 + (u - an.B) * .7;                          // Tae stops attacking, turns and runs
  if (u < an.chase) return 17.8 + Math.min(1.4, (u - an.over) * .7);
  if (u < an.hit) return 42.9 + (u - an.chase) * .85;                      // pursuit
  if (u < an.cmp) return IMPACT2 - .05;
  return IMPACT2 - .05;
}

// ============================ overlays ============================
const chip = (top, html, st) => mk(`<div class="Z zc c" style="top:${top}px"><span class="tag" style="${st}">${html}</span></div>`);
const ST_ = { glass: 'font-size:32px;color:#EAF2FF;background:rgba(8,14,30,.82);border:2px solid rgba(160,205,255,.35)',
  amber: 'font-size:34px;font-weight:700;color:#1E1404;background:linear-gradient(90deg,#FFD08A,#F2A94E);box-shadow:0 10px 24px rgba(242,169,78,.4)',
  teal: 'font-size:34px;font-weight:700;color:#06222A;background:linear-gradient(90deg,#9FF0F8,#5ACBDF);box-shadow:0 10px 24px rgba(90,203,223,.35)',
  pink: 'font-size:34px;font-weight:700;color:#fff;background:linear-gradient(90deg,#EE7FAA,#F7A8C8);box-shadow:0 10px 24px rgba(238,127,170,.4)',
  red: 'font-size:34px;font-weight:700;color:#fff;background:linear-gradient(90deg,#D9485F,#F07A6A);box-shadow:0 10px 24px rgba(217,72,95,.4)' };
const NEQ = `<svg width="0.9em" height="0.9em" viewBox="0 0 40 40" style="vertical-align:-0.1em"><path d="M6 15 H34 M6 25 H34" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M27 6 L13 34" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>`;
const ARROW = `<svg width="0.8em" height="0.8em" viewBox="0 0 40 40" style="vertical-align:-0.08em"><path d="M5 20 H31 M22 10 L33 20 L22 30" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const hideAll = list => list.forEach(e => tf(e, { o: 0 }));
// tracking marker (ring + label) that follows a world point
function marker(color, label) {
  const el = mk(`<div class="mk"><svg width="200" height="200" viewBox="-100 -100 200 200" style="position:absolute;left:-100px;top:-100px;overflow:visible"><circle class="r1" r="70" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="18 10"/><circle r="8" fill="${color}"/></svg>${label ? `<div class="lb tag" style="position:absolute;left:-200px;top:-150px;width:400px;justify-content:center;font-size:30px;font-weight:700;color:#0A1428;background:${color}">${label}</div>` : ''}</div>`);
  el.place = (x, y, o, t, s = 1, lby = -150) => { el.style.transform = `translate(${x}px,${y}px) scale(${s})`; el.style.opacity = o; el.style.visibility = o > .01 ? 'visible' : 'hidden'; el.querySelector('.r1').style.transform = `rotate(${t * 60}deg)`; const lb = el.querySelector('.lb'); if (lb) { const ly = clamp(y + lby * s, 312, 1372) - y, lx = clamp(x - 200 * s, 200, 860 - 400 * s) - x; lb.style.top = ly / s + 'px'; lb.style.left = lx / s + 'px'; } };   // label stays inside Safe Zone V2
  return el;
