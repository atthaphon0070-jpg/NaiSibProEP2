<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP14</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
/* EP14 typography presets — Prompt (modern loopless Thai); maths in tabular numerals */
.Z{position:absolute;left:190px;width:680px}
.zc{display:flex;justify-content:center}
.hx{font-weight:700;font-size:84px;line-height:1.2;color:#fff;text-shadow:0 6px 22px rgba(8,18,45,.55),0 2px 4px rgba(8,18,45,.4);text-align:center}
.math{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;white-space:nowrap}
.chip2{display:inline-flex;align-items:center;gap:12px;padding:12px 28px;border-radius:40px;font-weight:600;white-space:nowrap}
.holo{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(110,200,255,.08));border:3px solid rgba(150,230,255,.75);border-radius:30px;box-shadow:0 0 34px rgba(80,190,255,.45),inset 0 2px 0 rgba(255,255,255,.4);color:#fff;text-shadow:0 0 14px rgba(80,190,255,.6)}
.holo.gold{background:linear-gradient(160deg,rgba(255,236,170,.30),rgba(242,199,102,.12));border-color:rgba(255,224,140,.95);box-shadow:0 0 40px rgba(255,200,90,.6),inset 0 2px 0 rgba(255,255,255,.45);color:#FFF6D8;text-shadow:0 0 16px rgba(255,200,90,.7)}
.holo.green{background:linear-gradient(160deg,rgba(140,240,190,.28),rgba(38,162,105,.12));border-color:rgba(150,245,200,.95);box-shadow:0 0 36px rgba(60,210,140,.6),inset 0 2px 0 rgba(255,255,255,.45)}
.holo.pink{background:linear-gradient(160deg,rgba(255,190,220,.26),rgba(238,127,170,.12));border-color:rgba(255,180,215,.9);box-shadow:0 0 34px rgba(238,127,170,.55),inset 0 2px 0 rgba(255,255,255,.45)}
.lbl{font-weight:600;font-size:30px;color:rgba(200,235,255,.9)}
.optx{position:absolute;left:190px;width:680px;height:106px;border-radius:54px;display:flex;align-items:center;gap:22px;padding:0 18px;font-weight:700;font-size:54px;
  background:linear-gradient(180deg,#FFE9F3 0%,#FBD6E7 100%);box-shadow:0 10px 0 rgba(238,127,170,.35),0 16px 30px rgba(5,10,30,.35),inset 0 4px 0 rgba(255,255,255,.8);color:var(--navy);font-variant-numeric:tabular-nums}
.optx .b{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 30%,#FFB3CF,#EE7FAA 70%);box-shadow:0 0 0 7px #CFE2FA,0 0 0 10px #fff;flex:none}
.optx .chk{position:absolute;right:22px;top:50%;width:72px;height:72px;margin-top:-36px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0}
.optx .ov{position:absolute;inset:0;border-radius:54px;background:linear-gradient(180deg,#7BE3AD,#3DBE7E);opacity:0}
.optx .tx{position:relative}
sub{font-size:.58em;vertical-align:-.28em;line-height:0}
.fx{position:absolute;inset:0;perspective:1400px;perspective-origin:530px 860px}
.guide{position:absolute;left:190px;top:300px;width:680px;height:1130px;outline:4px dashed #FF2D6B;pointer-events:none;z-index:99}
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage">
  <div id="uni" class="abs" style="inset:0"></div>                 <!-- maths universe (persistent background) -->
  <div class="scene" id="s1"><div id="room" class="abs" style="inset:0;overflow:hidden"></div></div>
  <div class="scene" id="s2"></div>                                  <!-- foreground for hook/story/mistake/method -->
  <div class="scene" id="s3"></div>                                  <!-- quiz, countdown, answer -->
  <div class="scene" id="s4"></div>                                  <!-- promo -->
  <div id="flash" class="abs" style="inset:0;background:radial-gradient(circle,#E6F8FF,#9FDFFF);opacity:0;pointer-events:none"></div>
</div>
<script src="../../shared/engine/engine.js"></script>
<script src="../../shared/engine/props_story.js"></script>
<script src="../../shared/engine/props_math.js"></script>
<script src="../../shared/engine/promo.js"></script>
<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const FR = x => Math.round(x * T.fps) / T.fps - 1e-6;
const ZX = 190, ZW = 680, ZC = 530;

// ============================ LOCKED MATHS (single source of truth) ============================
const A1 = 8, DIF = 6, AN = 128;
const SEQ = []; for (let v = A1; v <= AN; v += DIF) SEQ.push(v);
const N = SEQ.length, PAIRS = [...Array(Math.floor(N / 2))].map((_, i) => [SEQ[i], SEQ[N - 1 - i]]), MID = SEQ[(N - 1) / 2];
const PAIR_SUM = A1 + AN, TOTAL = SEQ.reduce((a, b) => a + b, 0), PAIRED = PAIRS.length * PAIR_SUM;
const CHOICES = [['ก', 1360], ['ข', 1407], ['ค', 1428], ['ง', 1496]], CORRECT = CHOICES.findIndex(c => c[1] === TOTAL);
if (N !== 21 || PAIRS.length !== 10 || PAIRS.some(p => p[0] + p[1] !== 136) || MID !== 68 || PAIRED !== 1360 || TOTAL !== 1428 || TOTAL !== N * (A1 + AN) / 2 || CORRECT !== 2) throw new Error('maths check failed');
const fmt = n => n.toLocaleString('en-US');
window.MATHCHECK = { N, PAIRS, MID, PAIR_SUM, PAIRED, TOTAL, correct: CHOICES[CORRECT][0] };
const EXPR = `${SEQ.slice(0, 4).join(' + ')} + … + ${AN}`;                    // "8 + 14 + 20 + 26 + … + 128"

// ============================ worlds ============================
const U = MATH.universe($('uni'));
const room = MATH.examRoom($('room'));
const cadet = STORY.character('Cadet'); const cadW = h('<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>'); cadW.appendChild(cadet); room.actors.appendChild(cadW);
cadW.style.transform = `translate(1200px,1790px) scale(.9)`;
// universe visibility + circular "break into the hologram" reveal from a screen point
function showUniverse(o, reveal = 1, cx = 530, cy = 760) { const u = $('uni'); u.style.opacity = o; u.style.visibility = o > 0 ? 'visible' : 'hidden'; u.style.clipPath = reveal < 1 ? `circle(${E.inOut(reveal) * 2300}px at ${cx}px ${cy}px)` : 'none'; }
function camTrack(u, keys) { let i = 0; while (i < keys.length - 1 && keys[i + 1][0] <= u) i++; const k = keys[i], pv = keys[Math.max(0, i - 1)], e = k[4] > 0 ? E.inOut(P(u, k[0], k[4])) : 1, f = k[4] > 0 && i > 0 ? pv : k; return [lerp(f[1], k[1], e), lerp(f[2], k[2], e), lerp(f[3], k[3], e)]; }

// ============================ shared overlay helpers ============================
const S2 = $('s2'), S3 = $('s3');
const mk = (parent, html) => { const el = h(html); parent.appendChild(el); return el; };
const FX2 = mk(S2, `<div class="fx"></div>`), FX3 = mk(S3, `<div class="fx"></div>`);
function place3(el, x, y, z = 0, s = 1, o = 1, ry = 0) { el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) scale(${s})`; el.style.opacity = o; el.style.visibility = o > .01 ? 'visible' : 'hidden'; }
const hideAll = list => list.forEach(e => tf(e, { o: 0 }));
const chip = (parent, top, html, style) => mk(parent, `<div class="Z zc c" style="top:${top}px"><span class="chip2" style="${style}">${html}</span></div>`);
const CH = { cyan: 'font-size:36px;font-weight:700;color:#0B1A38;background:linear-gradient(90deg,#9FE7FF,#6FD0FF);box-shadow:0 10px 26px rgba(80,190,255,.45)',
  pink: 'font-size:36px;font-weight:700;color:#fff;background:linear-gradient(90deg,#EE7FAA,#F7A8C8);box-shadow:0 10px 26px rgba(238,127,170,.45)',
  gold: 'font-size:36px;font-weight:700;color:#3A2A08;background:linear-gradient(90deg,#FFE7A0,#F2C766);box-shadow:0 10px 26px rgba(242,199,102,.45)',
  white: 'font-size:32px;color:#0B1A38;background:rgba(255,255,255,.95);box-shadow:0 10px 22px rgba(5,10,30,.35)' };

// ============================ S1/S2 — HOOK (exam room → hologram) ============================
const H0 = S('hook'), hk = { lift: 1.82, head: 3.08, label: 8.79, timer: 11.79, face: 12.95, float: 15.16, dive: 18.74, go: 22.43 };
const hHead = mk(S2, `<div class="Z c" style="top:318px"><div style="position:absolute;left:-70px;right:-70px;top:-20px;height:300px;border-radius:50%;background:radial-gradient(ellipse,rgba(8,18,45,.55),rgba(8,18,45,0) 70%)"></div><div class="hx" style="position:relative">บวกเลขยาวแบบนี้<br><span style="color:#9FE7FF">คิดยังไงให้เร็ว?</span></div></div>`);
const hLabel = chip(S2, 545, `คณิตศาสตร์ <span style="opacity:.5">|</span> เตรียมสอบนายสิบตำรวจ`, CH.white);
const hExpr = mk(S2, `<div class="Z zc c" style="top:640px"><div class="holo math" style="font-size:54px;padding:24px 30px">${EXPR}</div></div>`);
const hTimer = chip(S2, 1335, `${ICON.timer(40, '#fff')}<span>เวลาเหลือ <b class="tm">00:45</b></span>`, CH.pink);
const hFloat = SEQ.slice(0, 4).map(v => mk(FX2, '<div></div>').appendChild(MATH.tile(v, { w: 120, h: 92, fs: 46 })));
const hGo = chip(S2, 1335, `เข้าไปในโลกของตัวเลขกัน!`, CH.cyan);
sfx('tick', H0 + .2, .5); sfx('riser', H0 + .3, .5); sfx('whoosh', H0 + hk.lift, .7); sfx('sparkle', H0 + hk.lift + .3, .6); sfx('pop', H0 + hk.head, .9); sfx('pop', H0 + hk.label, .7);
for (let i = 0; i < 6; i++) sfx('tick', H0 + hk.timer + i, .45); hFloat.forEach((_, i) => sfx('pop', H0 + hk.float + i * .25, .5));
sfx('riser', H0 + hk.dive - .9, .7); sfx('freeze', H0 + hk.dive - .1, .8); sfx('whoosh', H0 + hk.dive + .2, .6); sfx('pop', H0 + hk.go, .6);
function drawHook(t) {
  const u = t - H0;
  const dive = E.inOut(P(u, hk.dive, 1.1));
  const face = u >= hk.face && u < hk.dive;
  let cam = camTrack(u, [[0, 1200, 1060, 1.0, 0], [.01, 1200, 1100, 1.12, 1.8], [hk.lift, 1200, 1150, 1.25, 1.2], [hk.face, 1200, 1300, 2.3, 0], [hk.face + .05, 1200, 1310, 2.45, 5]]);
  room.camera(cam[0], cam[1], cam[2], t, face ? .8 : .2, u);
  cadet.pose({ t: u, expr: u < hk.face ? 'neutral' : 'worried', lookY: u < hk.lift ? -.6 : 1, blink: STORY.blinkAt(u), sweat: u > hk.face + .5, tilt: face ? 4 : 0 });
  $('s1').style.opacity = 1 - dive;
  showUniverse(dive > 0 ? 1 : 0, dive, ZC, 700);
  U.camera(t, { dolly: lerp(-600, 0, dive), orbit: Math.sin(t * .1) * 6 });
  $('flash').style.opacity = clamp(1 - Math.abs(u - hk.dive - .3) / .35) * .55 + clamp(1 - Math.abs(u - hk.face) / .1) * .25;
  tf(hHead, life(u, hk.head, 1e9, { from: .6, dy: 40, d: .7 }));
  tf(hLabel, life(u, hk.label, 1e9, { from: .6, dy: 30 }));
  // the equation lifts off the whiteboard and becomes a hologram
  const lift = E.out(P(u, hk.lift, 1.0)); room.boardEq.style.opacity = 1 - lift;
  tf(hExpr, { x: 0, y: lerp(-250, 0, lift) + bob(u, 0, 4), s: lerp(.55, 1, lift) * (1 + .02 * Math.sin(u * 2)), o: clamp((u - hk.lift) * 3), rx: (1 - lift) * 50 });
  const tl = life(u, hk.timer, hk.dive - .1, { from: .5, dy: 30 }); tf(hTimer, { ...tl, s: tl.s * (1 + .05 * Math.max(0, Math.sin((u - hk.timer) * Math.PI * 2)) * (u > hk.timer ? 1 : 0)) });
  hTimer.querySelector('.tm').textContent = `00:${String(Math.max(0, 45 - Math.floor(Math.max(0, u - hk.timer)))).padStart(2, '0')}`;
  hFloat.forEach((el, i) => { const k = E.out(P(u, hk.float + i * .25, .9)); const ang = i * 1.57 + u * .5; place3(el, ZC + Math.cos(ang) * 250, 960 + Math.sin(ang) * 120, lerp(-900, Math.sin(ang) * 160, k), 1, clamp((u - hk.float - i * .25) * 3) * (1 - P(u, hk.dive + .6, .4)), Math.sin(ang) * 20); });
  tf(hGo, life(u, hk.go, 1e9, { from: .5, dy: 20 }));
}

// ============================ STORY (manual-addition pressure → +6 pattern) ============================
const ST = S('story'), st = { paper: 1.84, sums: [4.24, 5.4, 6.69, 7.9], waste: 8.4, dive: 10.30, tiles: [10.30, 11.11, 11.61, 12.68], plus: 14.82, same: 17.45, idea: 19.85, cont: 22.86, hidden: 25.84 };
const sPaper = mk(S2, `<div class="Z c" style="top:330px;display:flex;justify-content:center"><div style="width:600px;padding:30px 36px;border-radius:26px;background:#FFFDF6;box-shadow:0 22px 44px rgba(5,10,30,.4);transform:rotate(-2deg)">
  <div style="font-weight:700;font-size:34px;color:#3D5E93;margin-bottom:10px">กระดาษทด</div><div class="sums" style="display:flex;flex-direction:column;gap:10px"></div></div></div>`);
const SUMS = [[8, 14], [22, 20]].map(([a, b]) => `${a} + ${b} = ${a + b}`).concat(['42 + 26 = …', '… + … + … = ?']);   // never completes 42 + 26 (no solved middle term before the quiz)
const sumEls = SUMS.map(s => { const el = h(`<div class="math" style="font-size:52px;color:#31445D;font-weight:600">${s}</div>`); sPaper.querySelector('.sums').appendChild(el); return el; });
const sWaste = chip(S2, 1335, `บวกทีละตัว…ไม่ทันเวลา!`, CH.pink);
const sHead = chip(S2, 330, `รูปแบบที่ซ่อนอยู่`, CH.cyan);
const ROW_X = [ZX + 70, ZX + 250, ZX + 430, ZX + 610];   // 4 tiles across the zone
const sTiles = SEQ.slice(0, 4).map(v => { const w = mk(FX2, '<div></div>'); return w.appendChild(MATH.tile(v, { w: 136, h: 110, fs: 56 })); });
const sPlus = [0, 1, 2].map(i => mk(S2, `<div class="abs c" style="left:${ROW_X[i] + 90 - 50}px;top:600px;width:100px;text-align:center"><div class="math" style="font-size:40px;color:#FFE7A0;text-shadow:0 0 16px rgba(255,200,90,.9)">+${DIF}</div>
  <svg width="100" height="40" viewBox="0 0 100 40"><path d="M10 30 Q50 0 90 30" fill="none" stroke="#FFE7A0" stroke-width="5" stroke-linecap="round"/><path d="M78 20 L90 30 L76 34" fill="none" stroke="#FFE7A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`));
const sBig = mk(S2, `<div class="Z zc c" style="top:880px"><div class="holo gold" style="padding:18px 40px;font-weight:700;font-size:62px">เพิ่มขึ้นทีละ ${DIF}</div></div>`);
const sSame = chip(S2, 1030, `ทุกตัวห่างกันเท่ากัน`, CH.white);
const sCont = mk(S2, `<div class="Z zc c" style="top:1130px"><div class="holo math" style="font-size:44px;padding:16px 26px">${SEQ.slice(0, 4).join(' → ')} → … → ${AN}</div></div>`);
const sIdea = chip(S2, 1335, `💡`.replace('💡', '') + `เจอรูปแบบที่ซ่อนอยู่แล้ว!`, CH.gold);
sfx('tick', ST + .1, .5); sfx('pop', ST + st.paper, .6); st.sums.forEach(x => sfx('click', ST + x, .6)); sfx('stamp', ST + st.waste, .6);
sfx('riser', ST + st.dive - .8, .6); sfx('whoosh', ST + st.dive, .7); st.tiles.forEach(x => sfx('pop', ST + x, .8)); [0, 1, 2].forEach(i => sfx('sparkle', ST + st.plus + i * .3, .5));
sfx('ding', ST + st.plus + 1.0, .6); sfx('pop', ST + st.same, .6); sfx('success', ST + st.idea, .5); sfx('whoosh', ST + st.cont, .5); sfx('pop', ST + st.hidden, .7);
function drawStory(t) {
  const u = t - ST;
  const dive = E.inOut(P(u, st.dive - .3, 1.0)); room.boardEq.style.opacity = 0;
  // exam-room part: medium shot on the candidate, clock racing
  const cam = camTrack(u, [[0, 1200, 1250, 1.7, 0], [.01, 1200, 1260, 1.85, 4]]);
  room.camera(cam[0], cam[1], cam[2], t, .5, D('hook') + u * (u > st.sums[0] ? 4 : 1));
  cadet.pose({ t: u, expr: u < st.waste ? 'worried' : 'surprise', lookY: 1, blink: STORY.blinkAt(u, 1), sweat: u > 3, tilt: Math.sin(u * 1.5) * 3 });
  $('s1').style.opacity = 1 - dive;
  showUniverse(dive > 0 ? 1 : 0, dive, ZC, 760);
  U.camera(t, { dolly: lerp(-500, 0, dive), orbit: -8 + Math.sin(t * .1) * 6, tilt: 2 });
  $('flash').style.opacity = clamp(1 - Math.abs(u - st.dive) / .35) * .45;
  tf(sPaper, life(u, st.paper, st.dive - .2, { from: .7, dy: 40 }));
  sumEls.forEach((el, i) => tf(el, life(u, st.sums[i], 1e9, { from: .7, dy: 10 })));
  const w = life(u, st.waste, st.dive - .2, { from: .5, dy: 20 }); tf(sWaste, { ...w, x: Math.sin(u * 30) * 4 * (1 - P(u, st.waste, .4)) });
  tf(sHead, life(u, st.dive + .2, 1e9, { from: .5, dy: 20 }));
  sTiles.forEach((el, i) => { const k = E.out(P(u, st.tiles[i], .7)); place3(el, ROW_X[i], 760 + bob(u, i, 5), lerp(-700, 0, k), 1 + .06 * Math.max(0, 1 - Math.abs(u - st.plus - i * .3) / .3), clamp((u - st.tiles[i]) * 4), lerp(40, 0, k)); });
  sPlus.forEach((el, i) => tf(el, life(u, st.plus + i * .3, 1e9, { from: .3, dy: 20, el: true })));
  tf(sBig, life(u, st.plus + 1.0, 1e9, { from: .4, dy: 30, el: true, d: .8 }));
  tf(sSame, life(u, st.same, 1e9, { from: .5, dy: 20 }));
  tf(sCont, life(u, st.cont, 1e9, { from: .6, dy: 30 }));
  tf(sIdea, life(u, st.hidden, 1e9, { from: .5, dy: 20, el: true }));
}

// ============================ MISTAKE (chaos → order; arithmetic series; beware the middle) ============================
const MK = S('mistake'), mk_ = { card: 1.97, freeze: 5.49, align: 8.26, pulse: 9.57, title: 11.87, def: 14.10, d: 17.19, mid: 19.28, midNote: 22.41, count: 25.98 };
const CHAOS = SEQ.filter((v, i) => i < 8 || i > N - 8);          // 14 genuine terms (the middle term is never shown here)
const chaos = CHAOS.map(v => mk(FX2, '<div></div>').appendChild(MATH.tile(v, { w: 110, h: 84, fs: 40 })));
const chaosP = CHAOS.map(() => ({ x: ZX + 120 + NSP.rnd() * 440, y: 520 + NSP.rnd() * 700, z: -200 - NSP.rnd() * 900, ph: NSP.rnd() * 6.28 }));
const mHead = chip(S2, 330, `ข้อผิดพลาดที่พบบ่อย`, CH.pink);
const mCard = mk(S2, `<div class="Z zc c" style="top:1210px"><div class="holo pink" style="display:flex;align-items:center;gap:18px;padding:16px 28px"><span class="ic" style="width:58px;height:58px;border-radius:50%;background:#E0517F;display:grid;place-items:center">${ICON.cross('#fff', 36)}</span><span style="font-weight:700;font-size:36px">บวกทีละตัว = เสียเวลา + เสี่ยงผิด</span></div></div>`);
// aligned row: first four, ellipsis, last three (8 slots)
const ROW = [SEQ[0], SEQ[1], SEQ[2], SEQ[3], '…', SEQ[N - 3], SEQ[N - 2], SEQ[N - 1]];
const RX = ROW.map((_, i) => ZX + 42 + i * 85);
const mTitle = mk(S2, `<div class="Z c" style="top:420px;text-align:center"><div class="hx" style="font-size:80px;color:#FFE7A0">อนุกรมเลขคณิต</div><div class="mdef" style="font-weight:600;font-size:36px;color:#E6F6FF;margin-top:8px">ผลต่างของพจน์ที่ติดกันเท่ากันเสมอ</div></div>`);
const mPulse = mk(S2, `<div class="abs" style="left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle,#FFF6D8,#FFC94D 60%,rgba(255,200,80,0) 72%)"></div>`);
const mD = mk(S2, `<div class="Z zc c" style="top:880px"><div class="holo gold" style="padding:16px 36px"><span style="font-weight:600;font-size:34px">ผลต่างร่วม</span> <span class="math" style="font-size:56px">d = ${DIF}</span></div></div>`);
const mMid = mk(S2, `<div class="Z zc c" style="top:1020px"><div style="position:relative;width:150px;height:150px"><div class="ring" style="position:absolute;inset:-30px;border-radius:50%;border:4px dashed rgba(255,200,230,.8)"></div><div class="holo pink" style="position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:72px;border-radius:40px">?</div></div></div>`);
const mMidNote = chip(S2, 1225, `ระวัง! ลืมพจน์ตรงกลาง`, CH.pink);
const mCount = chip(S2, 1335, `ต้องนับจำนวนพจน์ให้ถูกต้อง`, CH.white);
sfx('whoosh', MK + .1, .5); sfx('stamp', MK + mk_.card, .6); sfx('freeze', MK + mk_.freeze, .6); sfx('whoosh', MK + mk_.align, .6);
for (let i = 0; i < 7; i++) sfx('coin', MK + mk_.pulse + i * .32, .35); sfx('ding', MK + mk_.title, .7); sfx('pop', MK + mk_.def, .6); sfx('pop', MK + mk_.d, .8);

  showUniverse(1); U.camera(t, { orbit: Math.sin(t * .08) * 10 + (ua > pc.head ? (ua - pc.head) * 1.2 : 0), tilt: 4, dolly: ua > pc.focus && ua < pc.collapse ? 90 * E.inOut(P(ua, pc.focus, 1.5)) : 0 });
  const out = rev ? E.inOut(P(ua, ab.out, .6)) : 0;
  qLabel.querySelector('.qh').textContent = rev ? `เฉลย! ข้อ ${CHOICES[CORRECT][0]}` : 'ลองทำข้อสอบ!';
  const ql = life(u, .2, 1e9, { from: .5, dy: 20 }); tf(qLabel, { ...ql, o: ql.o * (1 - out) });
  const qc = life(u, .9, 1e9, { from: .6, dy: 30 }); tf(qCard, { ...qc, o: qc.o * (1 - out) });
  NSP.drawQuizOptions(qOpts, u, ua, OPT_AT, CORRECT, { slide: 0 });
  qOpts.forEach(o => { o.el.style.opacity = +o.el.style.opacity * (1 - out); if (out >= 1) o.el.style.visibility = 'hidden'; });
  NSP.drawCountdown(qCd, uc, T.cd[1]);
  tf(qThink, life(u, 25.05, D('quiz') - .3, { from: .5, dy: 20 }));
  NSP.drawConfetti(qConf, t, ANS + .05, 1.8);
  const hl = life(ua, ab.hero, ab.out, { from: .3, dy: 30, el: true, d: .8, out: .3 }); tf(qHero, { ...hl, s: hl.s * (1 + .03 * Math.sin(ua * 4)) });
  // 06B
  const fOff = ua >= pc.head - .3;
  tf(fHead, life(ua, ab.f1, pc.head - .3, { from: .5, dy: 20, out: .3 }));
  fGiven.forEach(g => tf(g.el, life(ua, g.at, pc.head - .3, { from: .5, dy: 20, el: true, out: .3 })));
  const nI = ua >= ab.n3 ? 2 : ua >= ab.n2 ? 1 : 0; fN.querySelector('.fn').innerHTML = nSteps[nI];
  const fn = life(ua, ab.n1, pc.head - .3, { from: .6, dy: 30, out: .3 }); tf(fN, { ...fn, s: fn.s * (1 + .04 * Math.max(0, 1 - Math.abs(ua - (nI === 1 ? ab.n2 : ab.n3)) / .25)) });
  const sI = ua >= ab.s4 ? 3 : ua >= ab.s3 ? 2 : ua >= ab.s2 ? 1 : 0; fS.querySelector('.fs').innerHTML = sSteps[sI];
  const fs = life(ua, ab.s1, pc.head - .3, { from: .6, dy: 30, out: .3 }); tf(fS, fs);
  if (sI === 3) fS.querySelector('.holo').classList.add('gold'); else fS.querySelector('.holo').classList.remove('gold');
  tf(fRes, life(ua, ab.s4 + .3, pc.head - .3, { from: .3, dy: 20, el: true, d: .8, out: .3 }));
  // 06C — pairing
  tf(pHead, life(ua, pc.head, rc.a[0] - .2, { from: .5, dy: 20, out: .3 }));
  const fly = E.inOut(P(ua, pc.fly, 2.1)), coll = E.inOut(P(ua, pc.collapse, .9)), inPair = ua >= pc.fly - .1 && ua < rc.a[0];
  const focus = E.inOut(P(ua, pc.focus, .8));
  SEQ.forEach((v, k) => {
    const el = pTiles[k], sl = pSlots[k], mid = k === (N - 1) / 2;
    if (!inPair) { place3(el, 0, 0, 0, 1, 0); return; }
    // fly-in: a helix from deep space into the U formation
    const a = k * .55 + ua * .4, hx = ZC + Math.cos(a) * 300, hy = 440 + k * 36, hz = -1600 + Math.sin(a) * 500;
    let x = lerp(hx, sl.x, fly), y = lerp(hy, sl.y, fly), z = lerp(hz, 0, fly), s = 1, o = clamp((ua - pc.fly) * 2);
    if (!mid) {
      const pi = k < (N - 1) / 2 ? k : N - 1 - k, p0 = pc.pairs[pi], dur = pi < 2 ? 1.1 : .35;
      const m = E.inOut(P(ua, p0 + (pi < 2 ? .2 : 0), dur));            // move toward the centre of its row
            s = 1 + .12 * Math.sin(m * Math.PI); if (m > 0 && m < 1) el.theme('gold'); else el.theme('glass'); o *= 1 - .6 * P(ua, p0 + (pi < 2 ? 1.6 : .4), .3);
      y += bob(ua, k, 2);
    } else {
      s = 1 + .35 * focus; el.theme(focus > .2 || ua > pc.collapse ? 'gold' : 'glass');
      const toCalc = E.inOut(P(ua, pc.plus, .7)); y = lerp(y, 640 + 60, toCalc); x = lerp(x, ZC + 175, toCalc); o *= 1 - P(ua, pc.plus + .6, .2);
      o *= 1; y += Math.sin(ua * 2) * 3 * focus;
    }
    if (!mid && focus > 0) o *= (1 - .65 * focus) * (1 - P(ua, pc.collapse, .6));
    place3(el, x, y, z, s, o);
  });
  PAIRS.forEach((pr, i) => {
    const p0 = pc.pairs[i], det = i < 2;
    const prog = P(ua, p0 + (det ? .15 : 0), det ? .8 : .25);
    pArcs[i].draw(LX, ROWY(i) - 26, RX2, ROWY(i) - 26, 46, prog, ua >= p0 && ua < p0 + (det ? 1.4 : .6) ? 1 - P(ua, p0 + (det ? 1.2 : .45), .2) : 0);
    const box = pSum[i], eqs = box.querySelector('.eqs'), res = box.querySelector('.res');
    const showEq = det ? clamp((ua - p0 - .6) * 4) * (1 - P(ua, p0 + 1.6, .3)) : 0;
    eqs.style.opacity = showEq; eqs.style.visibility = showEq > 0 ? 'visible' : 'hidden';
    const rIn = det ? P(ua, p0 + 1.75, .35) : P(ua, p0 + .3, .25);
    const toCol = coll;                                                // ten 136s gather into "10 × 136"
    res.style.transform = `translate(0,${lerp(0, 700 + 60 - ROWY(i), toCol)}px) scale(${E.back(rIn) * lerp(1, .6, toCol)})`;
    res.style.opacity = clamp(rIn * 3) * (1 - P(ua, pc.collapse + .7, .2)) * (1 - .55 * focus * (1 - toCol));
    box.style.visibility = ua >= p0 && ua < rc.a[0] ? 'visible' : 'hidden';
  });
  tf(pTen, life(ua, pc.ten, pc.focus, { from: .5, dy: 20, out: .3 }));
  tf(pMidNote, life(ua, pc.focus + .4, pc.collapse, { from: .5, dy: 20, out: .3 }));
  tf(pSpot, { o: inPair ? focus * (1 - P(ua, pc.collapse, .4)) * (.8 + .2 * Math.sin(ua * 3)) : 0 });
  // 10 × 136 = 1,360 → 1,360 + 68 → 1,428
  const calc = pCalc.querySelector('.pc');
  calc.innerHTML = ua < pc.plus ? `${PAIRS.length} × ${PAIR_SUM} = ${fmt(PAIRED)}` : `${fmt(PAIRED)} + ${MID}`;
  const cl = life(ua, pc.collapse + .8, pc.total + .2, { from: .5, dy: 20, out: .4 });
  tf(pCalc, { ...cl, s: cl.s * (ua > pc.total - .4 ? lerp(1, .6, P(ua, pc.total - .4, .5)) : 1) });
  const fl = life(ua, pc.total, rc.a[0] - .2, { from: .2, dy: 0, el: true, d: 1.0, out: .3 }); tf(pFinal, fl);
  tf(pFinalLbl, life(ua, pc.total + .6, rc.a[0] - .2, { from: .5, dy: 20, out: .3 }));
  tf(pBurst, { o: ua > pc.total && ua < rc.a[0] ? clamp((ua - pc.total) * 3) * (1 - P(ua, pc.total + 2.0, 1.5)) : 0, r: ua * 25, s: 1 + .1 * Math.sin(ua * 2) });
  // recap
  const recOn = ua >= rc.a[0] - .2;
  tf(rHead, life(ua, rc.a[0], 1e9, { from: .5, dy: 20 }));
  rA.forEach((el, i) => tf(el, life(ua, rc.a[i], rc.fold, { from: .6, dy: 30, out: .35 })));
  tf(rMini, life(ua, rc.fold + .2, rc.keys, { from: .6, dy: 20, out: .3 }));
  rB.forEach((el, i) => tf(el, life(ua, rc.b[i] + (i ? 0 : .2), rc.keys, { from: .6, dy: 30, out: .35 })));
  rKeys.forEach((el, i) => tf(el, life(ua, rc.keys + .2 + i, 1e9, { from: .6, dy: 30 })));
  tf(rEnd, life(ua, rc.end, 1e9, { from: .5, dy: 20 }));
  const rm = life(ua, rc.end + .4, 1e9, { from: .5, dy: 40, d: .6 }); tf(rMas, { ...rm, y: rm.y + bob(ua, 0, 5), r: Math.sin(ua * 2) * 4 });
  if (!recOn) [rHead, ...rA, rMini, ...rB, ...rKeys, rEnd, rMas].forEach(e => tf(e, { o: 0 }));
}

// ============================ S4 — PROMO ============================

  feats: [[1, '10,000+ ข้อ', 90, 1360], [2, 'อัปเดตทุกสัปดาห์', 395, 1360], [3, 'ครบ 6 วิชา', 90, 1435], [4, 'จับเวลา', 330, 1435], [5, 'AI วิเคราะห์ผล', 520, 1435]],
  finalMsg: 'เลือกแพ็กเกจ แล้วเริ่มฝึกทำข้อสอบได้เลย!',

  <div style="position:absolute;left:30px;top:1520px;width:880px;height:230px;border-radius:12px;background:rgba(0,0,0,.35)"></div><div style="position:absolute;left:0;top:1800px;width:1080px;height:120px;background:rgba(0,0,0,.35)"></div></div>`);
