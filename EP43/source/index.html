<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP43 — From Bit to Quettabyte</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
/* ===== EP43 BLUE DOMINANT theme (overrides the shared pastel defaults for this episode only) ===== */
:root{--n0:#0B1A36;--nv:#142B53;--eb:#2F6BFF;--cy:#22D3EE;--lb:#95BFEF;--ice:#E6F4FF;--pk:#EE7FAA;--yl:#FFD23F;--gr:#22C55E;--rd:#EF4444;--dt:#31445D}
html,body{background:#0B1A36}
body{color:var(--ice)}
#bg{background:radial-gradient(ellipse 130% 75% at 50% 38%,#1E4688 0%,#142B53 48%,#0B1A36 100%)}
#bg .blob,#particles{display:none}
#bg .grid-dots{background-image:radial-gradient(rgba(34,211,238,.16) 2px,transparent 2.4px);background-size:54px 54px;opacity:.6}
#brand .bn{color:var(--ice);text-shadow:0 3px 0 rgba(0,0,0,.3)}
#brand .ep{background:linear-gradient(90deg,#2F6BFF,#22D3EE);box-shadow:0 4px 12px rgba(34,211,238,.35)}
#brand img{filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.ex{font-size:.58em;position:relative;top:-.72em;margin-left:.04em;line-height:0}
.abs{position:absolute}
.ctr{display:flex;justify-content:center;align-items:center}
.gcard{background:linear-gradient(180deg,rgba(36,78,156,.92),rgba(18,40,88,.95));border:3px solid rgba(34,211,238,.6);border-radius:40px;box-shadow:0 0 44px rgba(47,107,255,.4),0 20px 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(230,244,255,.25)}
.glowt{text-shadow:0 0 22px rgba(34,211,238,.65),0 5px 0 rgba(6,16,40,.7)}
.uchip{display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(180deg,#4583FF,#1E4FD0);border:4px solid var(--cy);border-radius:30px;box-shadow:0 0 26px rgba(34,211,238,.45),inset 0 3px 0 rgba(255,255,255,.3);white-space:nowrap;line-height:1}
.pillx{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:700;white-space:nowrap;padding:14px 34px;background:linear-gradient(90deg,#2F6BFF,#22D3EE);color:#fff;box-shadow:0 10px 26px rgba(34,211,238,.35),inset 0 3px 0 rgba(255,255,255,.35)}
.pillx.dark{background:rgba(11,26,54,.85);border:3px solid rgba(34,211,238,.6);box-shadow:0 0 22px rgba(34,211,238,.3)}
.pillx.yl{background:linear-gradient(90deg,#FFD23F,#FFE58A);color:#142B53;box-shadow:0 10px 26px rgba(255,210,63,.35)}
.pillx.gr{background:linear-gradient(90deg,#16A34A,#22C55E);box-shadow:0 10px 26px rgba(34,197,94,.4)}
.big-t{font-weight:800;line-height:1.15;text-align:center;color:#fff}
.th-t{font-weight:700;text-align:center;line-height:1.35}
/* tower labels */
.pf-lab{text-align:center}
.pf-pre{font-weight:800;font-size:34px;letter-spacing:3px;color:#142B53;background:linear-gradient(90deg,#FFD23F,#FFE58A);padding:4px 22px;border-radius:20px;margin-bottom:6px;box-shadow:0 0 22px rgba(255,210,63,.5)}
.pf-ab{display:flex;align-items:center;gap:22px;font-weight:800;font-size:130px;line-height:.98;color:#fff;text-shadow:0 0 26px rgba(34,211,238,.75),0 6px 0 rgba(6,16,40,.7)}
.pf-ic{display:grid;place-items:center;width:104px;height:104px;border-radius:26px;background:rgba(11,26,54,.7);border:3px solid rgba(34,211,238,.6)}
.pf-nm{font-weight:700;font-size:42px;color:var(--lb);margin-top:6px;white-space:nowrap}
.pf-val{font-weight:700;font-size:42px;color:var(--yl);margin-top:2px;white-space:nowrap}
/* binary tiles */
.tile{position:absolute;display:grid;place-items:center;font-weight:800;color:#fff;border-radius:22px;background:linear-gradient(180deg,#3E7CFF,#1B48C2);border:4px solid var(--cy);box-shadow:0 0 30px rgba(34,211,238,.5),inset 0 3px 0 rgba(255,255,255,.3);line-height:1}
/* quiz */
.qopt{position:absolute;left:214px;width:652px;height:118px;border-radius:60px;display:flex;align-items:center;gap:22px;padding:0 24px;background:linear-gradient(180deg,rgba(40,86,170,.95),rgba(20,46,100,.97));border:3px solid rgba(149,191,239,.7);box-shadow:0 10px 0 rgba(6,16,40,.55),0 16px 30px rgba(0,0,0,.3)}
.qopt .qb{width:82px;height:82px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;color:#142B53;background:radial-gradient(circle at 35% 30%,#FFFFFF,#BFE6FF 70%);box-shadow:0 0 0 5px rgba(34,211,238,.6)}
.qopt .qt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:48px;color:#fff;white-space:nowrap}
.qopt .tk{display:inline-block}
.qopt .ok{position:absolute;right:-44px;top:50%;width:84px;height:84px;margin-top:-42px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0;box-shadow:0 0 0 6px #22C55E}
.cmt{position:absolute;display:flex;align-items:center;gap:16px;padding:16px 28px;border-radius:34px;background:rgba(230,244,255,.96);color:#142B53;font-weight:700;font-size:38px;white-space:nowrap;box-shadow:0 12px 26px rgba(0,0,0,.3)}
.cmt .av{width:58px;height:58px;border-radius:50%;flex:none}
/* recap ladder rows */
.lrow{position:absolute;left:230px;width:620px;height:104px;border-radius:30px;display:flex;align-items:center;padding:0 26px;gap:22px;background:linear-gradient(90deg,rgba(36,78,156,.92),rgba(18,40,88,.92));border:3px solid rgba(34,211,238,.45)}
.lrow .la{width:170px;font-weight:800;font-size:58px;color:#fff;text-shadow:0 0 16px rgba(34,211,238,.6);white-space:nowrap}
.lrow .ln{flex:1;font-weight:700;font-size:32px;color:var(--lb);white-space:nowrap}
.lrow .lv{font-weight:700;font-size:34px;color:var(--yl);white-space:nowrap}
#wipex{position:absolute;top:-200px;height:2320px;width:1800px;left:0;pointer-events:none;visibility:hidden;z-index:50}
#wipex .band{position:absolute;top:0;height:100%}
#wipex img{position:absolute;width:300px;left:50%;top:50%;margin:-150px 0 0 -150px;filter:drop-shadow(0 0 30px rgba(34,211,238,.6))}
#bgx{position:absolute;inset:0;overflow:hidden}
#bgx .dg{position:absolute;font-weight:700;color:#22D3EE;line-height:1}
</style>
<script src="timeline.js"></script>
<script src="units.js"></script>
<script src="beats.js"></script>
</head>
<body>
<div id="stage">
  <div id="bgx"></div>
</div>
<script src="../../shared/engine/engine.js"></script>
<script src="data_ladder.js"></script>
<script src="scenes.js"></script>
</body>
</html>
