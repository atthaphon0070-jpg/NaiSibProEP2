<style>

#wipe .band:nth-child(2),#wipe .band:nth-child(4){background:#EE7FAA!important}

.ctr{position:absolute;left:220px;width:640px;display:flex;justify-content:center;align-items:center;transform-origin:50% 50%}

.chip.pk{background:linear-gradient(90deg,#EE7FAA,#F7A1C4);box-shadow:0 12px 26px rgba(238,127,170,.45),inset 0 3px 0 rgba(255,255,255,.35)}
.chip.cy{background:linear-gradient(90deg,#2F6BFF,#22D3EE);box-shadow:0 12px 26px rgba(47,107,255,.4),inset 0 3px 0 rgba(255,255,255,.3)}
.chip.nv{background:linear-gradient(180deg,#1E3D78,#142B53);box-shadow:0 0 0 4px rgba(34,211,238,.65),0 14px 28px rgba(0,0,0,.35)}
.chip.wt{background:#fff;color:var(--ft);box-shadow:0 12px 26px rgba(20,43,83,.22),0 0 0 4px rgba(238,127,170,.5)}
.chip.yl{background:linear-gradient(90deg,#FFC21A,#FFD23F);color:#142B53;box-shadow:0 12px 26px rgba(255,190,30,.45),inset 0 3px 0 rgba(255,255,255,.45)}
.chip.gr{background:linear-gradient(90deg,#16A34A,#22C55E);box-shadow:0 12px 26px rgba(34,197,94,.45),inset 0 3px 0 rgba(255,255,255,.3)}

.kwL{font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#FFD23F,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #fff) drop-shadow(0 10px 16px rgba(20,43,83,.3))}
.hd{font-weight:800;color:#fff;line-height:1.15;text-align:center;white-space:nowrap;text-shadow:0 0 26px rgba(34,211,238,.5),0 6px 0 rgba(0,0,0,.28)}
.hl{font-weight:800;color:var(--fn);line-height:1.2;text-align:center;white-space:nowrap;text-shadow:4px 0 0 #fff,-4px 0 0 #fff,0 4px 0 #fff,0 -4px 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 10px 16px rgba(20,43,83,.2)}
.gcard{position:absolute;border-radius:34px;background:linear-gradient(180deg,rgba(30,61,120,.92),rgba(20,43,83,.92));box-shadow:0 0 0 3px rgba(34,211,238,.6),0 18px 36px rgba(0,0,0,.4)}
.lcard{position:absolute;border-radius:34px;background:linear-gradient(180deg,#fff,#F5F8FF);box-shadow:0 16px 34px rgba(20,43,83,.18),0 0 0 4px #fff,0 0 0 8px rgba(149,191,239,.5)}
.bubble2{position:absolute;left:220px;width:640px;display:flex;justify-content:center}
.bubble2 .in{position:relative;background:#fff;border-radius:40px;padding:20px 34px;text-align:center;font-weight:800;line-height:1.3;color:var(--ft);box-shadow:0 16px 34px rgba(20,43,83,.25),0 0 0 6px #EE7FAA}
.qhead{display:inline-flex;align-items:center;gap:16px;padding:10px 30px;border-radius:40px;background:linear-gradient(90deg,#142B53,#1E3D78);color:#fff;font-weight:800;font-size:38px;white-space:nowrap;box-shadow:0 0 0 4px rgba(34,211,238,.6),0 12px 24px rgba(20,43,83,.3)}
.qhead small{font-size:30px;font-weight:700;color:var(--fc)}
.qcard{position:absolute;left:220px;width:640px;padding:22px 26px;border-radius:36px;background:linear-gradient(180deg,#fff,#F3F7FF);box-shadow:0 18px 40px rgba(20,43,83,.2),0 0 0 5px #fff,0 0 0 10px rgba(238,127,170,.55)}
.qln{display:block;font-size:44px;font-weight:700;line-height:1.36;text-align:center;white-space:nowrap;border-radius:12px}
.qo{position:absolute;left:220px;width:640px;height:86px;border-radius:46px;display:flex;align-items:center;gap:22px;padding:0 16px;font-weight:800;font-size:44px;color:var(--ft);
  background:linear-gradient(180deg,#FFFFFF,#EAF2FF);box-shadow:0 8px 0 rgba(47,107,255,.25),0 14px 24px rgba(20,43,83,.16),inset 0 0 0 3px #CFE0FA;transform-origin:50% 50%}
.qo .b{position:relative;width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;color:#fff;background:linear-gradient(160deg,#2F6BFF,#142B53)}
.qo .tx{position:relative;white-space:nowrap}
.qo .ov{position:absolute;inset:0;border-radius:48px;background:linear-gradient(180deg,#34D399,#16A34A);opacity:0}
.qo .mk{position:absolute;right:40px;top:50%;width:66px;height:66px;margin-top:-33px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0}
.tile{position:absolute;display:flex;align-items:center;gap:16px;padding:0 22px;border-radius:30px;font-weight:800;font-size:34px;color:var(--ft);background:#fff;box-shadow:0 12px 26px rgba(20,43,83,.18),0 0 0 4px rgba(149,191,239,.55);white-space:nowrap}
.cmpr{position:absolute;left:220px;width:640px;height:190px;border-radius:34px;background:#fff;box-shadow:0 14px 30px rgba(20,43,83,.16),0 0 0 4px rgba(149,191,239,.5);display:flex;align-items:center;gap:22px;padding:0 22px}
.cmpr .art{width:140px;height:140px;flex:none;border-radius:26px;background:#F1F6FF;display:grid;place-items:center;overflow:hidden;position:relative}
.cmpr .t1{font-weight:800;font-size:42px;color:var(--fn);white-space:nowrap}
.cmpr .t2{font-weight:700;font-size:36px;color:var(--fp);white-space:nowrap}
.cmpr .tag{position:absolute;right:18px;top:-24px}
.btnC{display:inline-flex;align-items:center;justify-content:center;gap:18px;width:520px;height:108px;border-radius:56px;font-weight:800;font-size:50px;color:#fff;white-space:nowrap}
.mas{position:absolute;transform-origin:50% 100%}
.mas img{display:block;filter:drop-shadow(0 16px 20px rgba(12,27,58,.3))}
</style>

<body>
<div id="stage">
  <div id="nbg"><div class="grid"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="ng-dots"></div></div>
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div id="sweep"></div>
</div>

<script src="../../shared/engine/engine.js"></script>
<script src="../../shared/engine/props_story.js"></script>

<script>
const { $, clamp, lerp, E, P, tf, bob, h, sfx, mark, pressDepth } = NSP;
const { C, IC } = MM;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const BT = k => Object.fromEntries(Object.entries(BEATS[k]).map(([n, v]) => [n, v[0]]));
const hb = BT('hook'), sb = BT('story'), mb = BT('mistake'), eb = BT('expl'), qb = BT('quiz'), ab = BT('ans'), pb = BT('promo');
const H0 = S('hook'), ST = S('story'), MI = S('mistake'), EX = S('expl'), QS = S('quiz'), CD = S('cd'), AN = S('ans'), PR = S('promo');
const GM = k => S(k) + D(k) / 2;                      // middle of the short gap between two files = wipe centre
const B1 = GM('g1'), B2 = GM('g2'), B3 = GM('g3'), B4 = GM('g4'), B5 = GM('g5');
const ROWS = [['ผู้รับ ก', 'ที่อยู่ A'], ['ผู้รับ ข', 'ที่อยู่ B'], ['ผู้รับ ค', 'ที่อยู่ C']];

// ---------------------------------------------------------------- helpers
const add = (par, html) => { const e = h(html); par.appendChild(e); return e; };
const layer = par => add(par, `<div class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>`);
const ctr = (par, top, inner, cls = '') => add(par, `<div class="ctr ${cls}" style="top:${top}px">${inner}</div>`);
const chip = (txt, kind = 'pk', fs = 44, fit = 600) => `<div class="chip ${kind} sz" data-fit="${fit}" style="font-size:${fs}px">${txt}</div>`;
const backK = (p, c1 = .9) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
// entrance/exit without overshoot past the rest size (safe-zone friendly): fade + rise + gentle scale
function ent(u, a, b = 1e9, { d = .45, dy = 24, s0 = .86, out = .3 } = {}) {
  const pi = P(u, a, d), po = P(u, b, out);
  return { o: clamp(pi * 2.2) * (1 - po), s: lerp(s0, 1, backK(pi)) * (1 - .05 * E.out(po)), y: (1 - E.out(pi)) * dy - 14 * E.out(po) };
}
const show = (el, u, a, b, o) => tf(el, ent(u, a, b, o));
const fade = (u, a, b = 1e9, d = .35, out = .3) => clamp((u - a) / d) * (1 - clamp((u - b) / out));
const hide = (...els) => els.forEach(e => tf(e, { o: 0 }));
function actor(par, kind) { const w = add(par, `<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>`); const ch = STORY.character(kind); w.appendChild(ch); return { w, ch }; }
const place = (a, x, y, s = 1, flip = false, o = 1) => { a.w.style.transform = `translate(${x}px,${y}px) scale(${flip ? -s : s},${s})`; a.w.style.opacity = o; a.w.style.visibility = o > .001 ? 'visible' : 'hidden'; };
const at = (par, x, y, html, cls = '') => add(par, `<div class="abs ${cls}" style="left:${x}px;top:${y}px">${html}</div>`);
const typed = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
const cntTxt = n => Math.round(n).toLocaleString('en-US');
function masDraw(el, u, a, b = 1e9, { amp = 6, ph = 0 } = {}) { const l = ent(u, a, b, { s0: .5, dy: 140, d: .7 }); tf(el, { ...l, y: l.y + bob(u, ph, amp), r: Math.sin(u * 1.7 + ph) * 2 }); }

// ---------------------------------------------------------------- deep-navy layer (Blue × Pink Fusion) + light sweep
const nbg = $('nbg'), nGl = [...nbg.querySelectorAll('.gl')], nDots = [];
[[560, 'rgba(34,211,238,.20)', 300, 520], [520, 'rgba(238,127,170,.18)', 820, 1400], [620, 'rgba(47,107,255,.25)', 180, 1600]].forEach(([r, c, x, y], i) => { const g = nGl[i]; g.style.width = g.style.height = r * 2 + 'px'; g.style.background = `radial-gradient(circle,${c} 0%,rgba(0,0,0,0) 68%)`; g.dataset.x = x - r; g.dataset.y = y - r; });
for (let i = 0; i < 40; i++) { const s = 4 + (i * 7) % 9, c = ['#22D3EE', '#EE7FAA', '#FFFFFF', '#95BFEF'][i % 4]; const d = add($('ng-dots'), `<div class="dt" style="width:${s}px;height:${s}px;background:${c};box-shadow:0 0 ${s * 2}px ${c}"></div>`); nDots.push({ d, x: (i * 263) % 1080, y: (i * 547) % 1920, sp: 14 + (i * 13) % 30, ph: i * 1.3 }); }
// [start, end, fade-in s, fade-out s] (0 = instant, hidden under a wipe)
const DARK = [
  [0, B1, 0, 0],
  [ST + sb.tool - .25, B2, .6, 0],
  [MI + mb.tool - .35, MI + mb.easy - .05, .6, .6],
  [EX + eb.rem - .3, EX + eb.note - .05, .6, .6],
  [AN + ab.again - .3, AN + ab.others - .1, .6, .6],
  [AN + ab.rem - .3, B5, .6, 0],
];
const darkAt = t => Math.max(0, ...DARK.map(([a, b, fi, fo]) => (t < a || t >= b) ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1)));
const SWEEPS = DARK.flatMap(([a, b, fi, fo]) => [fi ? a : null, fo ? b - fo : null]).filter(x => x !== null);
function drawFusion(t) {
  const dk = darkAt(t); nbg.style.opacity = dk; nbg.style.visibility = dk > .001 ? 'visible' : 'hidden';
  if (dk > .001) {
    nbg.querySelector('.grid').style.transform = `translate(${(t * 6) % 80}px,${(t * 14) % 80}px)`;
    nGl.forEach((g, i) => tf(g, { x: +g.dataset.x + Math.sin(t * .3 + i * 2) * 80, y: +g.dataset.y + Math.cos(t * .25 + i) * 70, s: 1 + .1 * Math.sin(t * .5 + i) }));
    nDots.forEach(p => { let y = (p.y - t * p.sp) % 1980; if (y < -40) y += 1980; tf(p.d, { x: p.x + Math.sin(t * .7 + p.ph) * 22, y, o: .35 + .35 * Math.sin(t * 1.4 + p.ph) }); });
  }
  const sw = $('sweep'); let sp = -1; SWEEPS.forEach(a => { if (t >= a - .1 && t < a + .7) sp = (t - a + .1) / .8; });
  if (sp < 0) sw.style.visibility = 'hidden'; else { sw.style.visibility = 'visible'; sw.style.transform = `translateX(${lerp(-700, 1400, E.inOut(sp))}px) rotate(14deg)`; sw.style.opacity = Math.sin(Math.PI * sp); }
}
SWEEPS.forEach(a => sfx('riser', a - .2, .5));

// ---------------------------------------------------------------- shared: merge demonstration (template + recipient table → personalised letters)
function mergeDemo(par, { tTop = 470, sheetTop = 930 } = {}) {
  const g = layer(par);
  const tpl = MM.letter(250), tplBox = at(g, 230, tTop, ''); tplBox.appendChild(tpl.el);
  const tplLab = add(g, `<div class="abs" style="left:230px;width:250px;top:${tTop + 350}px;display:flex;justify-content:center">${chip(`${IC.wordTile(38)}แม่แบบ`, 'wt', 30, 250)}</div>`);
  const fl = add(g, `<div class="abs" style="left:540px;width:310px;top:${tTop + 40}px;display:flex;flex-direction:column;align-items:center;gap:20px">
    ${chip('«ชื่อ»', 'cy', 44, 300)}${chip('«ที่อยู่»', 'cy', 44, 300)}<div class="sz" data-fit="300" style="font-weight:800;font-size:32px;color:#31445D;white-space:nowrap">ช่องข้อมูลที่เปลี่ยนได้</div></div>`);
  const sh = MM.sheet(ROWS, 620), shBox = at(g, 230, sheetTop, ''); shBox.appendChild(sh.el);
  const OUT = [[562, tTop + 8, -6], [600, tTop + 30, 0], [638, tTop + 52, 6]];
  const outs = OUT.map((o, i) => { const l = MM.letter(200); const b = at(g, 0, 0, ''); b.appendChild(l.el); l.set({ mode: 'value', name: ROWS[i][0], addr: ROWS[i][1] }); return { l, b }; });
  const svg = add(g, `<svg class="abs" width="1080" height="1920" style="left:0;top:0;overflow:visible"></svg>`);
  const lkN = MM.link(svg), lkA = MM.link(svg, { c: C.pink });
  const NAME = [230 + 112, tTop + 52], ADDR = [230 + 72, tTop + 88];
  // c: { tpl, tplOut, fields:[a,b], sheet, rows:[t0,t1,t2], body, names, out }
  function draw(u, c, t) {
    tf(g, { o: fade(u, c.tpl - .1, c.out, .2, .35) });
    show(tplBox, u, c.tpl, c.out); show(tplLab, u, c.tpl + .3, c.out);
    show(fl, u, c.fields[0], c.fields[1]);
    show(shBox, u, c.sheet, c.out, { dy: 60 });
    let mode = 'field', nm = '', ad = '', glow = .5 + .5 * Math.sin(t * 5) * fade(u, c.fields[0], c.rows[0]);
    c.rows.forEach((r0, i) => {
      const hl = fade(u, r0, r0 + 1.25, .15, .25); sh.hl(i, hl);
      const tr = P(u, r0 + .2, .7);
      const sx = 230 + sh.nameX, sy = c.sheetTop ?? sheetTop;
      const rowY = (c.sheetTop ?? sheetTop) + sh.rowY(i);
      if (u >= r0 && u < r0 + 1.2) {
        lkN.set([230 + sh.nameX, rowY - 20, NAME[0], NAME[1] + 20], P(u, r0 + .05, .35), tr, 1 - P(u, r0 + .95, .25));
        lkA.set([230 + sh.addrX, rowY - 20, ADDR[0] + 40, ADDR[1] + 18], P(u, r0 + .1, .35), P(u, r0 + .25, .7), 1 - P(u, r0 + .95, .25), .3);
      }
      if (u >= r0 + .9 && u < r0 + 1.6) { mode = 'value'; nm = ROWS[i][0]; ad = ROWS[i][1]; glow = 1 - P(u, r0 + .9, .6); }
    });
    if (!c.rows.some(r0 => u >= r0 && u < r0 + 1.2)) { lkN.set([0, 0, 1, 1], 0, -1, 0); lkA.set([0, 0, 1, 1], 0, -1, 0); }
    tpl.set({ mode: u < c.fields[0] ? 'blank' : mode, name: nm, addr: ad, glow });
    outs.forEach((o, i) => {
      const a = c.rows[i] + 1.25, p = E.inOut(P(u, a, .55));
      const [x, y, r] = OUT[i];
      tf(o.b, { x: lerp(255, x, p), y: lerp(tTop + 20, y, p), r: r * p, s: lerp(.6, 1, p), o: u >= a ? clamp((u - a) * 6) * fade(u, a, c.out, .1, .35) : 0 });
      o.l.set({ mode: 'value', name: ROWS[i][0], addr: ROWS[i][1], body: fade(u, c.body, 1e9, .4) * (.6 + .4 * Math.sin(t * 4)), glow: fade(u, c.names, 1e9, .3) * (.5 + .5 * Math.sin(t * 5 + i)) });
    });
  }
  return { g, draw, sh };
}
function mergeSfx(base, c) { c.rows.forEach((r, i) => { sfx('click', base + r, .7); sfx('riser', base + r + .15, .25); sfx('pop', base + r + .9, .8); sfx('page', base + r + 1.25, .8); }); sfx('sparkle', base + c.body, .5); }

// ======================================================================
// SCENE 1 — HOOK (01_hook.mp3) · deep-navy office, "เตรียมสอบนายสิบ" + 500 on frame 0
// ======================================================================
const s1 = $('s1');
const hSetRoot = add(s1, `<div class="abs" style="inset:0;overflow:hidden"></div>`);
const hOff = MM.office(hSetRoot, 'night');
const hK = actor(hOff.actors, 'K');
const hStL = MM.stack(18, 170); at(hOff.front, 96, 1240 - 272, '').appendChild(hStL.el);
const hStR = MM.stack(14, 130); at(hOff.front, 950, 1240 - 208, '').appendChild(hStR.el);
const hScrL = MM.letter(330); hScrL.el.style.margin = '24px auto 0'; hOff.mon.screen.appendChild(hScrL.el);
const hVeil = add(s1, `<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(12,27,58,.92) 0%,rgba(12,27,58,.78) 30%,rgba(12,27,58,.15) 48%,rgba(12,27,58,0) 60%)"></div>`);
const hDim = add(s1, `<div class="abs" style="inset:0;background:rgba(10,22,48,.82)"></div>`);
// frame-0 title block
const hKw = ctr(s1, 360, `<div class="hd sz" data-fit="620" style="font-size:104px">เตรียมสอบ<span style="color:var(--fy)">นายสิบ</span></div>`);
const hSub = ctr(s1, 490, chip('500 ฉบับ ต้องพิมพ์ทีละคน?', 'pk', 46));
const hNeed = ctr(s1, 490, chip(`${IC.wordTile(52)}คนใช้ Microsoft Word ต้องรู้!`, 'cy', 42));
const h500 = ctr(s1, 590, `<div class="kw sz" style="font-size:220px">500</div>`);
const h500b = ctr(s1, 815, `<div class="hd sz" style="font-size:44px;color:#BFEFFF">ฉบับ</div>`);

// fit critical one-line text to its column width once the Prompt font is loaded (deterministic, before frame 0)
function fitAll() {
