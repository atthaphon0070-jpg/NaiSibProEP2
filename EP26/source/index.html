<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx, mark, pressDepth } = NSP;
const { IC, BLUE, GREEN, LAV } = OFFICE;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const H0 = S('hook'), ST0 = S('story'), MI0 = S('mistake'), EX0 = S('expl'), QS = S('quiz'), CD = S('cd'), AN = S('ans'), PR = S('promo');
const add = (par, html) => { const e = h(html); par.appendChild(e); return e; };
const ctr = (par, top, inner, cls = '') => add(par, `<div class="ctr c ${cls}" style="top:${top}px">${inner}</div>`);
const grad = (a, b) => `linear-gradient(90deg,${a},${b})`;
const tag = (txt, bg, fs = 40, extra = '') => `<div class="tagp" style="font-size:${fs}px;color:#fff;background:${bg};box-shadow:0 12px 26px rgba(110,90,150,.28),inset 0 3px 0 rgba(255,255,255,.35);${extra}">${txt}</div>`;
const L = (u, a, b = 1e9, o = {}) => life(u, a, b, o);
const pop = (el, u, a, b = 1e9, o = {}) => tf(el, L(u, a, b, o));
// actor wrapper: origin at the feet
function actor(par, kind) { const w = add(par, `<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>`); const ch = STORY.character(kind); w.appendChild(ch); return { w, ch }; }
const place = (a, x, y, s = 1, flip = false, o = 1) => { a.w.style.transform = `translate(${x}px,${y}px) scale(${flip ? -s : s},${s})`; a.w.style.opacity = o; a.w.style.visibility = o > .001 ? 'visible' : 'hidden'; };
function masDraw(el, u, a, b = 1e9, { amp = 6, ph = 0, jump = 0 } = {}) {
  const l = L(u, a, b, { from: .3, dy: 160, d: .8, el: true, out: .3 });
  tf(el, { ...l, y: l.y + bob(u, ph, amp) - (jump ? Math.abs(Math.sin(u * 6)) * jump : 0), r: Math.sin(u * 1.7 + ph) * 2.5, sx: l.s * (1 + .02 * Math.sin(u * 3.4 + ph)), sy: l.s * (1 - .02 * Math.sin(u * 3.4 + ph)) });
}
// mail UI inside a monitor: design coords → stage coords
const scr = (m, x0, y0, w) => { const k = w / 900; return (x, y) => [x0 + 20 * k + x * k, y0 + 20 * k + y * k]; };
const SEND_BTN = [720, 466], ATT = [210, 392];

// ======================================================================
// SCENE 1 — HOOK  (01_hook.mp3, measured phrase starts)
// 0.11 เตรียมสอบนายสิบ | 1.54 ข้อนี้คนทำงานราชการต้องรู้ | 4.49 ถ้าคุณส่งหนังสือราชการทางอีเมลไปแล้ว | 7.06 ยังต้องพิมพ์…ใส่ซองส่งตามไปอีกหรือเปล่า
// 10.88 หลายคนอาจตอบว่า | 12.40 ต้องส่งสิ | 13.43 แต่เดี๋ยวก่อน | 16.16 ระเบียบงานสารบรรณฉบับใหม่ อาจทำให้คำตอบของคุณเปลี่ยนไป
// ======================================================================
const hk = { att: .45, cur: 4.6, click: 5.75, split: 7.06, env2: 9.0, q: 9.3, many: 10.88, must: 12.40, wait: 13.43, q2: 14.7, reg: 16.16, chg: 18.4 };
const s1 = $('s1');
const hSet = OFFICE.set(add(s1, `<div class="abs" style="inset:0;overflow:hidden"></div>`));
const hVeil = add(s1, `<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(255,248,252,.78),rgba(255,248,252,.5) 45%,rgba(234,243,254,.72))"></div>`);
const hNet = add(s1, `<div class="abs" style="inset:0"></div>`);
const hMonBox = add(s1, `<div class="abs c" style="left:110px;top:660px;width:860px;height:671px"></div>`);
const hMon = OFFICE.monitor(860); hMonBox.appendChild(hMon.el);
const hMail = OFFICE.mailUI(); hMon.screen.appendChild(hMail.el);
const hCur = add(hMail.el, `<div style="position:absolute;left:0;top:0">${IC.cursor(64)}</div>`);
const hS = scr(hMon, 110, 660, 860);
const hDoc = add(s1, `<div class="abs" style="left:0;top:0">${IC.paper(170)}</div>`);
const hTitle = add(s1, `<div class="abs c" style="left:0;width:1080px;top:236px;text-align:center"><div class="title-sticker" style="font-size:120px;line-height:1.15">เตรียมสอบ<span style="color:var(--hot)">นายสิบ</span></div></div>`);
const hSub = ctr(s1, 432, tag(`${IC.env(64, '#fff').replace('fill="#fff"', 'fill="rgba(255,255,255,.2)"')}ส่งอีเมลแล้ว ต้องส่งกระดาษซ้ำไหม?`, grad('#5E8FD6', '#95BFEF'), 50));
const hCue1 = add(s1, `<div class="abs c" style="left:30px;top:560px">${IC.env(120)}</div>`);
const hCue2 = add(s1, `<div class="abs c" style="left:906px;top:540px">${IC.paper(130, '')}</div>`);
const hMust = add(s1, `<div class="abs c" style="left:560px;top:578px">${tag('คนทำงานราชการต้องรู้!', grad('#EE7FAA', '#F7A8C8'), 38, 'transform:rotate(-4deg)')}</div>`);
const hEnv = add(s1, `<div class="abs" style="left:0;top:0">${IC.env(150)}</div>`);
const hTrail = [...Array(6)].map(() => add(s1, `<div class="abs" style="left:0;top:0;width:22px;height:22px;border-radius:50%;background:#B8D9F8;box-shadow:0 0 14px #95BFEF"></div>`));
// split: e-mail vs paper
const hLblA = add(s1, `<div class="abs c" style="left:120px;width:340px;top:736px;display:flex;justify-content:center">${tag(`${IC.env(56, '#fff').replace('fill="#fff"', 'fill="rgba(255,255,255,.2)"')}อีเมล`, grad('#5E8FD6', '#95BFEF'), 44)}</div>`);
const hLblB = add(s1, `<div class="abs c" style="left:590px;width:420px;top:736px;display:flex;justify-content:center">${tag('เอกสารกระดาษ', grad('#EE7FAA', '#F7A8C8'), 44)}</div>`);
const hPrBox = add(s1, `<div class="abs c" style="left:620px;top:840px"></div>`);
const hPr = OFFICE.printer(370); hPrBox.appendChild(hPr.el);
const hManila = add(s1, `<div class="abs c" style="left:860px;top:1120px"><svg width="170" height="120" viewBox="0 0 170 120"><rect x="4" y="4" width="162" height="112" rx="10" fill="#EBC98F" stroke="#fff" stroke-width="5"/><path d="M8 8 L85 62 L162 8" fill="none" stroke="#C9A065" stroke-width="5"/></svg><div style="position:absolute;left:0;right:0;top:122px;text-align:center;font-weight:700;font-size:28px;color:#8A6A3A">ซองเอกสาร</div></div>`);
const hQ = add(s1, `<div class="abs c" style="left:455px;top:880px"></div>`); hQ.appendChild(LEGAL.qmark(150));
const hWarn = add(s1, `<div class="abs c" style="left:445px;top:890px">${IC.warn(190)}</div>`);
const hPeople = [220, 470, 720].map((x, i) => { const el = add(s1, `<div class="abs c" style="left:${x}px;top:1330px"></div>`); el.appendChild(LEGAL.person(140, ['#95BFEF', '#F5A9C7', '#C7B7EE'][i])); const b = add(s1, `<div class="abs c" style="left:${x - 30}px;top:1240px">${tag('ต้องส่ง!', '#fff', 36, 'color:#E0517F;box-shadow:0 10px 22px rgba(110,90,150,.2),0 0 0 4px #F5A9C7')}</div>`); return { el, b }; });
const hStamp = add(s1, `<div class="abs c" style="left:590px;top:960px;transform-origin:50% 50%"><div style="padding:10px 30px;border:9px solid #E0517F;border-radius:22px;color:#E0517F;font-weight:800;font-size:76px;background:rgba(255,255,255,.88);white-space:nowrap;box-shadow:0 10px 26px rgba(224,81,127,.3)">ต้องส่งซ้ำ?</div></div>`);
const hWaitTx = ctr(s1, 560, `<div class="title-sticker" style="font-size:96px;color:#E0517F">แต่เดี๋ยวก่อน...</div>`);
const hPulse = add(s1, `<div class="abs" style="left:540px;top:985px;width:10px;height:10px"></div>`);
const hRings = [0, 1, 2].map(() => add(hPulse, `<div style="position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:10px solid rgba(255,190,70,.8)"></div>`));
// regulation → digital network
const hReg = add(s1, `<div class="abs c" style="left:180px;top:390px;width:720px;height:240px">
  <div class="card" style="position:absolute;inset:0;display:flex;align-items:center;gap:28px;padding:0 40px">
    <div style="flex:none;width:130px;height:160px;border-radius:16px;background:linear-gradient(160deg,#F7B6D0,#EE7FAA);display:grid;place-items:center;box-shadow:0 10px 18px rgba(238,127,170,.35)">${ICON.book(90, '#fff')}</div>
    <div><div style="font-weight:800;font-size:58px;line-height:1.2">ระเบียบงานสารบรรณ</div><div style="font-weight:600;font-size:34px;color:var(--muted)">ติดต่อราชการยุคดิจิทัล</div></div></div>
  <div style="position:absolute;right:-26px;top:-30px;transform:rotate(8deg)">${tag('ฉบับใหม่!', grad('#26A269', '#5FDC9B'), 36)}</div></div>`);
const NET_C = [540, 1010], NET_R = 300;
const hHub = add(hNet, `<div class="abs c" style="left:${NET_C[0] - 120}px;top:${NET_C[1] - 120}px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#E3EEFD);box-shadow:0 0 0 10px rgba(255,255,255,.9),0 0 0 22px rgba(149,191,239,.45),0 20px 40px rgba(80,110,170,.3);display:grid;place-items:center">${IC.env(130)}</div>`);
const hNetSvg = add(hNet, `<svg class="abs" width="1080" height="1920" style="left:0;top:0"></svg>`);
const hNodes = [...Array(6)].map((_, i) => {
  const a = -Math.PI / 2 + i * Math.PI / 3, x = NET_C[0] + Math.cos(a) * NET_R, y = NET_C[1] + Math.sin(a) * NET_R * .82;
  const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ln.setAttribute('x1', NET_C[0]); ln.setAttribute('y1', NET_C[1]); ln.setAttribute('x2', x); ln.setAttribute('y2', y); ln.setAttribute('stroke', '#95BFEF'); ln.setAttribute('stroke-width', 8); ln.setAttribute('stroke-linecap', 'round');
  hNetSvg.appendChild(ln);
  const el = add(hNet, `<div class="nnode c" style="left:${x}px;top:${y}px">${i % 2 ? IC.file(66, '#5E8FD6', 'DOC') : IC.file(66)}</div>`);
  const pk = add(hNet, `<div class="abs" style="left:0;top:0;width:24px;height:24px;border-radius:50%;background:#5E8FD6;box-shadow:0 0 16px #95BFEF"></div>`);
  return { el, ln, pk, x, y, len: Math.hypot(x - NET_C[0], y - NET_C[1]) };
});
const hChange = ctr(s1, 1390, tag('คำตอบอาจเปลี่ยนไป!', grad('#EE7FAA', '#9C8FE6'), 58));
hSet.camera(560, 1000, 1.25, 1);
const hDesk = OFFICE.mailUI(); hSet.mon.screen.appendChild(hDesk.el); hDesk.draw({});
// SFX
sfx('pop', H0 + hk.att + .8, .7); sfx('pop', H0 + 1.6, .8); sfx('type', H0 + 4.7, .5);
sfx('click', H0 + hk.click, 1); sfx('whoosh', H0 + hk.click + .1, .8); sfx('notify', H0 + hk.click + .9, .7);
sfx('swoosh', H0 + hk.split - .1, .5); sfx('printer', H0 + hk.split + .5, 1); sfx('printer', H0 + hk.split + 1.9, .9); sfx('page', H0 + hk.env2 + .2, .6); sfx('pop', H0 + hk.q, .9);
hPeople.forEach((_, i) => sfx('msg', H0 + hk.many + .3 + i * .4, .8));
sfx('stamp', H0 + hk.must + .1, 1); sfx('printer', H0 + hk.must + .1, 1.2);
sfx('freeze', H0 + hk.wait + .05, 1); sfx('pop', H0 + hk.q2, .8);
sfx('riser', H0 + hk.reg - .4, .8); sfx('sparkle', H0 + hk.reg + .5, .8); hNodes.forEach((_, i) => sfx('pop', H0 + hk.reg + .9 + i * .14, .45)); sfx('ding', H0 + hk.chg + .1, .7);
function drawHook(t) {
  const u = t - H0;
  // camera push toward the monitor (starts moving on frame 1)
  const push = E.out(P(u, 0, 4.4));
  hSet.camera(560, 1000 - 40 * push, 1.25 + .1 * push, 1);
  // title: full-size from frame 1, then compacts at the top
  const sh = E.inOut(P(u, 4.2, .7));
  tf(hTitle, { y: -36 * sh + bob(u, 0, 3), s: lerp(1 + .03 * Math.sin(u * 4) * (1 - sh), .58, sh) });
  tf(hSub, { y: bob(u, 1, 3) - 30 * E.in(P(u, 4.2, .5)), s: 1 - .15 * P(u, 4.2, .5), o: 1 - P(u, 4.2, .4) });
  tf(hMust, { ...L(u, 1.54, 4.3, { from: .2, dy: 20, el: true, d: .8 }), r: Math.sin(u * 3) * 2 });
  tf(hCue1, { x: -260 * E.in(P(u, 4.0, .6)), y: bob(u, 0, 10), r: -8 + Math.sin(u * 2) * 4, o: 1 - P(u, 4.0, .5) });
  tf(hCue2, { x: 260 * E.in(P(u, 4.0, .6)), y: bob(u, 2, 10), r: 8 + Math.sin(u * 2 + 1) * 4, o: 1 - P(u, 4.0, .5) });
  // monitor: e-mail composer (frame 1: document beside the screen, about to be attached)
  const sp = E.inOut(P(u, hk.split, .8)), out = E.in(P(u, hk.reg - .2, .6));
  tf(hMonBox, { x: -250 * sp, y: -10 * sp + 260 * out, s: lerp(1 + .02 * push, .5, sp) * (1 - .5 * out), o: 1 - out });
  const ap = E.inOut(P(u, hk.att, .9)), [ax, ay] = hS(...ATT);
  tf(hDoc, { x: lerp(-30, ax - 85, ap), y: lerp(1080, ay - 110, ap) + bob(u, 0, 6) * (1 - ap), r: lerp(-10, 0, ap), s: lerp(1, .15, E.in(ap)), o: ap < 1 ? 1 : 0 });
  const cu = E.inOut(P(u, hk.cur, 1.0));
  hCur.style.transform = `translate(${lerp(520, SEND_BTN[0], cu)}px,${lerp(250, SEND_BTN[1], cu)}px) scale(${1 - .15 * pressDepth(u, [hk.click])})`;
  hCur.style.opacity = clamp((u - hk.cur + .2) * 4) * (1 - P(u, hk.click + .5, .3));
  hMail.draw({ t: u, on: 1, win: 1, to: 1, sub: 1, att: P(u, hk.att + .75, .4), press: pressDepth(u, [hk.click]), out: P(u, hk.click + .4, .5), st: P(u, hk.click + .8, .4) });
  // envelope leaves the screen
  const ev = P(u, hk.click + .1, 1.1), [bx, by] = hS(...SEND_BTN);
  const ex = lerp(bx, 1180, E.in(ev)), ey = lerp(by, 380, E.out(ev)) - Math.sin(ev * Math.PI) * 160;
  tf(hEnv, { x: ex - 75, y: ey - 54, s: .4 + .8 * Math.sin(Math.PI * Math.min(1, ev * 1.2)), r: -12 * ev, o: ev > 0 && ev < 1 ? 1 : 0 });
  hTrail.forEach((d, i) => { const e2 = clamp(ev - (i + 1) * .045); tf(d, { x: lerp(bx, 1180, E.in(e2)) - 11, y: lerp(by, 380, E.out(e2)) - Math.sin(e2 * Math.PI) * 160 - 11, s: 1 - i * .13, o: e2 > 0 && ev < 1 ? .9 - i * .12 : 0 }); });
  // split: e-mail vs paper (printer)
  const so = 1 - P(u, hk.reg - .2, .5);
  tf(hLblA, { ...L(u, hk.split + .3, hk.wait - .1, { from: .4, dy: 30 }) });
  tf(hLblB, { ...L(u, hk.split + .5, hk.wait - .1, { from: .4, dy: 30 }) });
  const pl = L(u, hk.split + .25, hk.reg - .2, { from: .3, dy: 120, d: .7 });
  const frz = u >= hk.wait;
  const feed = frz ? 5.2 : P(u, hk.split + .6, 3.8) * 3 + P(u, hk.must + .1, 1.2) * 2.2;
  tf(hPrBox, { ...pl, x: frz ? 0 : (u > hk.must ? Math.sin(u * 40) * 2 : 0) });
  hPr.draw({ t: u, feed, frozen: clamp((u - hk.wait) * 4), shake: u > hk.must && !frz ? 1 : 0 });
  tf(hManila, { ...L(u, hk.env2, hk.reg - .2, { from: .3, dy: 40 }), r: 6 });
  const q1 = L(u, hk.q, hk.wait - .05, { from: .2, dy: 0, el: true, d: .8, out: .15 });
  const q2 = L(u, hk.q2, hk.reg - .2, { from: .2, dy: 0, el: true, d: .8 });
  tf(hQ, { ...(u < hk.wait ? q1 : q2), y: bob(u, 0, 10), r: Math.sin(u * 2) * 6 });
