<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const FR = x => Math.round(x * T.fps) / T.fps - 1e-6;      // snap a cue onto its exact frame
const ZX = 190, ZW = 680, ZC = 530;                          // Central Safe Zone V2: x 190–870, y 300–1430
const { stamp, envelope, stampTool, splash, ICO, RED } = SARABAN;
const LV = ['ด่วน', 'ด่วนมาก', 'ด่วนที่สุด'];               // the three ชั้นความเร็ว (only three)
const IN = 'ด่วนภายใน';
const ARTICLE = 'ข้อ 28';                                    // verified: ข้อ 28 in the 2526 regulation and the current consolidated text
const PROMO_CUES = [0.06, 4.66, 7.24, 8.61, 9.99, 11.95, 13.60, 15.03];   // measured phrase starts in 07_promotion                                      // delivery-deadline wording, NOT a fourth class
const LVCOL = ['#F2A33A', '#EE6A3A', RED];
const LVICON = [s => ICO.clock(s, '#31445D', 1), s => ICO.clock(s, '#31445D', 2), s => ICO.bolt(s)];
const DEF = [['ให้เจ้าหน้าที่ปฏิบัติ', 'เร็วกว่าปกติ เท่าที่จะทำได้'], ['ให้เจ้าหน้าที่ปฏิบัติ', 'โดยเร็ว'], ['ให้เจ้าหน้าที่ปฏิบัติ', 'ในทันทีที่ได้รับหนังสือ']];
const SHORT = ['ปฏิบัติเร็วกว่าปกติ เท่าที่จะทำได้', 'ปฏิบัติโดยเร็ว', 'ปฏิบัติในทันทีที่ได้รับ'];
const add = (root, html) => { const el = h(html); root.appendChild(el); return el; };
const place = (el, x, y) => { el.style.position = 'absolute'; el.style.left = x + 'px'; el.style.top = y + 'px'; return el; };
const hideAll = list => list.forEach(e => tf(e, { o: 0 }));
function camTrack(u, keys) {   // [t, cx, cy, z, easeDur]
  let i = 0; while (i < keys.length - 1 && keys[i + 1][0] <= u) i++;
  const k = keys[i], pv = keys[Math.max(0, i - 1)], e = k[4] > 0 ? E.inOut(P(u, k[0], k[4])) : 1, from = k[4] > 0 && i > 0 ? pv : k;
  return [lerp(from[1], k[1], e), lerp(from[2], k[2], e), lerp(from[3], k[3], e) * (1 + .006 * Math.min(5, u - k[0]))];
}
const chip = (root, top, cls, html, size = 38) => add(root, `<div class="Z zc c" style="top:${top}px"><span class="chip2 ${cls}" style="font-size:${size}px">${html}</span></div>`);
const mascot = (root, file, x, y, hgt) => add(root, `<div class="mas" style="left:${x}px;top:${y}px"><img src="../../shared/brand/${file}" style="height:${hgt}px"></div>`);
// zone-safe entrance/exit for elements near the top edge: rise in from below, sink out downward
function lifeT(u, a, b = 1e9, o = {}) { const l = life(u, a, b, { ...o, dy: Math.abs(o.dy ?? 20) }); l.y += 50 * E.out(P(u, b, o.out ?? .3)); return l; }
function masDraw(el, u, a, b = 1e9, { amp = 5, ph = 0, jump = 0 } = {}) {
  const l = life(u, a, b, { from: .3, dy: 0, d: .7, el: true, out: .3 });
  tf(el, { ...l, y: l.y + bob(u, ph, amp) - (jump ? Math.abs(Math.sin(u * 6)) * jump : 0), r: Math.sin(u * 1.7 + ph) * 2, sx: l.s * (1 + .02 * Math.sin(u * 3.4)), sy: l.s * (1 - .02 * Math.sin(u * 3.4)) });
}
// a stamp slam: tool comes down, impact at `at` (s), lifts away. returns {press, lift}
function slam(tool, sp, u, at, x, y) {
  const down = E.in(P(u, at - .32, .32)), up = E.out(P(u, at + .12, .35));
  const on = u > at - .45 && u < at + .6;
  const sq = 1 - .12 * Math.max(0, 1 - Math.abs(u - at) / .08);
  tf(tool, { x, y: y - 260 * (1 - down) - 300 * up, sy: sq, sx: 1 / sq, o: on ? clamp((u - at + .45) * 6) * (1 - P(u, at + .35, .2)) : 0 });
  tool.style.left = '0px'; tool.style.top = '0px';
  sp.style.left = x + 'px'; sp.style.top = y + 'px'; sp.draw(u - at);
}

// ======================================================================
// OFFICE WORLD (background for everything except the promo)
// ======================================================================
const office = OFFICE.office($('world'));
const OFFX = 1130, OFFY = 1478, OSC = .78;
const officer = STORY.character('Off');
const offW = add(office.actors, '<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>'); offW.appendChild(officer);
offW.style.transform = `translate(${OFFX}px,${OFFY}px) scale(${OSC})`;
// saraban counter in front of the officer (covers her legs), with the in-tray, ink pad and stamp
const counter = add(office.actors, `<div style="position:absolute;left:800px;top:1262px;width:800px;height:420px">
  <div style="position:absolute;left:30px;top:44px;width:740px;height:370px;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#C99B72,#A3754F);box-shadow:inset 0 10px 0 rgba(0,0,0,.08)"></div>
  ${[0, 1].map(i => `<div style="position:absolute;left:${70 + i * 360}px;top:110px;width:300px;height:110px;border-radius:14px;background:#B98A62;box-shadow:inset 0 0 0 6px rgba(255,255,255,.12)"><div style="position:absolute;left:115px;top:46px;width:70px;height:16px;border-radius:8px;background:#E6C59D"></div></div>`).join('')}
  <div style="position:absolute;left:300px;top:262px;width:200px;height:56px;border-radius:14px;background:#E9DCC6;box-shadow:0 6px 12px rgba(0,0,0,.16)"><div style="position:absolute;left:26px;top:22px;width:148px;height:12px;border-radius:6px;background:#C9B08C"></div></div>
  <div style="position:absolute;left:0;top:0;width:800px;height:54px;border-radius:16px;background:linear-gradient(180deg,#E9C29C,#C89A70);box-shadow:0 14px 22px rgba(60,40,30,.3)"></div>
  <div style="position:absolute;left:10px;top:4px;width:780px;height:18px;border-radius:10px;background:rgba(255,255,255,.25)"></div></div>`);
const deskTray = SARABAN.tray(250, 3); add(office.actors, '<div></div>').appendChild(deskTray); place(deskTray, 850, 1150);
const deskPad = add(office.actors, `<div style="position:absolute;left:1390px;top:1232px;width:120px;height:40px;border-radius:10px;background:#2C334A;box-shadow:inset 0 6px 0 #C81E3A"></div>`);
const deskStamp = SARABAN.stampTool(110); office.actors.appendChild(deskStamp); deskStamp.style.left = '1460px'; deskStamp.style.top = '1262px';
let CAM = [1200, 1100, 1];
const w2s = (x, y) => [540 + (x - CAM[0]) * CAM[2], 960 + (y - CAM[1]) * CAM[2]];
function world(cam, t, { blur = 0, veil = 0, dof = .25 } = {}) {
  CAM = cam; office.camera(cam[0], cam[1], cam[2], t, dof);
  $('world').style.display = 'block';
  $('world').style.filter = blur > .05 ? `blur(${blur}px) saturate(${1 - blur * .02})` : '';
  $('veil').style.opacity = veil;
}
function offPose(u, o = {}) { officer.pose({ t: u, expr: 'smile', blink: STORY.blinkAt(u, .7), lookY: .6, armL: [10, 30], armR: [10, 30], ...o }); }

// ======================================================================
// S1 — HOOK  (0.07 เตรียมสอบ | 1.65 ระวังข้อนี้ | 3.17 หนังสือราชการที่เขียนว่า | 5.13 ด่วน | 5.80 ด่วนมาก | 6.73 ด่วนที่สุด
//             8.14 สามคำนี้ 9.00 ต่างกันอย่างไร | 10.30 แล้วถ้า 11.40 ด่วนภายใน 12.49 เพิ่มเข้ามา | 13.69 ระดับที่ 4? | 16.34 ระวังตอบผิด
//             17.84 วันนี้…งานสารบรรณ | 20.26 พร้อมทดสอบความรู้)
// ======================================================================
const H0 = S('hook');
const hk = { warn: 1.65, write: 3.17, s: [5.13, 5.80, 6.73], title: 8.14, diff: 9.0, sub: 9.45, e4: 10.30, s4: 11.40, q4: 12.49, lvl4: 13.69, careful: 16.34, today: 17.84, test: 20.26 };
const HK = $('hk');
const hChip = chip(HK, 334, 'cw', `<img src="../../shared/brand/logo.png" style="width:52px">เตรียมสอบนายสิบตำรวจ`, 36);
const hWarn = chip(HK, 422, 'cr', `${ICO.warn(44, '#FFE08A')}ต้องระวังข้อนี้!`, 40);
const HENV = [{ x: 200, y: 520, r: -6 }, { x: 300, y: 700, r: 3 }, { x: 395, y: 880, r: -3 }];
const hEnv = HENV.map(p => { const e = envelope(420); place(e, p.x, p.y); HK.appendChild(e); return e; });
const hEnvStamps = hEnv.map((e, i) => { const s = stamp(LV[i], 44); e.label.appendChild(s); return s; });
const hTool = stampTool(190); HK.appendChild(hTool);
const hSp = splash(300); HK.appendChild(hSp);
const hWrite = chip(HK, 1220, 'cw', 'หนังสือราชการที่เขียนว่า…', 36);
const hTitleRow = add(HK, `<div class="Z c" style="top:334px;display:flex;justify-content:center;gap:10px"></div>`);
const hTitleSt = LV.map(l => { const s = stamp(l + '!', 44, { rot: 0, solid: true }); s.style.boxShadow = '0 10px 22px rgba(211,38,62,.45)'; const w = h('<div class="c"></div>'); w.appendChild(s); hTitleRow.appendChild(w); return w; });
const hTitle = add(HK, `<div class="Z c" style="top:410px;text-align:center"><div class="h-xl" style="font-size:100px;line-height:1.12;white-space:nowrap">ต่างกัน<br><span style="color:#FFD2DC">อย่างไร?</span></div></div>`);
const hSub = chip(HK, 650, 'cw', `<b style="color:#3E7BD6">วิชางานสารบรรณ</b><span style="color:#9AA8BE">•</span>เตรียมสอบนายสิบตำรวจ`, 28);
const hEnv4 = envelope(440); place(hEnv4, 245, 752); HK.appendChild(hEnv4);
const hEnv4St = stamp(IN, 50); hEnv4.label.appendChild(hEnv4St);
const hQ = add(HK, `<div class="abs c" style="left:712px;top:762px;width:140px;height:140px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(14,26,60,.35),0 0 0 8px rgba(211,38,62,.35)"><span style="font-weight:800;font-size:110px;line-height:1;color:${RED}">?</span></div>`);
// "level 4?" ladder — it is a QUESTION here (answered later: no)
const hLad = add(HK, `<div class="abs c" style="left:200px;top:1070px;width:660px;height:320px"></div>`);
const LAD = [...LV.map((l, i) => ({ l, hh: 106 + i * 58, col: LVCOL[i] })), { l: 'ระดับ 4?', hh: 290, col: null }];
LAD.forEach((s, i) => add(hLad, `<div class="lad" style="position:absolute;left:${i * 167}px;bottom:0;width:158px;height:${s.hh}px;border-radius:20px 20px 10px 10px;${s.col ? `background:linear-gradient(180deg,#fff,#FFE9EE);box-shadow:0 12px 24px rgba(14,26,60,.3),inset 0 -12px 0 ${s.col}` : 'background:rgba(14,26,56,.42);border:5px dashed #fff'};display:flex;align-items:flex-start;justify-content:center;padding-top:18px">
  <span style="font-weight:800;font-size:${s.col ? 30 : 30}px;color:${s.col ? s.col : '#fff'};white-space:nowrap">${s.l}</span>${s.col ? '' : `<span style="position:absolute;bottom:40px;font-weight:800;font-size:110px;color:#fff;line-height:1">?</span>`}</div>`));
const ladEls = [...hLad.querySelectorAll('.lad')];
const hCareful = chip(HK, 1085, 'cr', `${ICO.warn(48, '#FFE08A')}ระวังตอบผิดนะ!`, 46);
const hMas = mascot(HK, 'mascot_pose.png', 640, 1182, 216);
const hToday = add(HK, `<div class="Z zc c" style="top:1118px"><div class="glass" style="display:flex;align-items:center;gap:22px;padding:22px 30px">
  <img src="../../shared/brand/logo.png" style="width:120px"><div><div class="t-s" style="color:var(--muted)">วันนี้เรียน</div><div class="h-l" style="color:#3E7BD6;font-size:58px">งานสารบรรณ</div>
  <div class="hk-test" style="display:flex;align-items:center;gap:10px;margin-top:4px"><span class="chip2 cp" style="font-size:28px;padding:6px 18px">พร้อมทดสอบความรู้</span></div></div></div></div>`);
const hTest = hToday.querySelector('.hk-test');
const HK_ALL = [hChip, hWarn, ...hEnv, hTool, hWrite, hTitleRow, hTitle, hSub, hEnv4, hQ, hLad, hCareful, hMas, hToday];
sfx('whoosh', H0 + .15, .6); HENV.forEach((p, i) => sfx('drop', H0 + .55 + i * .2, .7)); sfx('pop', H0 + .1, .6); sfx('pop', H0 + hk.warn, .8);
hk.s.forEach(a => { sfx('whoosh', a - .35, .3); sfx('stamp', H0 + a, 1.1); });
sfx('riser', H0 + hk.title - .5, .5); hTitleSt.forEach((_, i) => sfx('stamp', H0 + hk.title + i * .18, .6)); sfx('pop', H0 + hk.diff, .9); sfx('pop', H0 + hk.sub, .6);
sfx('whoosh', H0 + hk.e4, .5); sfx('drop', H0 + hk.e4 + .4, .6); sfx('page', H0 + hk.s4, .8); sfx('pop', H0 + hk.q4, .9);
LAD.forEach((_, i) => sfx('pop', H0 + hk.lvl4 + i * .2, .6)); sfx('stamp', H0 + hk.careful, .6); sfx('pop', H0 + hk.careful + .3, .7);
sfx('whoosh', H0 + hk.today - .1, .4); sfx('ding', H0 + hk.today + .1, .6); sfx('pop', H0 + hk.test, .7);
function drawHook(t) {
  const u = t - H0;
  hideAll(HK_ALL);
  offPose(u);
  world(camTrack(u, [[0, 1180, 1200, 2.3, 0], [.01, 1170, 1180, 1.6, 9]]), t, { blur: 5, veil: .55, dof: .6 });
  const shake = Math.max(0, 1 - Math.abs(u - .7) / .15) * 6;
  tf(hChip, lifeT(u, .1, hk.s[0] - .55, { from: .5, out: .25 }));
  tf(hWarn, { ...lifeT(u, hk.warn, hk.s[0] - .55, { from: .3, dy: 0, el: true, out: .25 }), r: Math.sin(u * 7) * 1.5 });
  // three envelopes fly in, then each gets its red stamp ON the spoken word
  hEnv.forEach((e, i) => {
    const a = .2 + i * .2, k = E.out(P(u, a, .5)), out = E.in(P(u, hk.title - .25, .35));
    tf(e, { x: (1 - k) * (500 + i * 60), y: (1 - k) * -700 + (i === 0 ? shake : 0) - out * 60, r: HENV[i].r + (1 - k) * 40 + (u > hk.write ? Math.sin(u * 1.4 + i) * 1 : 0), s: (1 + .04 * P(u, hk.write, 1.5)) * (1 - .2 * out), o: clamp((u - a) * 8) * (1 - out) });
    tf(hEnvStamps[i], { s: u < hk.s[i] ? 0 : lerp(1.3, 1, E.out(P(u, hk.s[i], .18))), o: u < hk.s[i] ? 0 : 1, r: -4 });
  });
  let ti = -1; hk.s.forEach((a, i) => { if (u > a - .5 && u < a + .6) ti = i; });
  if (ti >= 0) { const p = HENV[ti]; slam(hTool, hSp, u, hk.s[ti], p.x + 34 * .7 + 80 + ti * 18, p.y + 34 * .7 + 36); }
  else { tf(hTool, { o: 0 }); hSp.draw(-1); }
  tf(hWrite, life(u, hk.write, hk.title - .1, { from: .5, dy: 20, out: .25 }));
  // title
  hTitleSt.forEach((w, i) => tf(w, life(u, hk.title + i * .18, 1e9, { from: 1.12, dy: 0, d: .3 })));
  tf(hTitleRow, { o: 1 });
  tf(hTitle, life(u, hk.diff, 1e9, { from: .5, dy: 40, d: .6 }));
  tf(hSub, life(u, hk.sub, 1e9, { from: .5, dy: 20 }));
  // the 4th envelope — ด่วนภายใน — and the question mark
  const e4 = E.out(P(u, hk.e4, .6));
  tf(hEnv4, { x: 0, y: (1 - e4) * 700, r: -2 + Math.sin(u * 1.3) * 1, o: clamp((u - hk.e4) * 5) });
  tf(hEnv4St, { s: u < hk.s4 ? 0 : 1, o: u < hk.s4 ? 0 : 1, r: -4 });

  tf(qBrand, { ...hb, o: hb.o * (1 - out), s: hb.s * (1 + .07 * Math.max(0, 1 - Math.abs(ua - .1) / .3) + .07 * Math.max(0, 1 - Math.abs(rv - .1) / .3)) });
  const qc = life(u, qS.card, 1e9, { from: .6, dy: 40 }); tf(qCard, { ...qc, o: qc.o * (1 - out), y: qc.y - 60 * out });
  NSP.drawQuizOptions(qOpts, u, rv, qS.opts, CORRECT, { shiftY: 0, slide: 0 });
  qOpts.forEach(o => { o.el.style.opacity = +o.el.style.opacity * (1 - out); if (o.el.style.opacity < .01) o.el.style.visibility = 'hidden'; });
  NSP.drawCountdown(qCd, uc, T.cd[1]);
  masDraw(qThink, u, qS.think, D('quiz') + 5.0, { amp: 4 });
  tf(qTB, life(u, qS.think + .3, D('quiz') - .3, { from: .4, dy: 10 }));
  NSP.drawConfetti(qConf, t, AN + aS.reveal + .05, 2.2);
  const ms = life(ua, aS.reveal + .5, aS.out, { from: .4, dy: 30, d: .6, out: .3 }); tf(aMas, { ...ms, r: Math.sin(ua * 2.4) * 4, y: ms.y + Math.abs(Math.sin(ua * 5)) * 6 });
  // ด่วนภายใน: when + how (envelope diagram + checklist)
  const endA = aS.rem - .1;
  tf(aHdr, lifeT(ua, aS.out + .3, endA, { from: .5, out: .3 }));
  tf(aWhen, lifeT(ua, aS.when, endA, { from: .5, out: .3 }));
  tf(aEnv, { ...life(ua, aS.out + .4, endA, { from: .6, dy: 60, out: .3 }), r: -1.5 + Math.sin(ua * 1.2) * .8 });
  tf(aEnvSt, { o: ua >= aS.word2 ? 1 : 0, s: ua < aS.word2 ? 0 : lerp(1.6, 1, E.out(P(ua, aS.word2, .2))), r: -4 });
  aL1.style.clipPath = `inset(0 ${100 - 100 * E.inOut(P(ua, aS.date, .7))}% 0 0)`; aL2.style.clipPath = `inset(0 ${100 - 100 * E.inOut(P(ua, aS.time, .5))}% 0 0)`;
  tf(aRing, { o: ua > aS.env && ua < endA ? clamp((ua - aS.env) * 4) * (.7 + .3 * Math.sin(ua * 5)) : 0 });
  aChecks.forEach((c, i) => tf(c, life(ua, aS[CHECKS[i][1]] + .1, endA, { from: .85, dy: 20, out: .3 })));
  // remember: not a 4th class — the two different things
  tf(aRem, lifeT(ua, aS.rem, 1e9, { from: .4, el: true }));
  tf(aNot4, life(ua, aS.not4, 1e9, { from: .5, dy: 30 }));
  tf(aN4x, { s: ua < aS.not4 + .7 ? 0 : E.elastic(P(ua, aS.not4 + .7, .8)), o: ua < aS.not4 + .7 ? 0 : 1, r: -38 });
  tf(aL, life(ua, aS.three, 1e9, { from: .6, dy: 40 }));
  aLst.forEach((w, i) => tf(w, { s: ua < aS.l3[i] ? .9 : 1 + .1 * Math.max(0, 1 - (ua - aS.l3[i]) / .3), o: ua < aS.l3[i] ? .25 : 1 }));
  const ar = life(ua, aS.three + .25, 1e9, { from: .6, dy: 40 }); tf(aR, { ...ar, o: ar.o * (ua < aS.inn ? .32 : 1) });   // ghost first, full when ด่วนภายใน is discussed
  tf(aRst, { o: ua < aS.inn ? 0 : 1 });
  if (ua >= aS.inn) tf(aRst, { s: 1 + .08 * Math.max(0, 1 - (ua - aS.inn) / .4) }); tf(aRic, life(ua, aS.innDef, 1e9, { from: .4, dy: 10, el: true })); tf(aRdef, life(ua, aS.innDef + .3, 1e9, { from: .6, dy: 10 }));
  tf(aMid, life(ua, aS.inn + .2, 1e9, { from: .2, dy: 0, el: true }));
  tf(aWho, life(ua, aS.who, 1e9, { from: .4, dy: 20, el: true }));
  masDraw(aWhoMas, ua, aS.who + .1, 1e9, { amp: 4, jump: 12 });
}
