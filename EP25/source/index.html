<script>

const { folder, doc, shredder, calendar, shelf, desk, door, stamp, stopSign, IC } = ARCH;
const T = window.TL, D = k => T[k][1];
const H0 = T.hook[0], S0 = T.story[0], K0 = T.know[0], X0 = T.expl[0], Q0 = T.quiz[0], CD = T.cd[0], A0 = T.ans[0], PR = T.promo[0];
const R0 = A0 + 31.55;          // recap starts just before "และจำให้แม่นอีกข้อหนึ่ง" (answer 31.73)
const BASE = NSP.BASE;
const add = (parent, html) => { const e = h(html); parent.appendChild(e); return e; };
const addEl = (parent, e, x, y) => { e.style.left = x + 'px'; e.style.top = y + 'px'; parent.appendChild(e); return e; };
const pop = (e, u, a, b = 1e9, o = {}, x = {}) => { const l = life(u, a, b, o); tf(e, { x: x.x || 0, y: l.y + (x.y || 0), s: l.s * (x.s ?? 1), o: l.o * (x.o ?? 1), r: x.r || 0 }); return l; };
const hide = (...els) => els.forEach(e => tf(e, { o: 0 }));
const ctr = (parent, top, inner, cls = '') => add(parent, `<div class="ctr c ${cls}" style="top:${top}px">${inner}</div>`);
// quadratic arc between two points
const arc = (a, b, k, lift = 160) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k) - Math.sin(k * Math.PI) * lift];
// paper bits frozen at time tf0 (deterministic)
function paperBits(parent, n, cx, cy) {
  return [...Array(n)].map((_, i) => { const e = add(parent, `<div class="abs" style="left:0;top:0;width:${16 + (i % 3) * 6}px;height:${24 + (i % 4) * 5}px;border-radius:3px;background:${['#fff', '#FCE3EF', '#E2ECFA', '#FFF4D6'][i % 4]};box-shadow:0 0 0 2px #DCE6F4"></div>`);
    const a = -Math.PI / 2 + ((i * 0.6180339) % 1 - .5) * 2.2, v = 260 + (i * 97 % 220); return { e, vx: Math.cos(a) * v, vy: Math.sin(a) * v, cx, cy, r: (i * 53) % 360, ph: i * .13 % .5 }; });
}
function drawBits(bits, u, a, freezeAt, endAt) {
  bits.forEach(b => { const tt = Math.min(u, freezeAt) - a - b.ph; if (tt < 0 || u > endAt + .4) { tf(b.e, { o: 0 }); return; }
    const k = tt % 1.1; tf(b.e, { x: b.cx + b.vx * k * .7, y: b.cy + b.vy * k * .9 + 380 * k * k, r: b.r + k * 300, o: (1 - k / 1.1) * (1 - P(u, endAt, .4)) }); });
}
function mascot(parent, src, x, y, hgt) { return add(parent, `<div class="mas" style="left:${x}px;top:${y}px"><img src="${BASE}brand/${src}" style="height:${hgt}px"></div>`); }
function masDraw(e, u, a, b = 1e9, { amp = 6, ph = 0 } = {}) { const l = life(u, a, b, { from: .4, dy: 120, d: .7, el: true, out: .35 }); tf(e, { ...l, y: l.y + bob(u, ph, amp, 2.2), r: Math.sin(u * 1.7 + ph) * 1.5 }); }
const chipHTML = (txt, cls = '', icon = '') => `<div class="chip ${cls}">${icon}${txt}</div>`;
const VAL = [['10 ปี', 'pnum', '#EE7FAA'], ['5 ปี', 'bnum', '#6F9FE0'], ['1 ปี', 'lnum', '#9C8FE6'], ['ตลอดไป', 'gnum', '#E7B84A']];
// summary rows (scenes 3 and 5 share the same layout)
function retentionRows(parent, top, gap) {
  const rows = [
    ['โดยปกติ', 'หนังสือราชการทั่วไป', 0],
    ['คู่สำเนา', 'ทำเสร็จแล้ว + ค้นต้นเรื่องได้จากที่อื่น', 1],
    ['เรื่องธรรมดาสามัญ', 'ไม่สำคัญ • เป็นประจำ • ทำเสร็จแล้ว', 2],
    ['คุณค่าทางประวัติศาสตร์', 'สถิติ • หลักฐาน • ใช้ศึกษาค้นคว้า', 3],
  ];
  return rows.map(([a, b, i]) => {
    const v = VAL[i];
    const art = i === 0 ? ICON.docs(42, '#fff') : i === 1 ? `<div style="font-size:26px">2×</div>` : i === 2 ? IC.loop(42, '#fff') : IC.inf(46, '#fff');
    const e = add(parent, `<div class="row c" style="top:${top + i * gap}px"><div class="bd" style="background:linear-gradient(160deg,${v[2]}AA,${v[2]})">${art}</div>
      <div class="ct">${a}<small>${b}</small></div><div class="vl"><small>${i < 3 ? 'ไม่น้อยกว่า' : 'เก็บไว้'}</small><b class="${v[1]}" style="font-size:54px">${v[0]}</b></div></div>`);
    e.vl = e.querySelector('.vl'); return e;
  });
}

// ======================================================================
// SCENE 1 — HOOK: THE SHREDDER STOP  (01_hook.mp3, measured phrase starts)
// 0.07 เตรียมสอบนายสิบ | 1.52 ข้อนี้หลายคนพลาด | 3.27 เพราะจำได้แค่ว่า…10 ปี (≈6.0) | 7.42 แต่เดี๋ยวก่อน | 8.64 ถ้าเก็บครบ 10 ปีแล้ว
// 10.31 เราจะเอาไปทำลายได้เลยจริงไหม | 12.80 ความจริงคือ | 13.88 ไม่ใช่ทุกเอกสารจะเก็บ 10 ปีเท่ากัน | 16.85 และถึงจะครบกำหนดแล้ว
// 18.63 ก็ยังมีขั้นตอนก่อนทำลายด้วย | 20.89 มาดูข้อนี้ให้ชัด | 22.32 เพราะออกสอบได้แน่นอน
// ======================================================================
const s1 = $('s1');
s1.insertAdjacentHTML('beforeend', `<div id="h-cam" class="abs" style="inset:0;transform-origin:540px 1000px">
  <div id="h-room" class="abs" style="inset:0"></div><div id="h-drift" class="abs" style="inset:0"></div><div id="h-mid" class="abs" style="inset:0"></div></div>
  <div id="h-front" class="abs" style="inset:0"></div>
  <div id="h-flash" class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(224,81,127,0) 40%,rgba(224,81,127,.45) 100%);opacity:0"></div>
  <div id="h-frame" class="abs" style="inset:22px;border-radius:40px;box-shadow:0 0 0 10px #fff,inset 0 0 0 4px rgba(224,81,127,.6);opacity:0"></div>`);
{
  const room = $('h-room');
  room.insertAdjacentHTML('beforeend', `<div class="abs" style="left:0;top:1440px;width:1080px;height:480px;background:linear-gradient(180deg,#EADCF2,#F6EDF8)"></div><div class="abs" style="left:0;top:1440px;width:1080px;height:10px;background:#D9C6E6"></div>`);
  const L = addEl(room, shelf(330, 900, 1), -150, 560), R = addEl(room, shelf(330, 900, 3), 900, 560);
  [L, R].forEach(e => { e.style.opacity = .6; e.style.filter = 'blur(2px)'; });
}
const hDrift = [...Array(6)].map((_, i) => { const f = folder(130 + (i % 3) * 20, { col: ['blue', 'lav', 'manila', 'pink', 'gold', 'blue'][i] }); addEl($('h-drift'), f, 0, 0); f.style.opacity = .5; f.style.filter = 'blur(1.5px)'; return { f, y: 560 + (i * 151) % 520, sp: 38 + (i % 3) * 14, ph: i * 230 }; });
const hTitle = add(s1, `<div class="abs c title-sticker" style="left:0;width:1080px;top:236px;text-align:center;font-size:122px;line-height:1.2">เตรียมสอบ<span style="color:var(--hot)">นายสิบ</span></div>`);
const hSub = ctr(s1, 400, chipHTML('เอกสารราชการ เก็บกี่ปี?', 'blue', ICON.docs(48, '#5E8FD6')));
const hMiss = add(s1, `<div class="abs c" style="left:640px;top:492px"><div class="chip red" style="font-size:38px;transform:rotate(5deg)">${IC.warn(40, '#fff')}ข้อนี้หลายคนพลาด!</div></div>`);
const hCal = addEl($('h-mid'), calendar(210), 70, 650);
const hTen = add(s1, `<div class="abs c" style="left:290px;top:480px;width:500px;text-align:center"><span class="gnum" style="font-size:170px">10 ปี</span></div>`);
const hArrow = add($('h-mid'), `<svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920"><path id="h-arp" d="M870 880 Q900 1010 700 1050" fill="none" stroke="#EE7FAA" stroke-width="10" stroke-linecap="round" stroke-dasharray="22 18"/><path id="h-arh" d="M712 1022 L690 1052 L726 1066" fill="none" stroke="#EE7FAA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const hShr = addEl($('h-mid'), shredder(420), 330, 1000);
const hFold = folder(300, { col: 'pink', label: 'แฟ้มเอกสาร', fs: 40 }); hShr.feed.appendChild(hFold); hFold.style.left = '-150px'; hFold.style.top = '0px';
const hBits = paperBits($('h-front'), 14, 540, 1040);
const hStop = addEl(s1, stopSign(200), 770, 820);
const hWait = ctr(s1, 500, chipHTML('แต่เดี๋ยวก่อน!', 'red', IC.warn(44, '#fff')));
const hQ = add(s1, `<div class="abs c title-sticker" style="left:0;width:1080px;top:478px;text-align:center;font-size:78px;line-height:1.3">ครบ 10 ปี = ทำลายได้เลย<span id="h-qm" style="display:inline-block;color:var(--red);transform-origin:50% 70%">?</span></div>`);
const hNot = ctr(s1, 490, chipHTML('ไม่ใช่ทุกเอกสาร เก็บ 10 ปีเท่ากัน!', 'gold'));
const hSteps = ctr(s1, 490, chipHTML('ครบกำหนดแล้ว ก็ยังมีขั้นตอนก่อนทำลาย', 'blue', IC.lock(46)));
const H4 = [['10 ปี', 'pink'], ['5 ปี', 'blue'], ['1 ปี', 'lav'], ['ตลอดไป', 'gold']].map(([l, c], i) => { const f = folder(220, { col: c, label: l, fs: l.length > 4 ? 40 : 50 }); addEl(s1, f, 30 + i * 260, 610); return f; });
const hChain = ['สำรวจ', 'ทำบัญชีขอทำลาย', 'เสนอพิจารณา'].map((s, i) => add(s1, `<div class="tagp c" style="left:${[70, 320, 700][i]}px;top:850px;font-size:30px">${[IC.mag(36), IC.list(36), IC.bldg(36)][i]}${s}</div>`));
const hChArr = [0, 1].map(i => add(s1, `<div class="abs c" style="left:${[263, 652][i]}px;top:862px;font-weight:800;font-size:40px;color:var(--hot)">›</div>`));
const hLock = add(s1, `<div class="abs c" style="left:480px;top:1050px;filter:drop-shadow(0 8px 12px rgba(90,70,40,.35))">${IC.lock(120)}</div>`);
const hLook = ctr(s1, 490, chipHTML('มาดูข้อนี้ให้ชัด!', 'blue'));
const hExam = add(s1, `<div class="abs" style="left:0;top:540px;width:1080px;display:flex;justify-content:center"></div>`); hExam.appendChild(stamp('ออกสอบแน่นอน!', { fs: 70, rot: -7 }));
const hFoldMain = folder(300, { col: 'pink', label: '10 ปี', fs: 64 }); addEl(s1, hFoldMain, 390, 640);
const HK = { miss: 1.52, cal: 3.4, ten: 6.0, arrow: 4.6, run: 4.5, stop: 7.42, q: 8.64, qm: 10.31, real: 12.80, split: 13.88, steps: 16.85, lock: 18.63, look: 20.89, exam: 22.32, zoom: D('hook') - .62 };
sfx('pop', H0 + HK.miss, .8); for (let i = 0; i < 9; i++) sfx('page', H0 + HK.cal + .3 + i * .29, .45); sfx('ding', H0 + HK.ten, .6); sfx('whoosh', H0 + HK.arrow, .4);
sfx('shred', H0 + HK.run, .7); sfx('freeze', H0 + HK.stop - .05, 1); sfx('alarm', H0 + HK.stop, .8); sfx('pop', H0 + HK.q, .7); sfx('drop', H0 + HK.qm, .7);
sfx('whoosh', H0 + HK.real, .5); [0, .45, .9, 1.35].forEach(d => sfx('pop', H0 + HK.split + .15 + d, .7)); sfx('pop', H0 + HK.steps, .6);
sfx('stamp', H0 + HK.lock, .8); [0, .35, .7].forEach(d => sfx('click', H0 + HK.lock + .2 + d, .6)); sfx('whoosh', H0 + HK.look, .5); sfx('stamp', H0 + HK.exam + .1, 1); sfx('riser', H0 + HK.zoom - .3, .5); sfx('swoosh', H0 + HK.zoom + .2, .7);
function drawHook(t) {
  const u = t - H0;
  // controlled push-in to the shredder, held during the freeze, then relaxed
  const push = u < HK.stop ? E.inOut(clamp(u / HK.stop)) * .07 : .07 * (1 - E.inOut(P(u, HK.real, 1.2)));
  const zm = E.in(P(u, HK.zoom, .62));
  $('h-cam').style.transform = `scale(${1 + push})`;
  hDrift.forEach((d, i) => { const x = ((d.ph + u * d.sp) % 1400) - 220; tf(d.f, { x, y: d.y + Math.sin(u * 1.3 + i) * 12, r: Math.sin(u + i) * 8, o: .5 * (1 - zm) }); });
  // title is on screen from frame 1 (no entrance), with a gentle breathing scale
  tf(hTitle, { s: 1 + .015 * Math.sin(u * 2.2), y: -40 * E.in(P(u, HK.zoom, .5)), o: 1 - zm });
  tf(hSub, { s: 1 + .02 * Math.sin(u * 2.2 + 1), o: 1 - zm });
  pop(hMiss, u, HK.miss, 5.9, { from: .3, dy: 30, el: true, d: .8 }, { r: Math.sin(u * 3) * 2 });
  // calendar: years pass 1 → 10 while "เพราะจำได้แค่ว่า … 10 ปี"
  const calL = life(u, HK.cal, HK.q - .2, { from: .4, dy: 60 });
  tf(hCal, { ...calL, y: calL.y + bob(u, 1, 5) });
  hCal.set(1 + 9 * E.inOut(P(u, HK.cal + .2, HK.ten - HK.cal - .2)) + (u > HK.ten ? .5 : 0), { doneP: P(u, HK.ten + .1, .5) });
  const tl = life(u, HK.ten, HK.stop - .1, { from: .2, dy: 0, el: true, d: .9 });
  tf(hTen, { ...tl, s: tl.s * (1 + .1 * P(u, HK.ten + .8, 1.0)) });
  // folder approaches the slot (frame 1 already mid-motion), freezes at the mouth, then lifts back out
  const app = E.inOut(clamp((u + .9) / (HK.stop + .9)));
  let fx = lerp(330, 0, app), fy = lerp(-330, -200, app) + (1 - Math.cos(app * Math.PI)) * 0, fr = lerp(12, 0, app);
  fy = lerp(-330, -214, E.in(app)); fx = lerp(330, 0, E.out(app));
  const back = E.inOut(P(u, HK.real, .8));
  fy = lerp(fy, -470, back);
  if (u >= HK.stop && u < HK.stop + .6) fx += Math.sin((u - HK.stop) * 60) * 4 * (1 - P(u, HK.stop, .6));
  hFold.setLabel(u < HK.ten ? 'แฟ้มเอกสาร' : '10 ปี'); hFold.querySelector('.lab').style.fontSize = u < HK.ten ? '40px' : '64px';
  const fs = u < HK.ten ? 1 : 1 + .12 * Math.max(0, 1 - (u - HK.ten) / .4);
  tf(hFold, { x: fx, y: fy, r: fr, s: fs * (1 + .15 * back), o: 1 - P(u, HK.split, .25) });

  const bt = life(ue, .6, 1e9, { from: .5, dy: 50 }); tf(pEnd.querySelector('.e-btn'), { ...bt, s: bt.s * (1 + .04 * Math.sin(ue * 6)) * (1 - .08 * NSP.pressDepth(ue, [1.1, PM.see - PM.end + .9])) });
  const eh = pEnd.querySelector('.e-hand'); eh.style.transform = `translate(0,${bob(ue, 0, 10, 6)}px) scale(${1 - .15 * NSP.pressDepth(ue, [1.1, PM.see - PM.end + .9])})`; eh.style.opacity = clamp((ue - .8) / .2);
  tf(pEnd.querySelector('.e-see'), life(ue, PM.see - PM.end, 1e9, { from: .4, dy: 40 }));
  NSP.drawConfetti(pConf, t, PR + PM.end + .3, 2.8);
}

// paper-sheet transition between the explainer scenes
const PW = [K0, X0, R0];
PW.forEach(b => sfx('swoosh', b - .3, .7));
function drawPaperWipe(t) {

  w.style.transform = `translateY(${lerp(1950, -2350, E.inOut(wp))}px) rotate(-4deg)`;
}
