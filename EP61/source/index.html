<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP61</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
:root{--eb:#2F6BFF;--sb:#95BFEF;--cy:#22D3EE;--ib:#E6F4FF;--nv:#142B53;--bp:#EE7FAA;--pp:#F7A8C4;--rp:#FF91BA;--lb:#FFE3EF;--dt:#31445D;--okg:#22C55E;--bad:#EF4444;--yel:#FFD23F}
body{color:var(--dt)}
.sticker{font-weight:800;text-shadow:6px 0 0 #fff,-6px 0 0 #fff,0 6px 0 #fff,0 -6px 0 #fff,5px 5px 0 #fff,-5px 5px 0 #fff,5px -5px 0 #fff,-5px -5px 0 #fff,0 14px 20px rgba(20,43,83,.22);white-space:nowrap;line-height:1.15}
.row{position:absolute;left:0;width:1080px;display:flex;justify-content:center}
.pillB,.pillP,.pillN,.pillY,.pillG,.pillR{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:800;white-space:nowrap;padding:12px 34px}
.pillB{color:#fff;background:linear-gradient(90deg,#2F6BFF,#5E95FF);box-shadow:0 12px 26px rgba(47,107,255,.35),inset 0 3px 0 rgba(255,255,255,.35)}
.pillP{color:#fff;background:linear-gradient(90deg,#E9679C,#FF91BA);box-shadow:0 12px 26px rgba(238,127,170,.4),inset 0 3px 0 rgba(255,255,255,.35)}
.pillN{color:var(--nv);background:#fff;box-shadow:0 12px 26px rgba(20,43,83,.16),0 0 0 5px rgba(255,255,255,.7)}
.pillY{color:var(--nv);background:linear-gradient(90deg,#FFD23F,#FFE27A);box-shadow:0 12px 26px rgba(230,170,20,.35)}
.pillG{color:#fff;background:linear-gradient(90deg,#16A34A,#22C55E);box-shadow:0 12px 26px rgba(34,197,94,.4)}
.pillR{color:#fff;background:linear-gradient(90deg,#DC2626,#EF4444);box-shadow:0 12px 26px rgba(239,68,68,.4)}
.mas{position:absolute;transform-origin:50% 100%}
.mas img{display:block;filter:drop-shadow(0 18px 22px rgba(20,43,83,.25))}
.mag{position:absolute;left:0;top:0;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 12px #fff,0 0 0 20px #31445D,0 24px 40px rgba(20,43,83,.35)}

.panel{position:absolute;border-radius:40px;background:#fff}
.panel.b{background:linear-gradient(180deg,#fff,#EEF6FF);box-shadow:0 18px 40px rgba(47,107,255,.18),0 0 0 6px #fff,0 0 0 12px #95BFEF}
.panel.p{background:linear-gradient(180deg,#fff,#FFF1F7);box-shadow:0 18px 40px rgba(238,127,170,.2),0 0 0 6px #fff,0 0 0 12px #F7A8C4}

.ch{position:absolute;left:145px;width:790px;height:150px;border-radius:34px;background:#fff;box-shadow:0 12px 26px rgba(20,43,83,.13),0 0 0 4px #fff;display:flex;align-items:center;padding:0 12px}
.ch .lt{flex:none;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:46px;color:#fff;background:linear-gradient(135deg,#2F6BFF 0%,#2F6BFF 50%,#EE7FAA 50%,#EE7FAA 100%);box-shadow:0 0 0 6px #fff,0 6px 14px rgba(20,43,83,.2);margin-right:12px;position:relative}
.ch .lt span{position:relative;top:-2px;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.ch .rows{flex:1;display:flex;flex-direction:column;gap:8px}
.ch .r{display:flex;align-items:center;height:56px;gap:8px}
.ch .tg{flex:none;width:104px;height:48px;border-radius:24px;display:grid;place-items:center;font-weight:800;font-size:25px;color:#fff}
.ch .tg.in{background:#2F6BFF}.ch .tg.ex{background:#EE7FAA}
.ch .cl{position:relative;height:52px;border-radius:14px;display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:31px;white-space:nowrap;color:var(--dt)}
.ch .cl.f{width:232px}.ch .cl.p{flex:1}
.ch .cl .ul{position:absolute;left:10px;right:10px;bottom:4px;height:5px;border-radius:3px;background:#8C9AB3;transform-origin:0 50%;transform:scaleX(0)}
.ch .cl .xx{position:absolute;left:4px;right:4px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#EF4444;transform-origin:0 50%;transform:scaleX(0)}
.ch .ok{position:absolute;left:-20px;top:-22px;width:76px;height:76px;border-radius:50%;background:#22C55E;display:grid;place-items:center;box-shadow:0 0 0 6px #fff;opacity:0}
.ch .no{position:absolute;left:-20px;top:-22px;width:70px;height:70px;border-radius:50%;background:#EF4444;display:grid;place-items:center;box-shadow:0 0 0 6px #fff;opacity:0}
.colh{position:absolute;left:145px;width:790px;height:42px;font-weight:700;font-size:25px;color:#5B6B85}
.colh span{position:absolute;top:4px}
.cbub{position:absolute;background:#fff;border-radius:30px;padding:12px 22px;font-weight:700;font-size:30px;box-shadow:0 10px 22px rgba(20,43,83,.15);white-space:nowrap;display:flex;align-items:center;gap:12px}
.chk{width:56px;height:56px;border-radius:14px;border:5px solid #31445D;background:#fff;display:grid;place-items:center;flex:none}
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage">
  <div class="scene" id="sO"></div>   <!-- hook + story (office) -->
  <div class="scene" id="sK"></div>   <!-- knowledge -->
  <div class="scene" id="sX"></div>   <!-- explanation / Garuda trap -->
  <div class="scene" id="sQ"></div>   <!-- quiz + countdown + answer -->
  <div class="scene" id="sP"></div>   <!-- promo -->
</div>
<script src="../../shared/engine/engine.js"></script>

<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const H0 = S('hook'), ST = S('story'), KN = S('know'), EX = S('expl'), QS = S('quiz'), CD = S('cd'), AN = S('ans'), PR = S('promo');
const add = (root, html) => { const el = h(html); root.appendChild(el); return el; };
const at = (el, cx, cy, o = {}) => { const w = el.offsetWidth || +el.style.width.replace('px', ''), hh = el.offsetHeight || +el.style.height.replace('px', ''); tf(el, { ...o, x: cx - w / 2 + (o.x || 0), y: cy - hh / 2 + (o.y || 0) }); };
const hide = (...els) => els.forEach(e => tf(e, { o: 0 }));
const L = (u, a, b = 1e9, o = {}) => life(u, a, b, { from: .4, dy: 40, ...o });
const docSize = w => [w, w * 848 / 600];
function mag(size, inner) {   // magnifying glass with arbitrary zoomed content
  const el = h(`<div class="abs c" style="left:0;top:0;width:${size}px;height:${size}px"><div class="mag-h" style="left:${size * .82}px;top:${size * .82}px;transform:rotate(-45deg)"></div><div class="mag" style="width:${size}px;height:${size}px;display:grid;place-items:center">${inner}</div>
    <div style="position:absolute;left:${size * .16}px;top:${size * .12}px;width:${size * .3}px;height:${size * .14}px;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-30deg)"></div></div>`);
  return el;
}
function masDraw(el, u, a, b = 1e9, { amp = 6, ph = 0, jump = 0 } = {}) {
  const l = life(u, a, b, { from: .3, dy: 160, d: .8, el: true, out: .3 });
  const jy = jump ? -Math.abs(Math.sin(u * 6)) * jump : 0;
  tf(el, { ...l, y: l.y + bob(u, ph, amp) + jy, r: Math.sin(u * 1.7 + ph) * 2.5, sx: l.s * (1 + .02 * Math.sin(u * 3.4 + ph)), sy: l.s * (1 - .02 * Math.sin(u * 3.4 + ph)) });
}
const ARW = (c = '#31445D', s = 54) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M3 12h16M13 6l6 6-6 6" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const BLD = (c = '#2F6BFF', s = 90) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2L2 7h20z" fill="${c}"/><rect x="3" y="8" width="18" height="2" fill="${c}"/><rect x="4.5" y="10.5" width="2.4" height="8" fill="${c}" opacity=".75"/><rect x="10.8" y="10.5" width="2.4" height="8" fill="${c}" opacity=".75"/><rect x="17.1" y="10.5" width="2.4" height="8" fill="${c}" opacity=".75"/><rect x="2" y="19" width="20" height="3" rx="1" fill="${c}"/></svg>`;
const PERSON = (c = '#EE7FAA', s = 90) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5" fill="${c}"/><path d="M3.5 22c0-5 3.8-8.5 8.5-8.5s8.5 3.5 8.5 8.5z" fill="${c}"/></svg>`;
const ENV = (c = '#EE7FAA', s = 70) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M3 6.5l9 6.5 9-6.5" stroke="${c}" stroke-width="2" fill="none"/></svg>`;
const WARN = (s = 60) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.5L23 21.5H1z" fill="#FFD23F" stroke="#31445D" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v6" stroke="#31445D" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.2" r="1.5" fill="#31445D"/></svg>`;
const SWAP = (c = '#EF4444', s = 60) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const blinkAt = STORY.blinkAt;

// =====================================================================================
// SCENE O — HOOK (01_hook) + STORY (02_story): the document office
// hook  : 0.07 เตรียมสอบนายสิบตำรวจ | 1.85 วิชางานสารบรรณ | 3.75 หนังสือภายใน | 5.00 กับหนังสือภายนอก | 6.34 ต่างกันอย่างไร
//         7.84 หลายคนจำได้ว่า หนังสือราชการมีตราครุฑ | 11.19 แต่พอเจอข้อสอบถามว่า | 13.03 ต้องใช้กระดาษแบบไหน | 14.58 กลับตอบสลับกัน
//         16.06 วันนี้เราจะมาจำให้แม่น | 18.40 พร้อมข้อสอบสับขาหลอก ที่ต้องอ่านช้อยส์ให้ดีครับ
// story : 0.07 ลองนึกภาพว่า | 1.39 เราเป็นเจ้าหน้าที่ธุรการ | 4.74 วันนี้ต้องจัดทำหนังสือสองฉบับ | 7.25 ฉบับแรก | 8.12 ภายในกรมเดียวกัน
//         10.84 ส่วนฉบับที่สอง | 12.15 หนังสือทางการ…ต่างกระทรวง | 15.44 คำถามคือ | 16.51 หนังสือสองฉบับนี้ | 18.15 ควรใช้รูปแบบกระดาษเหมือนกันหรือไม่ | 21.05 มาดูหลักการกันครับ
// =====================================================================================
const sO = $('sO');
const OF = OFFICE.office(sO);
const oA = DOCS.doc('memo', 250), oB = DOCS.doc('letter', 250); sO.append(oA, oB);
const oTitle = add(sO, `<div class="abs" style="left:0;top:262px;width:1080px;text-align:center">
  <div class="sticker" style="font-size:74px;color:var(--nv)">เตรียมสอบ</div>
  <div class="sticker" style="font-size:132px;margin-top:-10px"><span style="color:#2F6BFF">นายสิบ</span><span style="color:#E9679C">ตำรวจ</span></div></div>`);
const oSubj = add(sO, `<div class="row c" style="top:522px"><div class="pillN" style="font-size:46px;padding:12px 40px"><span style="color:#2F6BFF">วิชา</span><span style="color:#E9679C">งานสารบรรณ</span></div></div>`);
const oPA = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillB" style="font-size:38px;padding:10px 28px">หนังสือภายใน</div></div>`);
const oPB = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillP" style="font-size:38px;padding:10px 28px">หนังสือภายนอก</div></div>`);
const oVS = add(sO, `<div class="abs c" style="left:490px;top:640px;width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#2F6BFF 50%,#EE7FAA 50%);display:grid;place-items:center;font-weight:800;font-size:44px;color:#fff;box-shadow:0 0 0 8px #fff,0 12px 24px rgba(20,43,83,.25)">VS</div>`);
const oQ = add(sO, `<div class="abs c sticker" style="left:470px;top:735px;width:140px;text-align:center;font-size:130px;color:#FFB800">?</div>`);
const oCap = add(sO, `<div class="row c" style="top:300px"></div>`);
const caps = {
  garuda: `<div class="pillN" style="font-size:44px;padding:14px 34px"><span>หนังสือราชการ <b style="color:#16A34A">มีตราครุฑ</b></span><span style="width:56px;height:56px;border-radius:50%;background:#22C55E;display:grid;place-items:center">${ICON.check('#fff', 36)}</span></div>`,
  exam: `<div class="pillY" style="font-size:44px;padding:14px 34px">${WARN(56)}ข้อสอบ: ต้องใช้กระดาษแบบไหน?</div>`,
  remember: `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="sticker" style="font-size:78px;color:#2F6BFF">จำให้แม่น</div><div class="sticker" style="font-size:66px;color:#E9679C">ก่อนเสียคะแนน!</div></div>`,
  trick: `<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><div class="pillY" style="font-size:50px;padding:14px 40px">${SWAP('#31445D', 58)}ข้อสอบสับขาหลอก!</div><div class="pillN" style="font-size:38px">อ่านช้อยส์ให้ดีทุกคำ</div></div>`,
  imagine: `<div class="pillN" style="font-size:40px;background:rgba(20,43,83,.82);color:#fff"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>ลองนึกภาพตาม</div>`,
  two: `<div class="pillN" style="font-size:46px;padding:14px 36px"><span>วันนี้ต้องจัดทำหนังสือ <b style="color:#2F6BFF">2</b> <b style="color:#E9679C">ฉบับ</b></span></div>`,
  first: `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="pillB" style="font-size:44px">ฉบับที่ 1</div><div class="pillN" style="font-size:42px">${BLD('#2F6BFF', 54)}ติดต่อภายในกรมเดียวกัน</div></div>`,
  second: `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="pillP" style="font-size:44px">ฉบับที่ 2</div><div class="pillN" style="font-size:36px;flex-direction:column;gap:0;border-radius:36px;line-height:1.3;padding:12px 34px"><span>หนังสือทางการถึง</span><span style="color:#D9558C">ส่วนราชการต่างกระทรวง</span></div></div>`,
  ask: `<div class="pillN" style="font-size:42px;padding:14px 34px;flex-direction:column;gap:0;border-radius:40px;line-height:1.3"><span>ควรใช้<b style="color:#2F6BFF">รูปแบบ</b><b style="color:#E9679C">กระดาษ</b></span><span>เหมือนกันหรือไม่?</span></div>`,
  rule: `<div class="pillY" style="font-size:48px;padding:14px 40px">มาดูหลักการกัน!</div>`,
};
Object.entries(caps).forEach(([k, v]) => { const el = h(`<div class="c" style="position:absolute;top:0;display:flex;justify-content:center;width:1080px">${v}</div>`); oCap.appendChild(el); caps[k] = el; });
const oNA = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillN" style="font-size:30px;padding:8px 22px;color:#2F6BFF;box-shadow:0 8px 18px rgba(47,107,255,.25),0 0 0 4px #95BFEF">กระดาษบันทึกข้อความ</div></div>`);
const oNB = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillN" style="font-size:30px;padding:8px 22px;color:#D9558C;box-shadow:0 8px 18px rgba(238,127,170,.3),0 0 0 4px #F7A8C4">กระดาษตราครุฑ</div></div>`);
const oStamp = add(sO, `<div class="abs c" style="left:0;top:0"><div style="font-weight:800;font-size:66px;color:#EF4444;border:10px solid #EF4444;border-radius:28px;padding:2px 30px;background:rgba(255,255,255,.92);box-shadow:0 14px 30px rgba(239,68,68,.3);white-space:nowrap">จำสลับ = เสียคะแนน!</div></div>`);
const oMagA = mag(170, DOCS.garuda(120)), oMagB = mag(170, DOCS.garuda(120)); sO.append(oMagA, oMagB);
const oTag = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillN" style="font-size:36px;padding:10px 26px;box-shadow:0 10px 20px rgba(20,43,83,.2),0 0 0 5px #FFD23F">${ICON.docs(44, '#2F6BFF')}เจ้าหน้าที่ธุรการ</div></div>`);
const oSame = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillB" style="font-size:40px;background:linear-gradient(90deg,#5E7491,#8C9AB3)">เหมือนกัน?</div></div>`);
const oDiff = add(sO, `<div class="abs c" style="left:0;top:0"><div class="pillB" style="font-size:40px;background:linear-gradient(90deg,#5E7491,#8C9AB3)">ต่างกัน?</div></div>`);
const oFlash = add(sO, `<div class="abs" style="inset:0;background:#fff;opacity:0"></div>`);
const [DW, DH] = docSize(250);
const hk = { sub: 1.85, pa: 3.75, pb: 5.0, diff: 6.34, gar: 7.84, exam: 11.19, names: 13.03, swap: 14.58, stamp: 14.95, rem: 16.06, trick: 18.40 };
const sk = { img: .07, tag: 1.39, two: 4.74, first: 7.25, fcap: 8.12, ftray: 10.0, second: 10.84, scap: 12.15, stray: 14.9, ask: 15.44, both: 16.51, q: 18.15, rule: 21.05 };
// SFX
sfx('sparkle', H0 + .05, .6); sfx('pop', H0 + hk.sub, .8); sfx('pop', H0 + hk.pa, .8); sfx('pop', H0 + hk.pb, .8); sfx('ding', H0 + hk.diff, .5);
sfx('riser', H0 + hk.gar - .1, .5); sfx('sparkle', H0 + hk.gar + .5, .6); sfx('pop', H0 + hk.exam, .8); sfx('pop', H0 + hk.names, .6); sfx('pop', H0 + hk.names + .2, .6);
[0, .45].forEach(d => sfx('swoosh', H0 + hk.swap + d, .6)); sfx('stamp', H0 + hk.stamp, 1); sfx('swoosh', H0 + hk.rem - .1, .5); sfx('ding', H0 + hk.rem + .2, .6); sfx('pop', H0 + hk.trick, .9);
sfx('whoosh', ST + .1, .5); sfx('pop', ST + sk.img, .6); sfx('pop', ST + sk.tag, .8); sfx('page', ST + sk.two + .1, .9); sfx('page', ST + sk.two + .35, .8);
sfx('page', ST + sk.first, .9); sfx('pop', ST + sk.fcap, .7); sfx('drop', ST + sk.ftray + .45, .6); sfx('page', ST + sk.second, .9); sfx('pop', ST + sk.scap, .7); sfx('drop', ST + sk.stray + .45, .6);
sfx('page', ST + sk.both, .8); sfx('pop', ST + sk.q, .8); sfx('pop', ST + sk.q + .4, .7); sfx('riser', ST + sk.rule - .3, .6);
function docAt(d, cx, cy, s, o = {}) { tf(d, { x: cx - DW / 2, y: cy - DH / 2, s, ...o }); }
function drawOffice(t) {
  const u = t - H0, v = t - ST, story = t >= ST;
  OF.clock(t);
  // camera: gentle push-in on the officer in the story
  const z = story ? 1 + .06 * E.inOut(P(v, sk.tag, 1.2)) - .06 * E.inOut(P(v, sk.two, 1)) : 1 + .01 * Math.sin(u * .5);
  OF.cam(z, 0, 0);
  // officer pose
  let p = { t, expr: 'smile', lookY: .2, armL: [10, -8], armR: [10, -8], blink: blinkAt(t), turn: 0, lookX: 0 };
  if (!story) {
    if (u < hk.gar) { p.expr = u > hk.diff ? 'curious' : 'happy'; p.turn = Math.sin(u * 1.4) * .5; p.lookX = p.turn; p.lookY = -.6; p.armR = [30 + 6 * Math.sin(u * 3), 60]; }
