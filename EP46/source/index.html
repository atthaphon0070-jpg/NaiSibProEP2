<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP46</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
/* ===== EP.46 Blue Dominant theme (overrides the shared pastel defaults) ===== */
:root{--navy0:#0B1A36;--navy:#142B53;--eb:#2F6BFF;--cy:#22D3EE;--lb:#95BFEF;--ice:#E6F4FF;--pk:#EE7FAA;--yl:#FFD23F;--gn:#22C55E;--rd:#EF4444;--dk:#31445D}
html,body{background:var(--navy0)}
body{color:var(--ice)}
#bg{background:radial-gradient(ellipse 120% 80% at 50% 28%,#1C3D7A 0%,#142B53 42%,#0B1A36 100%)}
#bg .blob,#bg .grid-dots,#particles{display:none}
#fcbg{position:absolute;inset:0;overflow:hidden}
#fcbg .grid{position:absolute;left:-120px;top:-120px;width:1320px;height:2160px;
  background-image:linear-gradient(rgba(47,107,255,.17) 2px,transparent 2px),linear-gradient(90deg,rgba(47,107,255,.17) 2px,transparent 2px);background-size:120px 120px}
#fcbg .grid2{position:absolute;left:-120px;top:-120px;width:1320px;height:2160px;
  background-image:linear-gradient(rgba(149,191,239,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(149,191,239,.06) 1px,transparent 1px);background-size:30px 30px}
#fcbg .vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%,rgba(11,26,54,0) 40%,rgba(5,12,28,.75) 100%)}
#fcbg .ghost{position:absolute;opacity:.16}
#fcbg .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#22D3EE;box-shadow:0 0 14px 4px rgba(34,211,238,.6)}
#brand .bn{color:var(--ice);text-shadow:0 3px 0 #0B1A36}
#brand .ep{background:linear-gradient(90deg,#2F6BFF,#22D3EE);box-shadow:0 4px 14px rgba(34,211,238,.35)}
#brand img{filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.scene{transform-origin:50% 48%}

/* ===== flowchart symbols ===== */
.fsn{position:absolute;--st:#5FA8FF;--fl:url(#fsFill);--gl:rgba(47,107,255,.35);--tx:#E6F4FF;--ga:.3}
.fsn .sh{fill:var(--fl);stroke:var(--st);stroke-linejoin:round}
.fsn .sh-glow{fill:none;stroke:var(--gl);opacity:var(--ga);filter:blur(9px)}
.fsn .sh-in{fill:none;stroke:rgba(255,255,255,.13);stroke-width:2.5px}
.fsn .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:38px;line-height:1.18;color:var(--tx);white-space:nowrap}
.fsn .lb b{font-weight:800}
.fc-world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.fc-lines{position:absolute;left:0;top:0;overflow:visible}
.fl-base{fill:none;stroke:#3F78E8;stroke-width:7px;stroke-linecap:round;stroke-linejoin:round}
.fl-lit{fill:none;stroke:#22D3EE;stroke-width:9px;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(34,211,238,.9))}
.fl-lit.ok{stroke:#4ADE80;filter:drop-shadow(0 0 10px rgba(34,197,94,.9))}
.fl-lit.bad{stroke:#F87171;filter:drop-shadow(0 0 10px rgba(239,68,68,.9))}
.fl-pulse{fill:none;stroke:#E6FDFF;stroke-width:9px;stroke-linecap:round;filter:drop-shadow(0 0 12px #22D3EE)}
.fl-head{fill:#3F78E8}
.fl-head.on{fill:#22D3EE}.fl-head.on.ok{fill:#4ADE80}.fl-head.on.bad{fill:#F87171}
.fl-label{position:absolute;transform-origin:center;translate:-50% -50%;padding:4px 18px 6px;border-radius:24px;font-weight:800;font-size:32px;white-space:nowrap;
  background:#0E2147;border:3px solid #22D3EE;color:#E6F4FF;box-shadow:0 0 18px rgba(34,211,238,.35)}
.fc-token{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFFFFF,#9BEFFF 35%,#22D3EE 70%);box-shadow:0 0 0 5px rgba(255,255,255,.85),0 0 34px 10px rgba(34,211,238,.75);
  font-weight:800;font-size:38px;color:#0B1A36;visibility:hidden}
.fc-eval{position:absolute;left:0;top:0;transform-origin:left center;padding:8px 20px 10px;border-radius:22px;font-weight:800;font-size:29px;white-space:nowrap;visibility:hidden;
  background:#0B1A36;border:3px solid #FFD23F;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fc-eval.ok{border-color:#4ADE80}.fc-eval.bad{border-color:#F87171}
.fc-pop{position:absolute;left:0;top:0;translate:-50% -50%;padding:10px 34px 14px;border-radius:30px;font-weight:800;font-size:56px;color:#fff;white-space:nowrap;visibility:hidden}
.fc-pop.ok{background:linear-gradient(180deg,#34D97B,#169C4C);box-shadow:0 0 0 5px #fff,0 0 40px 10px rgba(34,197,94,.55)}
.fc-pop.bad{background:linear-gradient(180deg,#F26565,#B42323);box-shadow:0 0 0 5px #fff,0 0 40px 10px rgba(239,68,68,.5)}

/* ===== UI kit ===== */
.col{position:absolute;left:220px;width:640px}
.center{display:flex;justify-content:center;align-items:center}
.pillb{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:800;white-space:nowrap;padding:12px 34px 14px;color:#fff;
  background:linear-gradient(90deg,#2F6BFF,#2A8CF5 55%,#22D3EE);box-shadow:0 10px 28px rgba(47,107,255,.45),inset 0 3px 0 rgba(255,255,255,.3)}
.pillb.yl{background:linear-gradient(90deg,#F5B800,#FFD23F);color:#142B53;box-shadow:0 10px 28px rgba(255,210,63,.35),inset 0 3px 0 rgba(255,255,255,.4)}
.pillb.gn{background:linear-gradient(90deg,#16A34A,#22C55E);box-shadow:0 10px 28px rgba(34,197,94,.4),inset 0 3px 0 rgba(255,255,255,.3)}
.pillb.rd{background:linear-gradient(90deg,#DC2626,#EF4444);box-shadow:0 10px 28px rgba(239,68,68,.4),inset 0 3px 0 rgba(255,255,255,.3)}
.pillb.pk{background:linear-gradient(90deg,#EE7FAA,#F59BC0)}
.pillb .n{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--eb);display:grid;place-items:center;font-size:30px}
.panel{position:absolute;border-radius:40px;background:linear-gradient(180deg,rgba(28,61,122,.92),rgba(16,36,74,.94));
  box-shadow:0 0 0 3px rgba(47,107,255,.75),0 0 0 9px rgba(34,211,238,.12),0 24px 60px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12)}
.glowtx{font-weight:800;color:#fff;text-shadow:0 0 22px rgba(34,211,238,.55),0 6px 0 #0B1A36}
.en{font-weight:800;letter-spacing:3px;color:var(--cy)}
.th{font-weight:700;color:var(--ice)}
.y{color:var(--yl)}
.g{color:#4ADE80}.r{color:#F87171}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:10px 26px 12px;border-radius:30px;font-weight:700;white-space:nowrap;
  background:#0E2147;border:3px solid rgba(34,211,238,.8);color:#E6F4FF;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.bigq{position:absolute;font-weight:800;color:#FFD23F;text-shadow:0 0 40px rgba(255,210,63,.55),0 10px 0 #0B1A36}

/* quiz cards */
.qopt{position:absolute;left:230px;width:620px;height:194px;border-radius:34px;
  background:linear-gradient(180deg,rgba(30,64,128,.95),rgba(18,40,82,.96));box-shadow:0 0 0 3px rgba(95,168,255,.7),0 16px 36px rgba(0,0,0,.4)}
.qopt .lt{position:absolute;left:22px;top:50%;margin-top:-40px;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:44px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#5B8CFF,#2F6BFF 70%);box-shadow:0 0 0 6px rgba(230,244,255,.9)}
.qopt .shp{position:absolute;left:118px;top:20px;width:484px;height:100px;display:flex;align-items:center;justify-content:space-between}
.qopt .shp .ar{width:34px;height:34px;color:#95BFEF}
.qopt .tx{position:absolute;left:122px;right:12px;top:128px;text-align:center;font-weight:700;font-size:30px;color:#E6F4FF;white-space:nowrap}
.qopt .ok{position:absolute;right:-14px;top:-18px;width:76px;height:76px;border-radius:50%;background:#22C55E;display:grid;place-items:center;box-shadow:0 0 0 6px #fff,0 0 30px rgba(34,197,94,.8);visibility:hidden}
.qopt.focus{box-shadow:0 0 0 4px #22D3EE,0 0 34px rgba(34,211,238,.45),0 16px 36px rgba(0,0,0,.4)}
.qopt.right{background:linear-gradient(180deg,#1FAE5C,#127A44);box-shadow:0 0 0 5px #4ADE80,0 0 50px 8px rgba(34,197,94,.55),0 16px 36px rgba(0,0,0,.4)}
.qopt.right .lt{background:radial-gradient(circle at 35% 30%,#9CF2C6,#16A34A 75%)}

/* countdown */
.cdw{position:absolute;width:210px;height:210px}
.cdw .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:112px;color:#fff;line-height:1;padding-top:6px;text-shadow:0 0 30px rgba(47,107,255,.9)}

/* misc */
.monitor{position:absolute}
.scr{position:absolute;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#0F2350,#0B1A36);box-shadow:inset 0 0 0 3px rgba(95,168,255,.5)}
.caret{display:inline-block;width:5px;height:56px;background:#22D3EE;vertical-align:middle;margin-left:4px}
.row{position:absolute;left:230px;width:620px;height:172px;border-radius:30px;display:flex;align-items:center;gap:22px;padding:0 24px;
  background:linear-gradient(90deg,rgba(28,61,122,.95),rgba(16,36,74,.92));box-shadow:0 0 0 3px rgba(95,168,255,.55),0 14px 30px rgba(0,0,0,.35)}
.row .ic{flex:none;width:200px;height:130px;display:grid;place-items:center}
.row .t1{font-size:40px;font-weight:800;color:#fff;line-height:1.2}
.row .t2{font-size:30px;font-weight:700;color:var(--cy);line-height:1.3}
.card6{position:absolute;width:200px;height:216px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,rgba(28,61,122,.95),rgba(16,36,74,.95));box-shadow:0 0 0 3px rgba(95,168,255,.6),0 14px 30px rgba(0,0,0,.35)}
.card6 .e{font-size:22px;font-weight:800;letter-spacing:1.5px;color:var(--cy)}
.card6 .t{font-size:30px;font-weight:700;color:#fff;line-height:1.1}
</style>
<script src="timeline.js"></script>
<script src="beats.js"></script>
<script src="decision_logic.js"></script>
<script src="flowchart_spec.js"></script>
</head>
<body>
<div id="stage">
  <div class="scene" id="sHook"></div>
  <div class="scene" id="sStory"></div>
  <div class="scene" id="sKnow"></div>
  <div class="scene" id="sExpl"></div>
  <div class="scene" id="sChart"></div>
  <div class="scene" id="sQuiz"></div>
  <div class="scene" id="sPromo"></div>
</div>
<script src="../../shared/engine/engine.js"></script>
<script src="flowchart_symbols.js"></script>
<script src="flowchart_engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
