<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP47 — Five Types of Computers</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
/* ===== EP47 Blue Dominant theme (overrides the shared pastel defaults for this episode only) ===== */
html,body{background:#0B1A36}
#bg{background:linear-gradient(170deg,#0A1730 0%,#142B53 48%,#1A3766 100%)!important}
#bg .grid-dots{background-image:radial-gradient(rgba(149,191,239,.20) 2px,transparent 2.4px);opacity:.55}
#particles{display:none}
#stage .scene{transform:none!important;z-index:0}
#brand{left:112px;top:184px}   /* inside the fill-to-height crop on 19.5:9 phones and below the platform top bars */
#brand .bn{color:#E6F4FF;text-shadow:0 3px 0 rgba(8,20,44,.7)}
#brand img{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#brand .ep{background:linear-gradient(90deg,#2F6BFF,#22D3EE);box-shadow:0 4px 12px rgba(47,107,255,.45)}
#wipe .band:nth-child(1),#wipe .band:nth-child(5){background:#22D3EE!important}
#wipe .band:nth-child(2),#wipe .band:nth-child(4){background:#2F6BFF!important}
#wipe .band:nth-child(3){background:linear-gradient(180deg,#142B53,#0A1730)!important}
body{color:#142B53}

/* layout primitives (critical text stays inside x 220–860, y 350–1430) */
.row{position:absolute;left:220px;width:640px;display:flex;justify-content:center;align-items:center}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:800;white-space:nowrap}
.hp{font-size:38px;padding:12px 32px 12px 14px;color:#fff;background:linear-gradient(90deg,#2F6BFF,#3F86FF);box-shadow:0 10px 26px rgba(47,107,255,.45),inset 0 3px 0 rgba(255,255,255,.35)}
.hp.cy{background:linear-gradient(90deg,#0FA6C4,#22D3EE);color:#08213F}
.hp.np{padding:12px 34px}
.hp .num{width:54px;height:54px;border-radius:50%;background:#fff;color:#2F6BFF;display:grid;place-items:center;font-size:30px;flex:none}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 24px;border-radius:999px;font-weight:700;font-size:30px;white-space:nowrap;background:#E6F4FF;color:#142B53;box-shadow:0 10px 24px rgba(0,0,0,.32)}
.chip.y{background:#FFD23F;color:#142B53}
.chip.c{background:linear-gradient(90deg,#22D3EE,#7DEBFA);color:#08213F}
.chip.b{background:linear-gradient(90deg,#2F6BFF,#4D8DFF);color:#fff}
.chip.d{background:rgba(9,22,46,.92);color:#E6F4FF;box-shadow:0 0 0 3px rgba(34,211,238,.6),0 10px 24px rgba(0,0,0,.3)}
.chip.g{background:linear-gradient(90deg,#16A34A,#22C55E);color:#fff}
.chip.p{background:linear-gradient(90deg,#EE7FAA,#F5A0C2);color:#fff}
.lbl{position:absolute;left:220px;width:640px;padding:22px 24px 20px;border-radius:34px;text-align:center;
  background:linear-gradient(180deg,rgba(15,34,70,.95),rgba(9,22,46,.95));box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 0 3px rgba(34,211,238,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.lbl .en{font-weight:800;font-size:62px;line-height:1.08;color:#fff;letter-spacing:1px;text-shadow:0 0 22px rgba(34,211,238,.6);white-space:nowrap}
.lbl .th{font-weight:700;font-size:38px;color:#95BFEF;line-height:1.35;white-space:nowrap}
.lbl .sub{display:inline-block;margin-top:8px;font-weight:700;font-size:31px;color:#142B53;background:#FFD23F;padding:4px 22px;border-radius:22px;white-space:nowrap}
.lbl .nb{position:absolute;left:-16px;top:-20px;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#22D3EE,#2F6BFF);color:#fff;font-weight:800;font-size:30px;display:grid;place-items:center;box-shadow:0 0 0 5px #0A1730}
.ice{background:linear-gradient(180deg,#F7FBFF,#E6F4FF);color:#142B53;border-radius:40px;box-shadow:0 22px 50px rgba(0,0,0,.38),0 0 0 4px rgba(149,191,239,.8)}
.glass{background:rgba(9,22,46,.86);border-radius:30px;box-shadow:0 0 0 3px rgba(34,211,238,.5),0 18px 40px rgba(0,0,0,.35)}
.scrimB{position:absolute;left:0;width:1080px;top:1000px;height:920px;background:linear-gradient(180deg,rgba(10,23,48,0) 0%,rgba(10,23,48,.75) 30%,rgba(10,23,48,.92) 100%)}
.scrimT{position:absolute;left:0;width:1080px;top:0;height:560px;background:linear-gradient(180deg,rgba(10,23,48,.9) 0%,rgba(10,23,48,.6) 55%,rgba(10,23,48,0) 100%)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#E6F4FF 0%,#22D3EE 40%,rgba(34,211,238,0) 75%);opacity:0;pointer-events:none}
.pkt{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px}
.pkt .core{position:absolute;inset:18px;border-radius:24px;background:linear-gradient(135deg,#7DEBFA,#2F6BFF 70%);box-shadow:0 0 30px 8px rgba(34,211,238,.75),inset 0 3px 0 rgba(255,255,255,.6);display:grid;place-items:center;font-weight:800;font-size:30px;color:#fff;letter-spacing:1px}
.pkt .ring{position:absolute;inset:0;border-radius:34px;border:4px solid #22D3EE;opacity:.7}
.badge{position:absolute;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#1E447F,#0D2046 70%);box-shadow:0 0 0 4px rgba(149,191,239,.45),0 14px 30px rgba(0,0,0,.4)}
.badge .sh{position:absolute;inset:-10px;border-radius:50%;border:3px solid #22D3EE;opacity:0}
.corner{position:absolute;width:64px;height:64px;border:7px solid #95BFEF}
/* quiz option cards (engine quiz component, restyled blue + two text lines) */
.opt{left:220px;width:640px;height:128px;border-radius:32px;gap:18px;padding:0 16px;font-size:30px;
  background:linear-gradient(180deg,#F7FBFF 0%,#DDEBFB 100%);box-shadow:0 10px 0 rgba(47,107,255,.45),0 18px 30px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.9)}
.opt .b{width:76px;height:76px;flex:none;font-size:40px;background:radial-gradient(circle at 35% 30%,#6FA0FF,#2F6BFF 70%);box-shadow:0 0 0 6px #C9DDF5,0 0 0 9px #fff}
.opt .ov{border-radius:32px;background:linear-gradient(180deg,#4ADE80,#16A34A)}
.opt .chk{width:62px;height:62px;margin-top:-31px;right:14px}
.opt .tx{display:flex;flex-direction:column;gap:2px;line-height:1.25;white-space:nowrap;max-width:460px}
.opt .tx .t1{font-weight:700;font-size:31px}
.opt .tx .t2{font-weight:600;font-size:23px;color:#2F6BFF;display:flex;align-items:center;gap:6px}
.opt .tx .t2 svg path{stroke:currentColor}
.org{position:absolute;left:220px;width:640px;height:140px;display:flex;align-items:center;gap:18px;padding:0 22px 0 16px;border-radius:30px}
.org .oi{width:104px;height:104px;border-radius:26px;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#2F6BFF,#1A3E9A);box-shadow:0 0 0 4px rgba(149,191,239,.5)}
.org .ot{font-weight:800;font-size:26px;color:#22D3EE;line-height:1.2}
.org .ox{font-weight:700;font-size:29px;color:#fff;line-height:1.3;white-space:normal}
.rc{position:absolute;left:220px;width:640px;height:168px;display:flex;align-items:center;gap:20px;padding:0 24px 0 18px;border-radius:30px}
.rc .ri{width:124px;height:124px;border-radius:30px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 40% 35%,#1E447F,#0D2046 70%);box-shadow:0 0 0 3px rgba(34,211,238,.6)}
.rc .rn{font-weight:800;font-size:44px;color:#fff;line-height:1.1;white-space:nowrap;letter-spacing:.5px}
.rc .rd{font-weight:700;font-size:29px;color:#FFD23F;line-height:1.3;white-space:nowrap}
.cmp{position:absolute;left:220px;width:640px;height:430px;border-radius:36px;overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:800;font-size:32px;color:#fff;white-space:nowrap;background:linear-gradient(90deg,#2F6BFF,#4D8DFF);box-shadow:0 12px 26px rgba(47,107,255,.45),inset 0 3px 0 rgba(255,255,255,.35)}
.wm{font-weight:800;font-size:120px;letter-spacing:1px;background:linear-gradient(90deg,#7DEBFA,#2F6BFF 55%,#95BFEF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(8,20,44,.6)) drop-shadow(0 14px 22px rgba(34,211,238,.25))}
.big{font-weight:800;color:#fff;text-shadow:0 0 26px rgba(34,211,238,.55),0 6px 0 rgba(8,20,44,.6)}
</style>
