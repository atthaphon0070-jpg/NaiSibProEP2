<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP10</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
/* ---------- EP10 typography presets (Prompt = rounded, loopless modern Thai) ----------
   Headlines 700 with soft shadow (no heavy outlines); body/choices 500–600. */
.h-xl{font-weight:700;font-size:104px;line-height:1.18;color:#fff;text-shadow:0 6px 22px rgba(18,32,64,.45),0 2px 4px rgba(18,32,64,.35);letter-spacing:.5px}
.h-l{font-weight:700;font-size:58px;line-height:1.3}
.t-m{font-weight:600;font-size:40px;line-height:1.4}
.t-s{font-weight:500;font-size:30px;line-height:1.4}
.Z{position:absolute;left:190px;width:680px}              /* Central Safe Zone V2 column */
.zc{display:flex;justify-content:center}
.glass{background:rgba(255,255,255,.93);border-radius:34px;box-shadow:0 18px 40px rgba(20,30,70,.25)}
.chip2{display:inline-flex;align-items:center;gap:12px;padding:12px 28px;border-radius:40px;font-weight:600;white-space:nowrap}
.name{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:8px 22px;border-radius:26px;font-weight:700;font-size:38px;color:#fff;white-space:nowrap;box-shadow:0 10px 22px rgba(20,30,70,.25)}
.bust{position:relative;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 6px #fff,0 10px 22px rgba(20,30,70,.22)}
.bubble2{position:relative;background:#fff;border-radius:34px;padding:22px 34px;box-shadow:0 16px 36px rgba(20,30,70,.28);text-align:center}
.row{position:absolute;left:190px;width:680px;display:flex;align-items:center;gap:22px;padding:18px 22px;border-radius:32px;background:rgba(255,255,255,.95);box-shadow:0 14px 30px rgba(20,30,70,.2)}
.tf{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:22px;font-weight:700;font-size:30px;color:#fff}
.board{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#3A5C93 0%,#2A4675 55%,#22385F 100%)}
.step{position:absolute;left:190px;width:680px;display:flex;align-items:center;gap:20px;padding:16px 24px;border-radius:30px;background:rgba(255,255,255,.95);box-shadow:0 12px 26px rgba(10,20,50,.3)}
.step .n{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:34px;color:#fff;flex:none;background:linear-gradient(160deg,#F7A8C8,#EE7FAA)}
.optx{position:absolute;left:190px;width:680px;height:106px;border-radius:54px;display:flex;align-items:center;gap:18px;padding:0 16px;font-weight:600;font-size:44px;
  background:linear-gradient(180deg,#FFE9F3 0%,#FBD6E7 100%);box-shadow:0 10px 0 rgba(238,127,170,.3),0 16px 28px rgba(120,80,140,.18),inset 0 4px 0 rgba(255,255,255,.8)}
.optx .b{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 30%,#FFB3CF,#EE7FAA 70%);box-shadow:0 0 0 7px #CFE2FA,0 0 0 10px #fff;flex:none}
.optx .chk{position:absolute;right:20px;top:50%;width:72px;height:72px;margin-top:-36px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0}
.optx .ov{position:absolute;inset:0;border-radius:54px;background:linear-gradient(180deg,#7BE3AD,#3DBE7E);opacity:0}
.optx .tx{position:relative}
.guide{position:absolute;left:190px;top:300px;width:680px;height:1130px;outline:4px dashed #FF2D6B;pointer-events:none;z-index:99}
</style>
<script src="timeline.js"></script>
</head>
<body>
<div id="stage">
  <!-- ============ S1: office world — hook, story, statements ============ -->
  <div class="scene" id="s1">
    <div id="world" class="abs" style="inset:0;overflow:hidden"></div>
    <div id="ov" class="abs" style="inset:0"></div>
    <div id="flash" class="abs" style="inset:0;background:#fff;opacity:0"></div>
  </div>
  <!-- ============ S2: detective reasoning board ============ -->
  <div class="scene" id="s2"><div class="board"></div>
    <div class="abs" style="inset:0;background-image:linear-gradient(rgba(154,215,216,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(154,215,216,.10) 2px,transparent 2px);background-size:60px 60px"></div>
    <div class="abs" style="left:-200px;top:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.22),rgba(255,214,140,0) 65%)"></div>
    <div id="bd"></div></div>
  <!-- ============ S3: quiz / countdown / answer ============ -->
  <div class="scene" id="s3"><div id="qz"></div></div>
  <!-- ============ S4: promo ============ -->
  <div class="scene" id="s4"></div>
</div>

<script src="../../shared/engine/engine.js"></script>
<script src="../../shared/engine/props_story.js"></script>
<script src="../../shared/engine/props_office.js"></script>
<script src="../../shared/engine/promo.js"></script>
<script>
const { $, clamp, lerp, E, P, tf, life, bob, h, ICON, sfx } = NSP;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const FR = x => Math.round(x * T.fps) / T.fps - 1e-6;      // snap cue to its exact frame
const ZX = 190, ZW = 680, ZC = 530;                          // Central Safe Zone V2: x 190–870, y 300–1430

// ---------------- puzzle (single source of truth; verified below) ----------------
const PEOPLE = ['เอก', 'บอย', 'ชัย'];
const KIND = { 'เอก': 'Ek', 'บอย': 'Boy', 'ชัย': 'Chai' };
const COL = { 'เอก': '#5E8FD6', 'บอย': '#2FA394', 'ชัย': '#C779A8' };        // neutral identity colours
const SAY = { 'เอก': 'ผมไม่ได้หยิบแฟ้ม', 'บอย': 'เอกเป็นคนหยิบแฟ้ม', 'ชัย': 'บอยไม่ได้หยิบแฟ้ม' };
const TRUTH = { 'เอก': th => th !== 'เอก', 'บอย': th => th === 'เอก', 'ชัย': th => th !== 'บอย' };
const CASES = PEOPLE.map(th => ({ th, v: PEOPLE.map(p => TRUTH[p](th)), n: PEOPLE.filter(p => TRUTH[p](th)).length }));
if (CASES.map(c => c.n).join() !== '2,1,2' || CASES.filter(c => c.n === 1).map(c => c.th).join() !== 'บอย') throw new Error('puzzle logic mismatch');

// ---------------- helpers ----------------
const ICONS = {
  check: ICON.check, cross: ICON.cross,
  q: (s = 40, c = '#fff') => `<span style="font-weight:700;font-size:${s}px;color:${c};line-height:1">?</span>`,
  folder: s => `<svg width="${s}" height="${s * .73}" viewBox="-75 -55 150 110">${OFFICE.folderSVG()}</svg>`,
};
function bust(kind, size, bg = 'linear-gradient(160deg,#EAF3FE,#CFE3FA)') {
  const d = h(`<div class="bust" style="width:${size}px;height:${size}px;background:${bg}"></div>`);
  const ch = STORY.character(kind), k = size / 235, w = h(`<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>`);
  w.style.transform = `translate(${size / 2}px,${size * .5 + 486 * k}px) scale(${k})`; w.appendChild(ch); d.appendChild(w);
  ch.pose({ expr: 'smile' }); d.ch = ch; return d;
}
const tfTag = (ok, txt) => `<span class="tf" style="background:${ok ? 'linear-gradient(90deg,#26A269,#5FDC9B)' : 'linear-gradient(90deg,#E0517F,#EE7FAA)'}">${ok ? ICON.check('#fff', 28) : ICON.cross('#fff', 28)}${txt}</span>`;

// ======================================================================
// OFFICE WORLD (hook, story, statements)
// ======================================================================
const office = OFFICE.office($('world'));
const SC = .62, FEET = 1700, XS = { 'เอก': 1000, 'บอย': 1200, 'ชัย': 1400 }, FOLD = { x: 1150, y: 1238 };
const actors = {};
PEOPLE.forEach(p => { const ch = STORY.character(KIND[p]), w = h('<div style="position:absolute;left:0;top:0;transform-origin:0 0"></div>'); w.appendChild(ch); office.actors.appendChild(w); actors[p] = { ch, w }; });
function place(p, x, o = 1) { const a = actors[p]; a.w.style.transform = `translate(${x}px,${FEET}px) scale(${SC})`; a.w.style.opacity = o; a.w.style.visibility = o > 0 ? 'visible' : 'hidden'; }
const fold = OFFICE.folder(.9); const foldW = h('<div style="position:absolute;left:0;top:0"></div>'); foldW.appendChild(fold); office.actors.appendChild(foldW);
foldW.style.transform = `translate(${FOLD.x - 67.5}px,${FOLD.y - 49.5}px)`;
const ghost = h(`<div style="position:absolute;left:${FOLD.x - 72}px;top:${FOLD.y - 46}px;width:144px;height:96px;border-radius:14px;border:5px dashed rgba(255,255,255,.9);box-shadow:0 0 22px rgba(154,215,216,.9)"></div>`); office.actors.appendChild(ghost);
function camTrack(u, keys) {
  let i = 0; while (i < keys.length - 1 && keys[i + 1][0] <= u) i++;
  const k = keys[i], pv = keys[Math.max(0, i - 1)], e = k[4] > 0 ? E.inOut(P(u, k[0], k[4])) : 1, from = k[4] > 0 && i > 0 ? pv : k;
  return [lerp(from[1], k[1], e), lerp(from[2], k[2], e), lerp(from[3], k[3], e) * (1 + (k[3] > 1.6 ? .01 : .002) * Math.min(4, u - k[0]))];   // gentle push only on close shots
}
let CAM = [1200, 1200, 1];
const w2s = (x, y) => [540 + (x - CAM[0]) * CAM[2], 960 + (y - CAM[1]) * CAM[2]];
const LINEUP = [1208, 1348, 1.25];   // three suspects centred in the safe zone (screen x ≈ 280/530/780)

// ---------- overlays (all foreground text inside the safe zone) ----------
const OV = $('ov'), ov = html => { const el = h(html); OV.appendChild(el); return el; };
const oSweep = ov(`<div class="abs" style="left:0;top:0;width:500px;height:2400px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,246,220,.45),rgba(255,255,255,0));transform-origin:0 0"></div>`);
const oTitle = ov(`<div class="Z c" style="top:336px;text-align:center"><div style="position:absolute;left:-60px;right:-60px;top:-30px;height:340px;border-radius:50%;background:radial-gradient(ellipse,rgba(22,36,72,.55),rgba(22,36,72,0) 70%)"></div><div class="h-xl" style="position:relative;font-size:118px;line-height:1.12">ใครกำลัง<br><span style="color:#FFC2DA">โกหก?</span></div></div>`);
const oSub = ov(`<div class="Z zc c" style="top:612px"><span class="chip2" style="font-size:44px;font-weight:700;color:#fff;background:linear-gradient(90deg,#EE7FAA,#F7A8C8);box-shadow:0 12px 26px rgba(238,127,170,.45)">มีเพียง 1 คนที่พูดความจริง!</span></div>`);
const oCtx = ov(`<div class="Z zc c" style="top:712px"><span class="chip2" style="font-size:31px;background:rgba(255,255,255,.94);color:var(--navy);box-shadow:0 10px 22px rgba(20,30,70,.25)"><img src="../../shared/brand/logo.png" style="width:46px">ฝึกคิดวิเคราะห์ เตรียมสอบนายสิบตำรวจ</span></div>`);
const oQs = PEOPLE.map(() => ov(`<div class="abs c" style="left:0;top:0;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 8px 18px rgba(20,30,70,.25)">${ICONS.q(48, '#5E8FD6')}</div>`));
const oTop = ov(`<div class="Z zc c" style="top:330px"><span class="chip2" style="font-size:38px;background:rgba(255,255,255,.95);color:var(--navy);box-shadow:0 12px 26px rgba(20,30,70,.25)"><span id="oTopIc" style="display:inline-grid"></span><span id="oTopTx"></span></span></div>`);
$('oTopIc').innerHTML = ICONS.folder(58);
const oHere = ov(`<div class="abs c" style="left:0;top:0"><span class="chip2" style="font-size:32px;background:#fff;color:#3E7BD6;box-shadow:0 10px 22px rgba(20,30,70,.25)">เคยวางอยู่ตรงนี้</span></div>`);
const oSus = ov(`<div class="Z zc c" style="top:330px"><span class="chip2" style="font-size:42px;font-weight:700;color:#fff;background:linear-gradient(90deg,#3E7BD6,#6FA3E8);box-shadow:0 12px 26px rgba(30,60,140,.4)">ผู้ต้องสงสัย 3 คน</span></div>`);
const oNames = PEOPLE.map(p => ov(`<div class="abs c" style="left:0;top:0"><span class="name" style="background:${COL[p]}">${p}</span></div>`));
const oOne = ov(`<div class="Z zc c" style="top:330px"><span class="chip2" style="font-size:34px;background:rgba(255,255,255,.95);color:var(--navy)">${ICONS.folder(46)}มีคนหยิบแฟ้มไปเพียง 1 คน</span></div>`);
const oCond = ov(`<div class="Z c" style="top:425px;display:flex;flex-direction:column;align-items:center;gap:10px"><div class="glass" style="padding:22px 36px;text-align:center;box-shadow:0 18px 40px rgba(20,30,70,.3),0 0 0 6px rgba(255,255,255,.6),0 0 0 12px rgba(247,168,200,.7)"><div class="t-s" style="color:var(--muted)">เงื่อนไขสำคัญ</div><div class="h-l" style="color:var(--hot);font-size:50px;white-space:nowrap">มีคำพูดจริงเพียง 1 ประโยค</div></div><span class="chip2" style="font-size:30px;background:rgba(255,255,255,.92);color:var(--navy)">แต่ละคนให้การคนละ 1 ประโยค</span></div>`);
const oWho = ov(`<div class="Z zc c" style="top:705px"><span class="chip2" style="font-size:36px;font-weight:700;color:#fff;background:linear-gradient(90deg,#EE7FAA,#9C8FE6);box-shadow:0 12px 26px rgba(156,143,230,.45)">ใครเป็นคนหยิบแฟ้ม?</span></div>`);
// statements: name chip + speech bubble (top of zone), suspect framed below
const oStmtHdr = ov(`<div class="Z zc c" style="top:330px"><span class="chip2" style="font-size:40px;font-weight:700;color:#fff;background:linear-gradient(90deg,#3E7BD6,#6FA3E8)">ฟังคำให้การ</span></div>`);
const oStmt = PEOPLE.map(p => ov(`<div class="Z c" style="top:330px;display:flex;flex-direction:column;align-items:center;gap:16px">
  <span class="name" style="background:${COL[p]};font-size:46px;padding:10px 34px">${p}</span>
  <div class="bubble2"><div class="h-l" style="color:var(--navy);font-size:60px">“${SAY[p]}”</div>
  <svg style="position:absolute;left:50%;margin-left:-22px;bottom:-30px" width="44" height="34" viewBox="0 0 44 34"><path d="M0 0 L44 0 L22 34Z" fill="#fff"/></svg></div></div>`));
// comparison panel
const oCmp = ov(`<div class="abs" style="inset:0"></div>`);
const cmpRows = PEOPLE.map((p, i) => {
  const r = h(`<div class="row c" style="top:${330 + i * 250}px;height:226px"><div class="bx"></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><span class="name" style="background:${COL[p]};align-self:flex-start;font-size:34px;min-width:0;padding:6px 22px">${p}</span><div style="font-weight:600;font-size:44px;color:var(--navy);white-space:nowrap">“${SAY[p]}”</div></div></div>`);
  r.querySelector('.bx').appendChild(bust(KIND[p], 172)); oCmp.appendChild(r); return r;
});
const cmpCond = h(`<div class="Z zc c" style="top:1100px"><div class="glass" style="padding:20px 40px;text-align:center;box-shadow:0 18px 40px rgba(20,30,70,.3),0 0 0 6px rgba(255,255,255,.6),0 0 0 12px rgba(247,168,200,.7)"><div class="h-l" style="color:var(--hot);font-size:56px">จริงเพียง 1 ประโยค</div></div></div>`); oCmp.appendChild(cmpCond);
const cmpQ = h(`<div class="Z zc c" style="top:1270px"><span class="chip2" style="font-size:36px;font-weight:700;color:#fff;background:linear-gradient(90deg,#EE7FAA,#9C8FE6)">ใครเป็นคนหยิบแฟ้ม?</span></div>`); oCmp.appendChild(cmpQ);
const hideAll = list => list.forEach(e => tf(e, { o: 0 }));

// ---------------- HOOK ----------------
const H0 = S('hook'), hk = { vanish: 1.94, title: 2.1, sub: 3.75, ctx: 6.18, lineup: 8.11, qs: 10.92 };
sfx('riser', H0 + .1, .6); sfx('whoosh', H0 + .5, .4); sfx('freeze', H0 + hk.vanish - .3, .9); sfx('stamp', H0 + hk.vanish, 1); sfx('sparkle', H0 + hk.vanish + .2, .6);
sfx('pop', H0 + hk.title, .9); sfx('pop', H0 + hk.sub, .8); sfx('pop', H0 + hk.ctx, .7); sfx('whoosh', H0 + hk.lineup - .1, .5);
PEOPLE.forEach((p, i) => sfx('pop', H0 + hk.lineup + .2 + i * .2, .5)); PEOPLE.forEach((p, i) => sfx('pop', H0 + hk.qs + i * .25, .5));
// ---------------- STORY ----------------
const S0 = S('story'), stS = { spot: 3.44, lineup: 6.99, sus: 8.27, names: [11.80, 12.55, 13.34], one: 14.55, cond: 18.08, who: 22.13 };
sfx('whoosh', S0 + .1, .4); sfx('pop', S0 + .4, .6); sfx('whoosh', S0 + stS.spot, .4); sfx('sparkle', S0 + stS.spot + .3, .5);
sfx('whoosh', S0 + stS.lineup, .4); sfx('pop', S0 + stS.sus, .8); stS.names.forEach(n => sfx('pop', S0 + n, .8));
sfx('pop', S0 + stS.one, .7); sfx('riser', S0 + stS.cond - .7, .5); sfx('ding', S0 + stS.cond, .8); sfx('pop', S0 + stS.who, .8);
// ---------------- STATEMENTS ----------------
const M0 = S('stmt'), mS = { hdr: .2, who: [2.35, 6.60, 11.13], cmp: 15.82, cond: 18.19, q: 19.63 };
sfx('pop', M0 + mS.hdr, .7); mS.who.forEach(w => { sfx('whoosh', M0 + w - .1, .4); sfx('page', M0 + w + .4, .8); });
sfx('whoosh', M0 + mS.cmp, .5); PEOPLE.forEach((p, i) => sfx('page', M0 + mS.cmp + .2 + i * .25, .6)); sfx('ding', M0 + mS.cond, .7); sfx('pop', M0 + mS.q, .7);

function idle(p, u, extra = {}) { actors[p].ch.pose({ t: u, expr: 'smile', blink: STORY.blinkAt(u, PEOPLE.indexOf(p) * 1.1), turn: Math.sin(u * .7 + PEOPLE.indexOf(p)) * .2, ...extra }); }
function drawWorld(t) {
  const all = [oSweep, oTitle, oSub, oCtx, ...oQs, oTop, oHere, oSus, ...oNames, oOne, oCond, oWho, oStmtHdr, ...oStmt, oCmp];
  hideAll(all); $('world').style.filter = '';
  if (t < S0) {
    // ===== HOOK
    const u = t - H0, gone = u >= hk.vanish;
    foldW.style.opacity = gone ? 0 : 1;
    ghost.style.opacity = gone ? (u < hk.lineup ? clamp((u - hk.vanish) * 3) * (.7 + .3 * Math.sin(u * 5)) : 0) : 0;
    const lined = u >= hk.lineup;
    PEOPLE.forEach((p, i) => { idle(p, u); place(p, XS[p], lined ? clamp((u - hk.lineup - i * .15) * 4) : 0); });
    CAM = camTrack(u, [[0, FOLD.x, 1235, 3.0, 0], [.01, FOLD.x, 1235, 3.45, 1.9], [hk.vanish, FOLD.x, 1235, 3.2, 0], [hk.vanish + .05, FOLD.x + 20, 1180, 2.2, 1.6], [hk.lineup, ...LINEUP, 0]]);
    office.camera(CAM[0], CAM[1], CAM[2], t, CAM[2] > 2 ? .8 : .25);
    $('flash').style.opacity = clamp(1 - Math.abs(u - hk.vanish) / .12) * .9 + clamp(1 - Math.abs(u - hk.lineup) / .1) * .4;
    tf(oSweep, { x: lerp(-600, 1400, E.inOut(P(u, .35, 1.2))), y: -300, r: 18, o: u < 1.7 ? 1 : 0 });
    tf(oTitle, life(u, hk.title, 1e9, { from: .6, dy: 40, d: .7 }));
    tf(oSub, life(u, hk.sub, 1e9, { from: .5, dy: 30 }));
    tf(oCtx, life(u, hk.ctx, 1e9, { from: .5, dy: 30 }));
    PEOPLE.forEach((p, i) => { const [x, y] = w2s(XS[p], FEET - 600 * SC); tf(oQs[i], { ...life(u, hk.qs + i * .25, 1e9, { from: .2, dy: 20, el: true }), x: x - 35, y: y - 85 + bob(u, i, 5) }); });
    return;
  }
  if (t < M0) {
    // ===== STORY
    const u = t - S0;
    foldW.style.opacity = 0;
    const lined = u >= stS.lineup;
    PEOPLE.forEach((p, i) => { idle(p, u); place(p, XS[p], lined ? clamp((u - stS.lineup - i * .15) * 4) : 0); });
    ghost.style.opacity = u >= stS.spot && u < stS.lineup ? clamp((u - stS.spot) * 3) * (.7 + .3 * Math.sin(u * 5)) : 0;
    CAM = camTrack(u, [[0, 1100, 1120, 1.02, 0], [.01, 1300, 1160, 1.08, 3.3], [stS.spot, FOLD.x, 1240, 2.6, 0], [stS.lineup, ...LINEUP, 0]]);
    office.camera(CAM[0], CAM[1], CAM[2], t, CAM[2] > 2 ? .8 : .2);
    $('flash').style.opacity = clamp(1 - u / .25) * .5 + clamp(1 - Math.abs(u - stS.spot) / .1) * .4 + clamp(1 - Math.abs(u - stS.lineup) / .1) * .4;
    $('oTopTx').textContent = 'แฟ้มเอกสารสีน้ำเงินหายไปจากโต๊ะ';
    tf(oTop, life(u, .3, stS.lineup - .1, { from: .5, dy: 30 }));
    const [gx, gy] = w2s(FOLD.x, FOLD.y);
    tf(oHere, { ...life(u, stS.spot + .4, stS.lineup - .1, { from: .4, dy: 20, el: true }), x: gx - 140, y: gy - 230 });
    tf(oSus, life(u, stS.sus, stS.one - .05, { from: .5, dy: 30 }));
    PEOPLE.forEach((p, i) => { const [x, y] = w2s(XS[p], FEET - 600 * SC); tf(oNames[i], { ...life(u, stS.names[i], 1e9, { from: .3, dy: 30, el: true, d: .7 }), x: x - 75, y: y - 100 + bob(u, i, 4) }); });
