<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP34</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
#era{position:absolute;inset:0}
#era .lay{position:absolute;inset:0;opacity:0}
#era .ptc{position:absolute}
.lbl{position:absolute;left:70px;width:940px;display:flex;justify-content:center}
.lbl .in{display:flex;align-items:center;gap:16px;padding:16px 34px;border-radius:36px;font-weight:700;font-size:42px;background:linear-gradient(180deg,#fff,#FFF6FA);color:var(--navy);box-shadow:0 14px 32px rgba(60,60,120,.22),0 0 0 5px #fff,0 0 0 11px var(--ec);white-space:nowrap;line-height:1.3;text-align:center}
.cx{display:inline-flex;align-items:center;gap:12px;padding:12px 30px 12px 14px;border-radius:44px;font-weight:800;font-size:40px;color:#fff;white-space:nowrap;background:var(--ec2);box-shadow:0 12px 26px rgba(40,40,90,.25),inset 0 3px 0 rgba(255,255,255,.35)}
.cx .i{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.panel{position:absolute;border-radius:42px;background:linear-gradient(180deg,#fff,#F7F9FF);box-shadow:0 22px 46px rgba(60,70,140,.22),0 0 0 6px #fff,0 0 0 13px var(--ec)}
.cap{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:var(--navy);line-height:1.2}
.sub{font-weight:600;color:var(--muted)}
.etitle{position:absolute;left:60px;width:960px;top:430px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.etitle .yr{font-size:36px;font-weight:700;padding:10px 32px;border-radius:40px;background:#fff;color:var(--ecd);box-shadow:0 10px 22px rgba(60,60,120,.18)}
.etitle .n{font-size:168px;line-height:1.08;font-weight:800;color:var(--ecd)}
.etitle .th{font-size:88px;line-height:1.15}
.etitle .en{font-size:46px;font-weight:700;color:var(--muted);letter-spacing:1px}
.dark .etitle .en{color:#BFD3FF}
.row{position:absolute;display:flex;align-items:center;gap:22px;height:110px;padding:0 30px 0 16px;border-radius:56px;background:#fff;box-shadow:0 14px 28px rgba(60,70,140,.16),0 0 0 5px #fff;font-weight:700;font-size:40px;white-space:nowrap}
.row .nb{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:40px;flex:none}
.row b{font-weight:800}
.lead{position:absolute;height:5px;border-radius:3px;background:var(--navy);transform-origin:0 50%}
.dot{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--navy)}
.tile{position:absolute;width:430px;height:270px;border-radius:36px;background:linear-gradient(180deg,#2A3470,#1F2754);box-shadow:0 18px 36px rgba(0,0,0,.35),0 0 0 4px rgba(91,224,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;color:#fff;font-weight:800;font-size:34px;text-align:center;line-height:1.2}
.tile .art{position:absolute;left:0;right:0;top:20px;display:grid;place-items:center}
.tile i{font-style:normal;font-size:24px;font-weight:600;color:#BFD3FF}
.hudpill{display:inline-flex;align-items:center;gap:14px;padding:8px 32px 8px 10px;border-radius:44px;font-weight:800;font-size:36px;color:#fff;white-space:nowrap;box-shadow:0 10px 24px rgba(40,40,90,.28),inset 0 3px 0 rgba(255,255,255,.35)}
.hudpill .hn{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
.hdot{position:absolute;top:0;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 6px 14px rgba(40,40,90,.25);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.streak{position:absolute;left:540px;top:900px;height:6px;border-radius:3px;transform-origin:0 50%}
.stamp{position:absolute;font-weight:800;font-size:64px;color:#E0517F;border:8px solid #E0517F;border-radius:22px;padding:4px 26px;background:rgba(255,255,255,.85)}
</style>
<script src="timeline.js"></script>
<script src="env.js"></script>
</head>
<body>
<div id="stage">

  <div class="scene" id="sG3"></div>
  <div class="scene" id="sG4"></div>

  <div id="hud" class="abs" style="left:0;top:262px;width:1080px;height:160px"></div>
  <div id="warp" class="abs" style="inset:0;pointer-events:none"></div>
</div>
