<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<style>
/* EP30 Blue × Pink Fusion tokens */
:root{--fn:#142B53;--fn2:#0C1B3A;--fb:#2F6BFF;--fc:#22D3EE;--fps:#F8CFE2;--fp:#EE7FAA;--flb:#95BFEF;--fy:#FFD23F;--fbg:#FFF8FC;--ft:#31445D;--fg:#22C55E;--fr:#EF4444;--rb:#EF4444;--bb:#3B82F6}
.scene{transform:none!important}            /* camera moves are explicit per scene: keeps the safe zone exact */
#bg{background:linear-gradient(165deg,#FDE6F1 0%,#F4ECFA 40%,#E3EEFD 75%,#D6E7FC 100%)}
#nbg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#24467F 0%,#142B53 48%,#0C1B3A 100%);opacity:0}
#nbg .grid{position:absolute;left:-100px;top:-100px;width:1280px;height:2120px;background-image:linear-gradient(rgba(34,211,238,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(34,211,238,.08) 2px,transparent 2px);background-size:80px 80px}
#nbg .gl{position:absolute;border-radius:50%}
#nbg .dt{position:absolute;border-radius:50%}
#sweep{position:absolute;top:-300px;width:420px;height:2520px;background:linear-gradient(90deg,rgba(34,211,238,0),rgba(34,211,238,.35) 40%,rgba(255,255,255,.75) 50%,rgba(238,127,170,.35) 60%,rgba(238,127,170,0));visibility:hidden;pointer-events:none;mix-blend-mode:screen}
#brand{left:375px;top:222px;width:330px;justify-content:center;gap:12px;padding:6px 18px 6px 8px;border-radius:44px;background:rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(12,27,58,.25),0 0 0 3px rgba(34,211,238,.45);transform-origin:center center!important}
#brand img{width:62px}
#brand .bn{font-size:28px;color:var(--fb);text-shadow:none}
#brand .ep{font-size:17px;margin-top:4px;background:linear-gradient(90deg,#EE7FAA,#2F6BFF)}
#wipe .band:nth-child(1),#wipe .band:nth-child(5){background:#142B53!important}
#wipe .band:nth-child(2),#wipe .band:nth-child(4){background:#EE7FAA!important}
#wipe .band:nth-child(3){background:linear-gradient(180deg,#FFF0F7,#DCEBFF)!important}

.ctr{position:absolute;left:220px;width:640px;display:flex;justify-content:center;align-items:center;transform-origin:50% 50%}
.chip{display:inline-flex;align-items:center;gap:14px;padding:12px 30px;border-radius:44px;font-weight:800;line-height:1.25;white-space:nowrap;color:#fff}
.chip svg,.chip .bi{flex:none}
.chip.pk{background:linear-gradient(90deg,#EE7FAA,#F7A1C4);box-shadow:0 12px 26px rgba(238,127,170,.45),inset 0 3px 0 rgba(255,255,255,.35)}
.chip.cy{background:linear-gradient(90deg,#2F6BFF,#22D3EE);box-shadow:0 12px 26px rgba(47,107,255,.4),inset 0 3px 0 rgba(255,255,255,.3)}
.chip.nv{background:linear-gradient(180deg,#1E3D78,#142B53);box-shadow:0 0 0 4px rgba(34,211,238,.65),0 14px 28px rgba(0,0,0,.35)}
.chip.wt{background:#fff;color:var(--ft);box-shadow:0 12px 26px rgba(20,43,83,.22),0 0 0 4px rgba(238,127,170,.5)}
.chip.yl{background:linear-gradient(90deg,#FFC21A,#FFD23F);color:#142B53;box-shadow:0 12px 26px rgba(255,190,30,.45),inset 0 3px 0 rgba(255,255,255,.45)}
.chip.gr{background:linear-gradient(90deg,#16A34A,#22C55E);box-shadow:0 12px 26px rgba(34,197,94,.45),inset 0 3px 0 rgba(255,255,255,.3)}
.chip.am{background:#FFF4DC;color:#8A5200;box-shadow:0 0 0 4px #FFD58A,0 10px 22px rgba(200,140,40,.25)}
.kw{font-weight:800;color:var(--fy);line-height:1;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(255,210,63,.55),0 8px 0 rgba(0,0,0,.28)}
.hd{font-weight:800;color:#fff;line-height:1.15;text-align:center;white-space:nowrap;text-shadow:0 0 26px rgba(34,211,238,.5),0 6px 0 rgba(0,0,0,.28)}
.hl{font-weight:800;color:var(--fn);line-height:1.2;text-align:center;white-space:nowrap;text-shadow:4px 0 0 #fff,-4px 0 0 #fff,0 4px 0 #fff,0 -4px 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 10px 16px rgba(20,43,83,.2)}
.big-nr{font-weight:800;line-height:1.1;text-align:center;white-space:nowrap;background:linear-gradient(90deg,#F8CFE2,#FFFFFF 45%,#FFD23F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(238,127,170,.6)) drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.gcard{position:absolute;border-radius:34px;background:linear-gradient(180deg,rgba(30,61,120,.96),rgba(20,43,83,.96));box-shadow:0 0 0 3px rgba(34,211,238,.6),0 18px 36px rgba(0,0,0,.35)}
.lcard{position:absolute;border-radius:34px;background:linear-gradient(180deg,#fff,#F5F8FF);box-shadow:0 16px 34px rgba(20,43,83,.18),0 0 0 4px #fff,0 0 0 8px rgba(149,191,239,.5)}
.qhead{display:inline-flex;align-items:center;gap:16px;padding:10px 30px;border-radius:40px;background:linear-gradient(90deg,#142B53,#1E3D78);color:#fff;font-weight:800;font-size:38px;white-space:nowrap;box-shadow:0 0 0 4px rgba(34,211,238,.6),0 12px 24px rgba(20,43,83,.3)}
.qhead small{font-size:30px;font-weight:700;color:var(--fc)}
.qcard{position:absolute;left:220px;width:640px;padding:20px 26px;border-radius:36px;background:linear-gradient(180deg,#fff,#F3F7FF);box-shadow:0 18px 40px rgba(20,43,83,.2),0 0 0 5px #fff,0 0 0 10px rgba(238,127,170,.55)}
.qln{display:block;font-size:40px;font-weight:700;line-height:1.36;text-align:center;white-space:nowrap;border-radius:12px;color:var(--ft)}
.qln .r{color:#DC2626}.qln .b{color:#2563EB}.qln .k{color:#fff;background:#EE7FAA;border-radius:10px;padding:0 8px}
.qo{position:absolute;width:310px;height:140px;border-radius:34px;display:flex;align-items:center;gap:22px;padding:0 22px;font-weight:800;color:var(--ft);
  background:linear-gradient(180deg,#FFFFFF,#EAF2FF);box-shadow:0 8px 0 rgba(47,107,255,.25),0 14px 24px rgba(20,43,83,.16),inset 0 0 0 3px #CFE0FA;transform-origin:50% 50%}
.qo .b{position:relative;width:70px;height:70px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(160deg,#2F6BFF,#142B53)}
.qo .tx{position:relative;color:#142B53}
.qo .ov{position:absolute;inset:0;border-radius:34px;background:linear-gradient(180deg,#34D399,#16A34A);opacity:0}
.qo .mk{position:absolute;right:22px;top:50%;width:62px;height:62px;margin-top:-31px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0}
.cmpr{position:absolute;left:220px;width:640px;height:196px;border-radius:34px;background:#fff;box-shadow:0 14px 30px rgba(20,43,83,.16),0 0 0 4px rgba(149,191,239,.5);display:flex;align-items:center;gap:20px;padding:0 22px}
.cmpr .bd{width:80px;height:80px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:44px;color:#fff;background:linear-gradient(160deg,#2F6BFF,#142B53);position:relative}
.cmpr .bd .x{position:absolute;right:-12px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:#EF4444;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.cmpr .fm{display:flex;align-items:center;gap:12px;color:#142B53;font-weight:800}
.cmpr .op{font-weight:800;font-size:46px;color:#7A8BA3}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:24px;font-weight:800;font-size:30px;white-space:nowrap}
.tag.rd{background:#FEE2E2;color:#B91C1C}.tag.am{background:#FFF4DC;color:#8A5200;box-shadow:0 0 0 3px #FFD58A}.tag.gr{background:#DCFCE7;color:#15803D}
.btnC{display:inline-flex;align-items:center;justify-content:center;gap:18px;width:520px;height:108px;border-radius:56px;font-weight:800;font-size:50px;color:#fff;white-space:nowrap}
.tile{position:absolute;display:flex;align-items:center;gap:16px;padding:0 22px;border-radius:30px;font-weight:800;font-size:34px;color:var(--ft);background:#fff;box-shadow:0 12px 26px rgba(20,43,83,.18),0 0 0 4px rgba(149,191,239,.55);white-space:nowrap}
.mas{position:absolute;transform-origin:50% 100%}
.mas img{display:block;filter:drop-shadow(0 16px 20px rgba(12,27,58,.3))}

/* balls */
.pball{position:absolute;left:0;top:0;width:96px;height:96px;transform-origin:50% 50%}
.pb-body{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 8px 12px rgba(12,27,58,.3)}
.pball.red .pb-body{background:radial-gradient(circle at 34% 30%,#FFD0D0 0%,#F87171 20%,#EF4444 46%,#B91C1C 100%)}
.pball.blue .pb-body{background:radial-gradient(circle at 34% 30%,#D9EAFF 0%,#60A5FA 20%,#3B82F6 46%,#1E40AF 100%)}
.pb-spec{position:absolute;left:19px;top:13px;width:30px;height:18px;border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-32deg)}
.pb-glow{position:absolute;inset:-11px;border-radius:50%;box-shadow:0 0 0 6px #FFD23F,0 0 30px 8px rgba(255,210,63,.75);opacity:0}
.pb-n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:46px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);opacity:0;padding-top:4px}
.pchip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:40px;background:#fff;font-weight:800;font-size:32px;color:#31445D;white-space:nowrap;box-shadow:0 10px 22px rgba(20,43,83,.18),0 0 0 3px rgba(149,191,239,.6)}
.pchip .dot{width:30px;height:30px;border-radius:50%;flex:none}
.pchip .v{color:#142B53;font-size:38px}
.pchip.tot{background:linear-gradient(90deg,#142B53,#1E3D78);color:#fff;box-shadow:0 0 0 3px rgba(34,211,238,.7),0 10px 22px rgba(20,43,83,.25)}
.pchip.tot .v{color:#FFD23F}
/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;vertical-align:middle}
.frac .fn,.frac .fd{display:block;padding:0 .14em}
.frac .fn{padding-bottom:.02em}.frac .fd{padding-top:.1em}
.frac .fb{display:block;align-self:stretch;height:.085em;border-radius:.05em;background:currentColor;margin:.06em 0}
.on-nv{color:#fff}.on-nv .fn{color:#FFD23F}
.op{font-weight:800;line-height:1;color:#fff}
.lab{font-weight:800;white-space:nowrap;line-height:1.1}
.mcard{position:absolute;width:300px;height:250px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mcard .t{font-weight:800;font-size:34px;color:#22D3EE;white-space:nowrap}
.mcard .q{font-weight:800;font-size:120px;color:rgba(255,255,255,.35);line-height:1}
</style>

<body>
<div id="stage">
  <div id="nbg"><div class="grid"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div id="ng-dots"></div></div>
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div id="sweep"></div>
</div>

<script src="../../shared/engine/engine.js"></script>
<script src="probability.js"></script>
<script>
const { $, clamp, lerp, E, P, tf, bob, h, sfx, mark, pressDepth } = NSP;
const { frac, ballIcon } = PROB;
const T = window.TL, S = k => T[k][0], D = k => T[k][1];
const BT = k => Object.fromEntries(Object.entries(BEATS[k]).map(([n, v]) => [n, v[0]]));
const hb = BT('hook'), sb = BT('story'), kb = BT('know'), eb = BT('expl'), qb = BT('quiz'), ab = BT('ans'), pb = BT('promo');
const HK = S('hook'), ST = S('story'), KN = S('know'), EX = S('expl'), QS = S('quiz'), CD = S('cd'), AN = S('ans'), PR = S('promo');
const GM = k => S(k) + D(k) / 2;                      // middle of the short gap between two files = wipe centre
const B1 = GM('g1'), B2 = GM('g2'), B3 = GM('g3'), B4 = GM('g4'), B5 = GM('g5');
const GY = 470, BS = 1.1;                              // standard box group: top 470, drawn at ×1.1 about its centre (tray label ≈ 407, box ≈ 458–733)

// ---------------------------------------------------------------- helpers (EP27 conventions)
const add = (par, html) => { const e = h(html); par.appendChild(e); return e; };
const layer = par => add(par, `<div class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>`);
const ctr = (par, top, inner, cls = '') => add(par, `<div class="ctr ${cls}" style="top:${top}px">${inner}</div>`);
const chip = (txt, kind = 'pk', fs = 44, fit = 560) => `<div class="chip ${kind} sz" data-fit="${fit}" style="font-size:${fs}px">${txt}</div>`;
const backK = (p, c1 = .9) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function ent(u, a, b = 1e9, { d = .45, dy = 24, s0 = .86, out = .3 } = {}) {
  const pi = P(u, a, d), po = P(u, b, out);
  return { o: clamp(pi * 2.2) * (1 - po), s: lerp(s0, 1, backK(pi)) * (1 - .05 * E.out(po)), y: (1 - E.out(pi)) * dy - 14 * E.out(po) };
}
const show = (el, u, a, b, o) => tf(el, ent(u, a, b, o));
const fade = (u, a, b = 1e9, d = .35, out = .3) => clamp((u - a) / d) * (1 - clamp((u - b) / out));
const at = (par, x, y, html, cls = '') => add(par, `<div class="abs ${cls}" style="left:${x}px;top:${y}px">${html}</div>`);
const cntTxt = n => Math.round(n).toLocaleString('en-US');
function masDraw(el, u, a, b = 1e9, { amp = 6, ph = 0 } = {}) { const l = ent(u, a, b, { s0: .5, dy: 140, d: .7 }); tf(el, { ...l, y: l.y + bob(u, ph, amp), r: Math.sin(u * 1.7 + ph) * 2 }); }
const ICX = (s = 40, c = '#fff') => NSP.ICON.cross(c, s), ICK = (s = 40, c = '#fff') => NSP.ICON.check(c, s);
const warn = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.5L23 21.5H1Z" fill="#FFB020" stroke="#8A5200" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 9v6" stroke="#5A3500" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.2" r="1.5" fill="#5A3500"/></svg>`;
const noRet = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 2.5v4.6h-4.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 4l16 16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;
const opS = (s, fs = 70, c = '#fff') => `<span class="op sz" style="font-size:${fs}px;color:${c}">${s}</span>`;
const fracCard = (inner, x, y, w, hgt, cls = 'gcard') => `<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;display:flex;align-items:center;justify-content:center;gap:18px">${inner}</div>`;
// mini card "ครั้งที่ n" holding its own fraction (a "?" sits in the same grid cell until the fraction is built)
const miniCard = (par, x, y, title, n, d, chk = 'box:R/T') => add(par, `<div class="mcard gcard" style="left:${x}px;top:${y}px;height:214px"><div class="t sz">${title}</div><div style="display:grid;place-items:center"><div class="q sz" style="grid-area:1/1;font-size:100px">?</div><div style="grid-area:1/1">${frac(n, d, 62, { cls: 'on-nv', check: chk })}</div></div></div>`);
// numerator drops in, denominator rises in .45 s later
function buildFrac(fr, u, a, gap = .45, dist = 40) {
  tf(fr.querySelector('.fn'), { o: clamp((u - a) * 4), y: (1 - E.out(P(u, a, .4))) * -dist });
  tf(fr.querySelector('.fd'), { o: clamp((u - a - gap) * 4), y: (1 - E.out(P(u, a + gap, .4))) * dist });
  fr.querySelector('.fb').style.opacity = clamp((u - a) * 3);
}
const miniSet = (el, u, a) => { tf(el.querySelector('.q'), { o: 1 - clamp((u - a) * 4) }); buildFrac(el.querySelector('.frac'), u, a); };
// big navy card: labels (แดง n → / ทั้งหมด m →) beside a large fraction built from the box
const bigFrac = (par, y, n, d, h = 300) => add(par, `<div class="gcard" style="left:220px;top:${y}px;width:640px;height:${h}px;display:flex;align-items:center;justify-content:center;gap:34px">
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:${h * .3}px"><div class="lab sz bf-n" style="font-size:38px;color:#FF8A8A;display:flex;align-items:center;gap:8px">${ballIcon('R', 36)}แดง ${n} →</div><div class="lab sz bf-d" style="font-size:38px;color:#BFEFFF">ทั้งหมด ${d} →</div></div>
  ${frac(n, d, Math.round(h * .42), { cls: 'on-nv', check: 'box:R/T' })}</div>`);
function bigSet(el, u, a, b) { show(el, u, a - .2, b, { dy: 40 }); tf(el.querySelector('.bf-n'), { o: clamp((u - a) * 3) }); tf(el.querySelector('.bf-d'), { o: clamp((u - a - .45) * 3) }); buildFrac(el.querySelector('.frac'), u, a); }
// count-bar pop times from the box's draw events
const popFor = (u, bxr, ev) => { const r = bxr.rimTimes(ev); const last = r.filter(x => u >= x.t).pop(); return last ? { T: u - last.t, R: last.id[0] === 'R' ? u - last.t : null, B: last.id[0] === 'B' ? u - last.t : null } : {}; };

// ---------------------------------------------------------------- deep-navy layer (Blue × Pink Fusion) + light sweep
const nbg = $('nbg'), nGl = [...nbg.querySelectorAll('.gl')], nDots = [];
[[560, 'rgba(34,211,238,.20)', 300, 520], [520, 'rgba(238,127,170,.18)', 820, 1400], [620, 'rgba(47,107,255,.25)', 180, 1600]].forEach(([r, c, x, y], i) => { const g = nGl[i]; g.style.width = g.style.height = r * 2 + 'px'; g.style.background = `radial-gradient(circle,${c} 0%,rgba(0,0,0,0) 68%)`; g.dataset.x = x - r; g.dataset.y = y - r; });
for (let i = 0; i < 40; i++) { const s = 4 + (i * 7) % 9, c = ['#22D3EE', '#EE7FAA', '#FFFFFF', '#95BFEF'][i % 4]; const d = add($('ng-dots'), `<div class="dt" style="width:${s}px;height:${s}px;background:${c};box-shadow:0 0 ${s * 2}px ${c}"></div>`); nDots.push({ d, x: (i * 263) % 1080, y: (i * 547) % 1920, sp: 14 + (i * 13) % 30, ph: i * 1.3 }); }
// [start, end, fade-in s, fade-out s] (0 = instant, hidden under a wipe)
const DARK = [
  [0, B1, 0, 0],
  [B2, KN + kb.look - .1, 0, .6],
  [EX + eb.easy - .3, B4, .6, 0],
  [AN + ab.rem - .3, B5, .6, 0],
];
const darkAt = t => Math.max(0, ...DARK.map(([a, b, fi, fo]) => (t < a || t >= b) ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1)));
const SWEEPS = DARK.flatMap(([a, b, fi, fo]) => [fi ? a : null, fo ? b - fo : null]).filter(x => x !== null);
function drawFusion(t) {
  const dk = darkAt(t); nbg.style.opacity = dk; nbg.style.visibility = dk > .001 ? 'visible' : 'hidden';
  if (dk > .001) {
    nbg.querySelector('.grid').style.transform = `translate(${(t * 6) % 80}px,${(t * 14) % 80}px)`;
    nGl.forEach((g, i) => tf(g, { x: +g.dataset.x + Math.sin(t * .3 + i * 2) * 80, y: +g.dataset.y + Math.cos(t * .25 + i) * 70, s: 1 + .1 * Math.sin(t * .5 + i) }));
    nDots.forEach(p => { let y = (p.y - t * p.sp) % 1980; if (y < -40) y += 1980; tf(p.d, { x: p.x + Math.sin(t * .7 + p.ph) * 22, y, o: .35 + .35 * Math.sin(t * 1.4 + p.ph) }); });
  }
  const sw = $('sweep'); let sp = -1; SWEEPS.forEach(a => { if (t >= a - .1 && t < a + .7) sp = (t - a + .1) / .8; });
  if (sp < 0) sw.style.visibility = 'hidden'; else { sw.style.visibility = 'visible'; sw.style.transform = `translateX(${lerp(-700, 1400, E.inOut(sp))}px) rotate(14deg)`; sw.style.opacity = Math.sin(Math.PI * sp); }
}
SWEEPS.forEach(a => sfx('riser', a - .2, .5));

// spotlight behind the box (navy scenes)
const spot = (par, cx, cy, r = 420) => add(par, `<div class="abs" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:radial-gradient(circle,rgba(149,191,239,.32) 0%,rgba(34,211,238,.10) 40%,rgba(0,0,0,0) 70%)"></div>`);
// two "draw" result slots: ครั้งที่ 1 ? × ครั้งที่ 2 ?
function slots(par, top, hh = 200) {
  const el = add(par, `<div class="abs" style="left:220px;width:640px;top:${top}px;height:200px">
