<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaiSibPro EP22</title>
<link rel="stylesheet" href="../../shared/engine/engine.css">
<style>
:root{
  --ink:#0B1A3A; --ink2:#132A57; --eblue:#2F6BFF; --cyan:#22D3EE; --yel:#FFD23F; --qpink:#FF3D7F;
  --okg:#22C55E; --bad:#EF4444; --paper:#FFFFFF; --soft:#C9D6F2;
}
body{color:#fff}
/* brand header on the navy set */
#brand .bn{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#brand img{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.anc{position:absolute;width:0;height:0}
.ac{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap}
.hk{font-weight:800;color:var(--yel);line-height:1.2;text-align:center;text-shadow:0 7px 0 #071330,0 0 34px rgba(255,210,63,.35);-webkit-text-stroke:2px #071330;paint-order:stroke fill}
.big{font-weight:800;line-height:1.15;text-align:center;text-shadow:0 6px 0 #071330,0 0 28px rgba(0,0,0,.35)}
.yel{color:var(--yel)} .wht{color:#fff} .red{color:#FF6B6B} .grn{color:#4ADE80} .blu{color:#6E9BFF} .cya{color:var(--cyan)}
.pill2{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:800;white-space:nowrap;padding:10px 30px;line-height:1.25}
.lbl{font-size:52px;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.35),0 0 0 5px rgba(255,255,255,.9)}
.lbl.b{background:linear-gradient(180deg,#4D82FF,#2F6BFF)} .lbl.c{background:linear-gradient(180deg,#3FE0F5,#13B8D3);color:#06243A}
.rate{font-size:44px;background:#0F2550;box-shadow:0 10px 22px rgba(0,0,0,.35)}
.rate.b{color:#9DBBFF;box-shadow:0 0 0 5px var(--eblue),0 10px 22px rgba(0,0,0,.35)} .rate.c{color:var(--cyan);box-shadow:0 0 0 5px var(--cyan),0 10px 22px rgba(0,0,0,.35)}
.chipH{font-size:46px;color:#fff;background:rgba(19,42,87,.92);box-shadow:0 0 0 4px rgba(255,255,255,.85),0 12px 24px rgba(0,0,0,.35)}
.wbadge{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;font-weight:800;line-height:1;color:#fff;box-shadow:0 0 0 .08em #fff;vertical-align:middle;margin:0 .12em;font-size:.92em;padding-bottom:.04em}
.wbadge.b{background:var(--eblue)} .wbadge.c{background:var(--cyan);color:#06243A}
.eq{font-weight:800;font-size:72px;line-height:1.2;color:#fff;text-shadow:0 5px 0 #071330}
.eq .t{display:inline-block}
.res{font-weight:800;font-size:200px;line-height:1.1;color:var(--yel);text-shadow:0 10px 0 #071330,0 0 50px rgba(255,210,63,.55);-webkit-text-stroke:3px #071330;paint-order:stroke fill}
.resbox{position:absolute;border-radius:40px;background:radial-gradient(ellipse at center,rgba(7,19,48,.92) 0%,rgba(7,19,48,.75) 60%,rgba(7,19,48,0) 100%)}
.xmark{position:absolute;width:86px;height:86px;border-radius:50%;background:var(--bad);display:grid;place-items:center;box-shadow:0 0 0 6px #fff,0 10px 20px rgba(0,0,0,.4)}
.qcard2{position:absolute;left:190px;width:700px;padding:20px 34px;border-radius:40px;background:linear-gradient(180deg,#FFFFFF,#EEF3FF);color:var(--ink);box-shadow:0 22px 50px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.5)}
.qcard2 .ql{display:block;font-size:60px;font-weight:700;line-height:1.3;white-space:nowrap}
.qcard2 .hl{color:#B7791F;background:#FFE680;border-radius:12px;padding:0 8px}
.ch{position:absolute;height:104px;border-radius:52px;display:flex;align-items:center;gap:22px;padding:0 18px;font-weight:700;font-size:54px;color:var(--ink);
  background:linear-gradient(180deg,#FFFFFF,#E8EEFA);box-shadow:0 10px 0 rgba(0,0,0,.25),0 16px 28px rgba(0,0,0,.35)}
.ch .cb{flex:none;height:76px;padding:0 20px;border-radius:38px;display:grid;place-items:center;font-size:42px;font-weight:800;color:#fff;background:#3A4A6B}
.ch .ov{position:absolute;inset:0;border-radius:52px;background:linear-gradient(180deg,#4ADE80,#16A34A);opacity:0}
.ch .tx,.ch .cb{position:relative}
.ch .ok{position:absolute;right:16px;top:12px;width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0}
.ch .why{position:absolute;right:110px;top:50%;margin-top:-32px;height:64px;padding:0 20px;border-radius:32px;background:#FFE4E4;color:#C81E1E;font-size:38px;font-weight:800;display:flex;align-items:center;opacity:0;white-space:nowrap}
.ch .xx{position:absolute;right:16px;top:12px;width:80px;height:80px;border-radius:50%;background:var(--bad);display:grid;place-items:center;opacity:0;box-shadow:0 0 0 5px #fff}
.banner{font-weight:800;font-size:92px;color:#fff;letter-spacing:6px;padding:8px 70px;border-radius:30px;background:linear-gradient(90deg,#FF3D7F,#FF6B9A);box-shadow:0 14px 34px rgba(255,61,127,.55),inset 0 4px 0 rgba(255,255,255,.35)}
.paper{position:absolute;border-radius:26px;background:#FFFDF6;box-shadow:0 26px 50px rgba(0,0,0,.45);color:var(--ink)}
.flt{font-weight:800;font-size:76px;color:#fff;padding:12px 40px;border-radius:30px;background:rgba(19,42,87,.95);box-shadow:0 0 0 5px #FF6B6B,0 14px 30px rgba(0,0,0,.4)}
.stamp{font-weight:800;font-size:110px;color:#FF5A5A;padding:6px 44px;border:12px solid #FF5A5A;border-radius:28px;background:rgba(255,90,90,.08);letter-spacing:2px}
.bar{position:absolute;height:84px;border-radius:42px}
.mph{font-weight:800;color:var(--yel);text-align:center;line-height:1.2;text-shadow:0 7px 0 #071330,0 0 36px rgba(255,210,63,.4);-webkit-text-stroke:2px #071330;paint-order:stroke fill}
.mx{font-size:1.35em;line-height:0;font-weight:800;margin:0 .08em;vertical-align:-.04em}
.strike{position:absolute;left:-6%;width:112%;top:52%;height:16px;margin-top:-8px;border-radius:8px;background:#FF4D4D;transform-origin:left center;box-shadow:0 0 0 3px #071330}
</style>
<script src="timeline.js"></script>
<script src="beats.js"></script>
</head>
<body>
<div id="stage">
  <div class="scene" id="sbg"></div>
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s7"></div>
</div>
<script src="../../shared/engine/engine.js"></script>
<script src="../../shared/engine/props_work.js"></script>
<script src="scenes/common.js"></script>
<script src="scenes/s0_background.js"></script>
<script src="scenes/s1_hook.js"></script>
<script src="scenes/s2_story.js"></script>
<script src="scenes/s3_knowledge.js"></script>
<script src="scenes/s4_explanation.js"></script>
<script src="scenes/s5_quiz_answer.js"></script>
<script src="scenes/s7_promotion.js"></script>
<script>
const { $ } = NSP, X = EP22, T = X.T;
const scenes = [
  { el: $('sbg'), a: 0, b: 1e9, draw: SC.background($('sbg')) },
  { el: $('s1'), a: 0, b: T.story0, draw: SC.hook($('s1')) },
  { el: $('s2'), a: T.story0, b: T.know0, draw: SC.story($('s2')) },
  { el: $('s3'), a: T.know0, b: T.expl0, draw: SC.knowledge($('s3')) },
  { el: $('s4'), a: T.expl0, b: T.quiz0, draw: SC.explanation($('s4')) },
  { el: $('s5'), a: T.quiz0, b: T.promo0, draw: SC.quizAnswer($('s5')) },
  { el: $('s7'), a: T.promo0, b: 1e9, draw: SC.promotion($('s7')) },
];
NSP.start({
  ep: 'EP.22 • คณิตศาสตร์',
  brand: { showAt: 2.8, hideAt: T.promo0 + BEATS.promo.goto },
  wipes: [T.story0, T.know0, T.expl0, T.quiz0, T.promo0].map(b => b - .15),
  scenes,
});
// the background scene must not get the engine's per-scene push-in
const _r = window.renderAt; window.renderAt = t => { _r(t); $('sbg').style.transform = 'none'; };
</script>
</body>
</html>
