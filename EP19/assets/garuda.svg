<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132">
  <!-- NaiSibPro EP19: simplified, respectful Garuda emblem silhouette (original vector, symmetric, no facial expression).
       Height of the viewBox (132 units) represents the emblem height used for the 3 cm / 1.5 cm comparison. -->
  <g id="half" fill="currentColor">
    <!-- crown (chada): stacked tiers to a point -->
    <path d="M60.8 0 L57.6 7 L58.6 7.2 L56.2 13.6 L57.4 13.8 L54.8 20.4 L56 20.6 L53.4 27 L60.8 27 Z"/>
    <!-- head and beak -->
    <path d="M60.8 25 C55 25 51.6 28.4 51.6 33 C51.6 36.6 53.4 39.4 56.2 40.8 L58.2 45 L60.8 47.4 Z"/>
    <!-- ear ornament -->
    <path d="M52.4 30 C49.6 30.4 48.6 33.4 50.2 36 L52.6 35 Z"/>
    <!-- raised arm: shoulder -> elbow -> hand beside the crown -->
    <path d="M52 50 C46 49.4 41.2 48.4 38.4 45.6 C36.2 43.2 36.6 38.4 38.2 33 L40.4 25.4 C40.8 24 42.8 24.2 42.8 25.8 L42.4 33.8 C42 38.2 42.8 41 45 42.4 C47 43.6 49.6 44 52.6 44 Z"/>
    <path d="M40.4 25.6 L38.6 19.4 L41 21.6 L41.4 17.6 L43 21.4 L44.2 18.6 L44.2 24.6 Z"/>
    <!-- wing: broad feathered sweep, up and out -->
    <path d="M50 52 C40 52 28 48 18 40 C12 35 8 28 6 20 C10 24 14 26 18 27 C14 22 12.6 17 12.6 12 C16.4 17.4 20.4 20.6 24.6 22.4 C22.2 17.6 21.6 13 22.4 8.6 C25.4 14.6 29 18.8 33 21.6 C32.6 26 33 30.6 35 35 C37.6 41 43 45.4 50.6 47.4 Z"/>
    <path d="M49 55 C38 57 26 56 16 51 C10.6 48.2 6.4 44 3.6 38.6 C8.6 41.8 13.6 43.4 18.6 43.8 C14.6 40.6 12 37 10.6 32.6 C16.6 37.6 23.4 40.6 30.6 42 C36 46.6 42.4 49.6 49.8 50.6 Z" opacity=".92"/>
    <!-- torso -->
    <path d="M60.8 46 L53 47.6 C51.4 54 51.6 61 53.6 67.6 L55.8 74 L60.8 75 Z"/>
    <!-- belt sash -->
    <path d="M53.4 66.2 L60.8 67.4 L60.8 71 L54.4 69.6 Z" fill-opacity=".55"/>
    <!-- leg: thigh out, shin down, taloned foot -->
    <path d="M55.6 72.6 C50.4 74 45.6 77.6 42.6 82.6 C40.4 86.4 40.4 90.6 42.6 94.4 L46.6 101 L50.2 99.2 L47 92.6 C46 90.4 46.4 88 48.4 86 C51 83.4 54.6 81.4 58.6 80.4 Z"/>
    <path d="M46.6 100.4 L41.4 104.6 L44.6 104.2 L43.4 108 L47.2 104.8 L48 108.6 L50 102.6 Z"/>
    <!-- tail feathers fanning below -->
    <path d="M60.8 80 L56.4 81.6 L53.4 92 L50.6 106 L49 116 L52.4 111.4 L52.6 121 L55 113.6 L55.8 125.4 L57.8 116.6 L59 128 L60.8 132 Z"/>
  </g>
  <use href="#half" transform="translate(120 0) scale(-1 1)"/>
</svg>
